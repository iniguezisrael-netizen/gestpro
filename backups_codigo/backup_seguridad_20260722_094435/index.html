function _mostrarPDFOverlay(blobUrl, fname) {
  // En file:// los blob URLs no pueden cargarse en iframe ni auto-descargarse (Chrome bloquea).
  // Mostramos un toast con enlace manual.
  if (location.protocol === 'file:') {
    const old2 = document.getElementById('_pdf-toast');
    if (old2) old2.remove();
    const toast = document.createElement('div');
    toast.id = '_pdf-toast';
    toast.style.cssText = 'position:fixed;top:20px;right:20px;background:#1e293b;color:white;padding:16px 20px;border-radius:10px;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,0.5);font-size:0.9rem;max-width:320px';
    toast.innerHTML = '<div style="margin-bottom:10px;font-weight:600">📄 PDF generado</div>'
      + '<a href="' + blobUrl + '" download="' + fname + '" style="display:block;background:#2563eb;color:white;text-align:center;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:600;margin-bottom:8px">⬇ Descargar ' + fname + '</a>'
      + '<button onclick="window.open(&quot;' + blobUrl + '&quot;,&quot;_blank&quot;)&&0" style="background:#0ea5e9;color:white;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;width:100%;margin-bottom:8px">🖨️ Imprimir</button>'
      + '<button onclick="document.getElementById(&quot;_pdf-toast&quot;).remove()" style="background:#475569;color:white;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;width:100%">✕ Cerrar</button>';
    document.body.appendChild(toast);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 120000);
    return;
  }
  const old = document.getElementById('_pdf-overlay');
  if (old) old.remove();
  const ov = document.createElement('div');
  ov.id = '_pdf-overlay';
  ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:99999;display:flex;flex-direction:column';
  ov.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#1e293b;flex-shrink:0">
      <span style="color:#e2e8f0;font-weight:600;font-size:0.9rem">📄 ${fname}</span>
      <div style="display:flex;gap:8px">
        <button onclick="_imprimirPDFOverlay()" style="background:#0ea5e9;color:white;border:none;border-radius:6px;padding:6px 14px;font-size:0.82rem;cursor:pointer">🖨️ Imprimir</button>
        <a href="${blobUrl}" download="${fname}" style="background:#2563eb;color:white;border:none;border-radius:6px;padding:6px 14px;font-size:0.82rem;cursor:pointer;text-decoration:none">⬇ Descargar</a>
        <button onclick="document.getElementById('_pdf-overlay').remove()" style="background:#475569;color:white;border:none;border-radius:6px;padding:6px 14px;font-size:0.82rem;cursor:pointer">✕ Cerrar</button>
      </div>
    </div>
    <iframe id="_pdf-overlay-frame" src="${blobUrl}" style="flex:1;border:none;width:100%"></iframe>`;
  document.body.appendChild(ov);
}

function _imprimirPDFOverlay() {
  const frame = document.getElementById('_pdf-overlay-frame');
  try {
    frame.contentWindow.focus();
    frame.contentWindow.print();
  } catch(e) {
    window.open(frame.src, '_blank');
  }
}
window['_imprimirPDFOverlay'] = _imprimirPDFOverlay;

function generarPDFCotiz(c) {
  console.log('[PDF] generarPDFCotiz llamado, c=', c?.id);
  const _doBuild = () => {
    try {
      console.log('[PDF] iniciando _cargarLogoYBuildPDF...');
      _cargarLogoYBuildPDF(c, null, null, true);
    } catch(e) {
      console.error('[PDF] Error al generar:', e);
      alert('Error PDF: ' + e.message + '\n\nUsando impresión del navegador como alternativa.');
      _abrirImpresionCotiz(c);
    }
  };
  // Siempre forzar recarga de jsPDF para evitar estado corrupto
  window.jspdf = undefined;
  window.jsPDF = undefined;
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s.onload = () => { console.log('[PDF] jsPDF cargado OK, jspdf=', typeof window.jspdf, 'jsPDF=', typeof window.jsPDF); _doBuild(); };
  s.onerror = (e) => {
    console.error('[PDF] CDN bloqueado o sin internet:', e);
    alert('No se pudo cargar la librería PDF. Abriendo vista de impresión...');
    _abrirImpresionCotiz(c);
  };
  document.head.appendChild(s);
}

function _abrirImpresionCotiz(c) {
  const folio = c.folioPedido || ('COTS-' + String(c.id).padStart(5,'0'));
  const items = (c.items||[]).map(i => `<tr><td>${esc(i.concepto||i.nombre||'')}</td><td style="text-align:center">${i.cant||i.cantidad||1}</td><td style="text-align:right">$${Number(i.precio||i.precioUnit||0).toLocaleString()}</td><td style="text-align:right">$${Number(i.subtotal||((i.cant||1)*(i.precio||0))||0).toLocaleString()}</td></tr>`).join('');
  const win = window.open('', '_blank', 'width=800,height=1000');
  if (!win) { _info('El navegador bloqueó la ventana emergente. Permite popups para este sitio.'); return; }
  win.document.write(`<!DOCTYPE html><html><head><title>${folio}</title><style>body{font-family:Arial,sans-serif;font-size:12px;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px}th{background:#f5f5f5}@media print{button{display:none}}</style></head><body>
    <h2>Cotización ${folio}</h2>
    <p><strong>Para:</strong> ${esc(c.cliente||'')} &nbsp; <strong>Fecha:</strong> ${c.fecha||''}</p>
    <p><strong>Empresa:</strong> ${esc(c.ctEmpresa||'')} &nbsp; <strong>Ciudad:</strong> ${esc(c.ctCiudad||'')}</p>
    <table><tr><th>Concepto</th><th>Cant</th><th>P.Unit</th><th>Subtotal</th></tr>${items}<tr><td colspan="3"><strong>TOTAL</strong></td><td style="text-align:right"><strong>$${Number(c.total||0).toLocaleString()}</strong></td></tr></table>
    <br><button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  </body></html>`);
  win.document.close();
}

function _cargarLogoYBuildPDF(c, pdfWin, ventaOverride, autoDescargar) {
  const logoEl = document.querySelector('#login-logo, .sidebar-logo, img[alt="Campers La Cuesta"]');
  const logoSrcRaw = logoEl ? logoEl.src : '';
  if (logoSrcRaw.startsWith('data:image/')) {
    const img = new Image();
    img.onload = function() {
      _cargarFuenteYBuildPDF(c, logoSrcRaw, img.naturalWidth || img.width, img.naturalHeight || img.height, pdfWin, ventaOverride, autoDescargar);
    };
    img.onerror = () => _cargarFuenteYBuildPDF(c, null, 0, 0, pdfWin, ventaOverride, autoDescargar);
    img.src = logoSrcRaw;
    return;
  }
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    try {
      const logoB64 = canvas.toDataURL('image/png');
      _cargarFuenteYBuildPDF(c, logoB64, img.width, img.height, pdfWin, ventaOverride, autoDescargar);
    } catch(e) { _cargarFuenteYBuildPDF(c, null, 0, 0, pdfWin, ventaOverride, autoDescargar); }
  };
  img.onerror = () => _cargarFuenteYBuildPDF(c, null, 0, 0, pdfWin, ventaOverride, autoDescargar);
  if (logoSrcRaw) {
    img.src = logoSrcRaw;
  } else {
    _cargarFuenteYBuildPDF(c, null, 0, 0, pdfWin, ventaOverride, autoDescargar);
  }
}

// Carga una tipografía moderna (Poppins Bold) para el nombre de la empresa en el PDF.
// Si por cualquier motivo no se puede descargar, el PDF se genera igual con Helvetica.
function _cargarFuenteYBuildPDF(c, logoB64, logoW, logoH, pdfWin, ventaOverride, autoDescargar) {
  // Pre-carga fotos: fetch+FileReader (método 1) con fallback canvas (método 2)
  const _precargarFotos = (fontB64) => {
    const urls = (c.fotos && c.fotos.length) ? c.fotos.slice(0,4) : [];
    if (!urls.length) { _buildPDF(c, logoB64, logoW, logoH, fontB64, pdfWin, ventaOverride, autoDescargar, []); return; }
    console.log('[PDF] precargando', urls.length, 'foto(s)...');

    const _blobToB64 = blob => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });

    // Método 1: fetch (requiere CORS configurado en Firebase Storage)
    const _fetchB64 = url => new Promise(resolve => {
      const t = setTimeout(() => { console.warn('[PDF] fetch timeout:', url.slice(0,60)); resolve(null); }, 12000);
      fetch(url, { mode: 'cors', cache: 'force-cache' })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
        .then(blob => { clearTimeout(t); return _blobToB64(blob); })
        .then(b64 => { console.log('[PDF] fetch OK'); resolve(b64); })
        .catch(err => { clearTimeout(t); console.warn('[PDF] fetch falló:', err.message); resolve(null); });
    });

    // Método 2: canvas con crossOrigin (también requiere CORS)
    const _canvasB64 = url => new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      const t = setTimeout(() => resolve(null), 8000);
      img.onload = () => {
        clearTimeout(t);
        try {
          const cv = document.createElement('canvas');
          cv.width = img.naturalWidth || img.width;
          cv.height = img.naturalHeight || img.height;
          cv.getContext('2d').drawImage(img, 0, 0);
          const b64 = cv.toDataURL('image/jpeg', 0.85);
          console.log('[PDF] canvas OK');
          resolve(b64);
        } catch(e) { console.warn('[PDF] canvas tainted:', e.message); resolve(null); }
      };
      img.onerror = () => { clearTimeout(t); resolve(null); };
      img.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
    });

    // Método 3: Cloud Function proxy (servidor descarga la imagen sin CORS)
    const _storageSdkB64 = url => {
      if (!window.firebase || !url.includes('firebasestorage.googleapis.com')) return Promise.resolve(null);
      return new Promise(resolve => {
        try {
          const fn = firebase.functions().httpsCallable('proxyStorageImg');
          fn({ url })
            .then(res => {
              const b64 = res && res.data && res.data.b64;
              console.log('[PDF] proxy fn ' + (b64 ? 'OK' : 'sin datos'));
              resolve(b64 || null);
            })
            .catch(e => { console.warn('[PDF] proxy fn error:', e.message); resolve(null); });
        } catch(e) { resolve(null); }
      });
    };

    const _urlToB64 = url => {
      // Si ya es base64, devolver directo sin fetch
      if (url && url.startsWith('data:')) return Promise.resolve(url);
      // Intentar métodos en cascada
      return _fetchB64(url)
        .then(b64 => b64 || _canvasB64(url))
        .then(b64 => b64 || _storageSdkB64(url))
        .then(b64 => {
          if (!b64) console.warn('[PDF] foto no convertida:', url.slice(0,80));
          return b64;
        });
    };

    Promise.all(urls.map(_urlToB64)).then(fotosB64 => {
      const ok = fotosB64.filter(Boolean);
      console.log('[PDF] fotos listas:', ok.length, 'de', urls.length);
      _buildPDF(c, logoB64, logoW, logoH, fontB64, pdfWin, ventaOverride, autoDescargar, ok);
    });
  };
  // Cargar ambas fuentes en paralelo: Poppins Bold (subtítulos) + Montserrat Black (La Cuesta)
  const _ttfToB64 = buf => { const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.byteLength;i++) s+=String.fromCharCode(b[i]); return btoa(s); };
  const _withTimeout = (p, ms) => Promise.race([p, new Promise(res => setTimeout(() => res(null), ms))]);
  if (window._poppinsBoldB64 && window._poppinsBlackB64) { _precargarFotos(window._poppinsBoldB64); return; }
  const fetchPoppins = window._poppinsBoldB64 ? Promise.resolve(window._poppinsBoldB64)
    : _withTimeout(fetch('https://cdn.jsdelivr.net/gh/google/fonts/ofl/poppins/Poppins-Bold.ttf')
        .then(r=>r.arrayBuffer()).then(buf=>{ window._poppinsBoldB64=_ttfToB64(buf); return window._poppinsBoldB64; })
        .catch(()=>null), 4000);
  const fetchMontserrat = window._poppinsBlackB64 ? Promise.resolve(window._poppinsBlackB64)
    : _withTimeout(fetch('https://cdn.jsdelivr.net/gh/google/fonts/ofl/poppins/Poppins-Black.ttf')
        .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
        .then(buf=>{ window._poppinsBlackB64=_ttfToB64(buf); return window._poppinsBlackB64; })
        .catch(()=>null), 4000);
  console.log('[PDF] esperando fuentes (máx 4s)...');
  Promise.all([fetchPoppins, fetchMontserrat]).then(()=>{ console.log('[PDF] fuentes listas, construyendo...'); _precargarFotos(window._poppinsBoldB64); });
}

function _buildPDF(c, logoB64, logoW, logoH, fontB64, pdfWin, ventaOverride, autoDescargar, fotosB64) {
  console.log('[PDF] _buildPDF iniciado, autoDescargar=', autoDescargar);
  try {
  const { jsPDF } = window.jspdf || window;
  console.log('[PDF] jsPDF constructor=', typeof jsPDF);
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210, M = 10;
  const autor = (c.usuario || session.nombre) + (c.usuarioRol ? ` (${c.usuarioRol})` : '');
  const folio = `COTS-${String(c.folio||c.id).padStart(5,'0')}`;

  let modFont = 'helvetica';
  if (fontB64) {
    try {
      doc.addFileToVFS('Poppins-Bold.ttf', fontB64);
      doc.addFont('Poppins-Bold.ttf', 'Poppins', 'bold');
      modFont = 'Poppins';
    } catch(e) { modFont = 'helvetica'; }
  }
  // Montserrat Black para "La Cuesta"
  let displayFont = 'helvetica';
  if (window._poppinsBlackB64) {
    try {
      doc.addFileToVFS('Montserrat-Black.ttf', window._poppinsBlackB64);
      doc.addFont('Montserrat-Black.ttf', 'MontserratBlack', 'normal');
      displayFont = 'MontserratBlack';
    } catch(e) {}
  }

  function rightLabelValue(label, value, x, yy, size) {
    doc.setFontSize(size||10);
    doc.setFont('helvetica','normal');
    const valW = doc.getTextWidth(value);
    doc.setFont('helvetica','bold');
    const labW = doc.getTextWidth(label);
    const startX = x - (valW + labW);
    doc.setTextColor(30,41,59);
    doc.text(label, startX, yy);
    doc.setFont('helvetica','normal');
    doc.text(value, startX + labW, yy);
  }
  function leftLabelValue(label, value, x, yy, size) {
    doc.setFontSize(size||10);
    doc.setFont('helvetica','bold'); doc.setTextColor(30,41,59);
    doc.text(label, x, yy);
    const labW = doc.getTextWidth(label);
    doc.setFont('helvetica','normal'); doc.setTextColor(71,85,105);
    doc.text(value, x + labW, yy);
  }

  const _ventaPedido = ventaOverride || (db.ventas||[]).find(v => v.cotizRef === c.id && v.esPedido);

  function buildPage(tipo) {
    const esPedidoPage = !!_ventaPedido;
    const showCliente  = tipo !== 'produccion';
    const showPrecios  = tipo !== 'produccion';
    const showPagare   = esPedidoPage && tipo !== 'produccion';
    const showBankData = tipo !== 'produccion';

    // ── COTIZACIÓN: layout Option D ──
    if (!esPedidoPage) {
      const cW = W - M*2;
      let y = 8;

      // Logo
      let logoBottom = y;
      if (logoB64 && logoW && logoH) {
        const maxW=40, maxH=28; let lw=maxW, lh=maxW*(logoH/logoW);
        if(lh>maxH){lh=maxH;lw=maxH*(logoW/logoH);}
        try{doc.addImage(logoB64,'PNG',M,y,lw,lh);}catch(e){}
        logoBottom = y + lh;
      }
      // "La Cuesta" — helvetica bold (siempre disponible en jsPDF)
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(36); doc.setTextColor(220,38,38);
      doc.text('La Cuesta', W/2, y+20, {align:'center'});
      // Badge COTIZACIÓN
      const bdX = W-M-38, bdY = y;
      doc.setFillColor(219,234,254); doc.roundedRect(bdX,bdY,38,7,2,2,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(29,78,216);
      doc.text('COTIZACIÓN', bdX+19, bdY+4.8, {align:'center'});
      // Folio box
      const fbY = bdY+9;
      doc.setDrawColor(26,26,26); doc.setLineWidth(0.4); doc.rect(bdX,fbY,38,8);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(15,110,86);
      doc.text('#'+(c.folio||c.id), bdX+19, fbY+5.8, {align:'center'});

      y = Math.max(logoBottom, fbY+10) + 2;

      // ── BANDA NEGRA: Datos del cliente + fechas ──
      const bH=8, bY=y;
      doc.setFillColor(26,26,26); doc.rect(M,bY,cW,bH,'F');
      // "DATOS DEL CLIENTE"
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
      doc.text('DATOS DEL CLIENTE', M+3, bY+5.2);
      // Etiqueta CLIENTE amarilla — alineada a la derecha igual que UNIDAD/DETALLE
      const badgeW = 16, badgeX = M+cW-badgeW-1;
      doc.setFillColor(245,197,24); doc.roundedRect(badgeX, bY+1.5, badgeW, 4.5, 0.8, 0.8, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(17,17,17);
      doc.text('CLIENTE', badgeX+badgeW/2, bY+4.6, {align:'center'});
      // Fecha de cotización
      const dateX = M + cW*0.44;
      doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(170,170,170);
      doc.text('Fecha de cotización:', dateX, bY+3);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
      doc.text(fechaLarga(c.fecha), dateX, bY+6.8);
      // Vigencia
      const vigX = M + cW*0.72;
      doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(170,170,170);
      doc.text('Vigencia:', vigX, bY+3);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(245,197,24);
      const vigTxt = c.validez!=null ? c.validez+' días' : (c.fechaEntrega||'—');
      doc.text(vigTxt, vigX, bY+6.8);
      y += bH;

      // ── CAMPOS DEL CLIENTE (2 filas, fondo amarillo suave) ──
      const fH=11, fW=cW/4;
      doc.setFillColor(255,255,248);
      doc.rect(M, y, cW, fH*2, 'F');
      // Borde amarillo alrededor del bloque (banda + campos)
      doc.setDrawColor(245,197,24); doc.setLineWidth(0.2);
      doc.rect(M, bY, cW, bH+fH*2);

      const drawField = (lbl, val, fx, fy) => {
        doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(146,64,14);
        doc.text(lbl.toUpperCase(), fx+2, fy+3.8);
        const valStr = String(val||'—');
        let fs = 10;
        doc.setFont('helvetica','bold'); doc.setFontSize(fs); doc.setTextColor(0,0,0);
        // Reducir fuente hasta que el texto quepa en el ancho de la columna
        while (fs > 6.5 && doc.getTextWidth(valStr) > fW - 5) { fs -= 0.5; doc.setFontSize(fs); }
        doc.text(valStr, fx+2, fy+9.5);
      };

      const row1 = [
        ['Nombre', (c.ctNombre||'')+(c.ctApellido?' '+c.ctApellido:'')||c.cliente],
        ['Teléfono', c.ctTelFijo],
        ['Celular', c.ctCelular],
        ['Correo', c.ctCorreo],
      ];
      row1.forEach(([l,v],i) => {
        const fx=M+i*fW;
        if(i>0){doc.setDrawColor(254,243,199);doc.setLineWidth(0.2);doc.line(fx,y,fx,y+fH);}
        drawField(l,v,fx,y);
      });

      doc.setDrawColor(254,243,199); doc.setLineWidth(0.3);
      doc.line(M, y+fH, M+cW, y+fH);
      y += fH;

      const row2 = [
        ['Dirección', c.ctDireccion],
        ['Empresa', (c.ctEmpresa&&c.ctEmpresa!=='No aplica')?c.ctEmpresa:'—'],
        ['Colonia', c.ctColonia],
        ['Ciudad/Municipio', c.ctCiudad],
      ];
      row2.forEach(([l,v],i) => {
        const fx=M+i*fW;
        if(i>0){doc.setDrawColor(254,243,199);doc.setLineWidth(0.2);doc.line(fx,y,fx,y+fH);}
        drawField(l,v,fx,y);
      });
      y += fH + 4;

      // ── SPECS (borde rojo) ──
      const shH=8;
      doc.setFillColor(26,26,26); doc.rect(M,y,cW,shH,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
      doc.text('ESPECIFICACIONES DE LA UNIDAD', M+3, y+5.2);
      doc.setFillColor(192,57,43); doc.roundedRect(M+cW-25,y+1.5,23,4.5,0.8,0.8,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(255,255,255);
      doc.text('UNIDAD', M+cW-13.5, y+4.6, {align:'center'});
      const specH=11;
      doc.setFillColor(255,248,248); doc.rect(M,y+shH,cW,specH,'F');
      doc.setDrawColor(192,57,43); doc.setLineWidth(0.2);
      doc.rect(M,y,cW,shH+specH);
      const specItems=[['Unidad',c.unidad],['Tipo',c.tipo],['Forro ext.',c.forro],['Color',c.color]];
      specItems.forEach(([l,v],i)=>{
        const fx=M+i*fW;
        if(i>0){doc.setDrawColor(252,165,165);doc.setLineWidth(0.2);doc.line(fx,y+shH,fx,y+shH+specH);}
        doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(127,29,29);
        doc.text(l.toUpperCase(), fx+2, y+shH+3.8);
        const valStr = String(v||'—');
        let sfs = 10;
        doc.setFont('helvetica','bold'); doc.setFontSize(sfs); doc.setTextColor(0,0,0);
        while (sfs > 6.5 && doc.getTextWidth(valStr) > fW - 5) { sfs -= 0.5; doc.setFontSize(sfs); }
        doc.text(valStr, fx+2, y+shH+9.5);
      });
      y += shH+specH+4;

      // ── DESCRIPCIÓN + FOTOS (lado a lado: 2/3 desc | 1/3 fotos 2×2) ──
      const _fotosArr = fotosB64 && fotosB64.length ? fotosB64 : [];
      const descColW = _fotosArr.length ? Math.round(cW*3/5) : cW;
      const fotoColW = cW - descColW;

      // Líneas de descripción con ancho correcto
      // IMPORTANTE: fijar el font antes de splitTextToSize para que use las métricas correctas
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      const descLines = [];
      if(c.observaciones) doc.splitTextToSize(c.observaciones, descColW-10).forEach(l=>descLines.push(l));
      // Solo mostrar items si no hay observaciones escritas
      if(!c.observaciones && c.items&&c.items.length) c.items.forEach(it=>{
        const sub=fmt((it.cantidad||1)*it.precio);
        const line=`• ${it.producto||it.concepto||'-'}  x${it.cantidad||1}  —  $${sub}`;
        doc.splitTextToSize(line, descColW-10).forEach(l=>descLines.push(l));
      });

      const dhH=8;
      // Calcular tamaño de fotos usando dimensiones reales de cada imagen
      const fotoPad=3, fotoGap=2;
      const fotoNCols = (_fotosArr.length >= 3) ? 2 : 1;
      const fotoNRows = (_fotosArr.length === 0) ? 0 : (_fotosArr.length <= 2) ? _fotosArr.length : 2;
      const fotoW2 = _fotosArr.length ? Math.floor((fotoColW-fotoPad*2-(fotoNCols-1)*fotoGap)/fotoNCols) : 0;
      // Obtener aspect ratio real de cada foto (height/width) — fallback 0.65 (paisaje)
      function _fotoRatio(b64) {
        try { const img = new Image(); img.src = b64; if (img.naturalWidth) return img.naturalHeight/img.naturalWidth; } catch(e){}
        return 0.65;
      }
      // Altura máxima entre las fotos de cada fila para calcular el bloque total
      const _ratios = _fotosArr.slice(0,4).map(_fotoRatio);
      const _rowH = (row) => {
        const idxs = _fotosArr.slice(0,4).map((_,i)=>i).filter(i=>Math.floor(i/fotoNCols)===row);
        return idxs.length ? Math.round(fotoW2 * Math.max(...idxs.map(i=>_ratios[i]||0.65))) : 0;
      };
      const _rowHeights = Array.from({length: fotoNRows}, (_,r) => _rowH(r));
      const minFotoBodyH = _fotosArr.length ? fotoPad + _rowHeights.reduce((a,b)=>a+b,0) + (fotoNRows-1)*fotoGap + fotoPad : 0;

      // ── Calcular altura del bloque ──
      // El TOTAL+BANCO se mete al fondo de la columna izquierda para aprovechar el espacio en blanco
      const bkRH=10, bkTotalH=bkRH*3, tLightH=bkTotalH-11;
      const tW=cW*0.56, bkW=cW*0.40, gap=cW-tW-bkW;
      const textH = Math.max(14, 6+descLines.length*6);
      const leftNeedH = textH + 4 + bkTotalH; // texto + separación + bloque total
      const dbH = Math.max(leftNeedH, minFotoBodyH);

      // Banda negra de encabezado (ancho total)
      doc.setFillColor(26,26,26); doc.rect(M,y,cW,dhH,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
      doc.text('DESCRIPCIÓN / CONCEPTOS', M+3, y+5.2);
      if (_fotosArr.length) {
        doc.setFillColor(85,85,85);
        doc.roundedRect(M+descColW+fotoPad, y+1.5, fotoColW-fotoPad*2, 4.5, 0.8, 0.8, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(255,255,255);
        doc.text('FOTOS', M+descColW+fotoColW/2, y+4.6, {align:'center'});
      } else {
        doc.setFillColor(85,85,85); doc.roundedRect(M+cW-23,y+1.5,21,4.5,0.8,0.8,'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(255,255,255);
        doc.text('DETALLE', M+cW-12.5, y+4.6, {align:'center'});
      }

      // Cuerpo — descripción (columna izquierda)
      doc.setFillColor(250,250,250); doc.rect(M,y+dhH,descColW,dbH,'F');
      doc.setDrawColor(26,26,26); doc.setLineWidth(0.2); doc.rect(M,y,cW,dhH+dbH);
      if (_fotosArr.length) {
        doc.setLineWidth(0.3); doc.line(M+descColW,y,M+descColW,y+dhH+dbH);
      }
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(0,0,0);
      descLines.forEach((l,i)=>doc.text(l,M+4,y+dhH+6+i*6));

      // Fotos (columna derecha) — solo si hay fotos
      if (_fotosArr.length) {
        doc.setFillColor(245,245,245); doc.rect(M+descColW,y+dhH,fotoColW,dbH,'F');
        const fxBase=M+descColW+fotoPad, fyBase=y+dhH+fotoPad;
        _fotosArr.slice(0,4).forEach((b64,i)=>{
          const col=i%fotoNCols, row=Math.floor(i/fotoNCols);
          const fyOffset = _rowHeights.slice(0,row).reduce((a,b)=>a+b+fotoGap,0);
          const fx=fxBase+col*(fotoW2+fotoGap), fy=fyBase+fyOffset;
          const fh = Math.round(fotoW2*(_ratios[i]||0.65));
          const _fmt=b64.startsWith('data:image/png')?'PNG':b64.startsWith('data:image/webp')?'WEBP':'JPEG';
          try{doc.addImage(b64,_fmt,fx,fy,fotoW2,fh,'foto'+i,_fmt==='PNG'?'NONE':'SLOW');}catch(e){console.warn('addImage error:',e);}
        });
      }

      // ── TOTAL + BANCO — justo después del texto (sin hueco blanco) ──
      const totalBlockY = y + dhH + textH + 3;
      const totalBarH = 8; // barra negra del total
      const subIvaH = 0; // sin desglose
      const totalSectionH = totalBarH;
      doc.setFillColor(26,26,26); doc.rect(M, totalBlockY, tW, totalBarH, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(245,197,24);
      doc.text('$'+fmt(c.total), M+tW-3, totalBlockY+6, {align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(200,200,200);
      doc.text(c.iva ? '+IVA (16%)' : 'Neto', M+4, totalBlockY+5.5);
      doc.setDrawColor(26,26,26); doc.setLineWidth(0.2); doc.rect(M, totalBlockY, tW, totalSectionH);
      // Banco (3 filas) — alineado con el bloque de total
      const bkX=M+tW+gap;
      const bkRHn=7; // altura reducida por fila de banco
      const bkTotalHn=bkRHn*3;
      doc.setFillColor(250,250,250); doc.rect(bkX, totalBlockY, bkW, bkTotalHn, 'F');
      doc.setDrawColor(26,26,26); doc.setLineWidth(0.2); doc.rect(bkX, totalBlockY, bkW, bkTotalHn);
      const bankRows=[['BANCO','BBVA · 0478205647'],['CLABE','012336004782056478'],['TITULAR','Amanda Lopez Galindo']];
      bankRows.forEach(([l,v],i)=>{
        const ry=totalBlockY+i*bkRHn;
        if(i>0){doc.setDrawColor(226,232,240);doc.setLineWidth(0.15);doc.line(bkX,ry,bkX+bkW,ry);}
        doc.setFont('helvetica','bold'); doc.setFontSize(5); doc.setTextColor(85,85,85);
        doc.text(l, bkX+2, ry+2.5);
        doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(0,0,0);
        doc.text(String(v).substring(0,26), bkX+2, ry+6.5);
      });
      y += dhH + dbH + 5;

      // ── NOTA + FIRMA ──
      doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(85,85,85);
      doc.setDrawColor(209,213,219); doc.setLineWidth(1.5);
      doc.line(M, y, M, y+5);
      doc.text('• Precios sujetos a cambios sin previo aviso mientras no haya anticipo.', M+3, y+3.5);
      y += 12;
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(85,85,85);
      doc.text('Elaboró: ', M, y);
      doc.setFont('helvetica','bold'); doc.setTextColor(0,0,0);
      doc.text(autor, M+doc.getTextWidth('Elaboró: '), y);
      // Línea de firma
      const firmaX=W/2-30, firmaY=y+16;
      doc.setDrawColor(30,41,59); doc.setLineWidth(0.4);
      doc.line(firmaX, firmaY, firmaX+60, firmaY);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(30,41,59);
      doc.text('Firma de aceptación', W/2, firmaY+5, {align:'center'});

      // ── PIE ──
      const footY=274;
      doc.setDrawColor(226,232,240); doc.setLineWidth(0.4);
      doc.line(M,footY,W-M,footY);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(100,116,139);
      doc.text('Crucero Arandas #900, Col. el Crucero de Arandas, Tepatitlán, Jalisco, México', W/2, footY+5, {align:'center'});
      doc.text('Tel: 378-70-100-90  ·  WhatsApp: 378-710-5467  ·  ventas@camperslacuesta.com  ·  www.camperslacuesta.com', W/2, footY+11, {align:'center'});

      return; // Fin layout cotización Option D
    }

    // ── SELLO DE COPIA ──
    if (esPedidoPage) {
      const sellos = { cliente:'COPIA CLIENTE', empresa:'COPIA EMPRESA', produccion:'PRODUCCIÓN' };
      const cols   = { cliente:[37,99,235], empresa:[5,150,105], produccion:[234,88,12] };
      const [r,g,b] = cols[tipo];
      doc.setFillColor(r,g,b);
      doc.roundedRect(W-M-44, 5, 46, 8, 1.5, 1.5, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
      doc.text(sellos[tipo], W-M-21, 10.5, {align:'center'});
    }

    // ── ENCABEZADO ──
    const headerY = 16;
    let logoBottom = headerY;
    if (logoB64 && logoW && logoH) {
      const maxW = 75, maxH = 65;
      let lw = maxW, lh = maxW * (logoH / logoW);
      if (lh > maxH) { lh = maxH; lw = maxH * (logoW / logoH); }
      try { doc.addImage(logoB64, 'PNG', M, headerY, lw, lh); } catch(e) {}
      logoBottom = headerY + lh;
    }

    if (esPedidoPage) {
      const pedidoLabel = _ventaPedido.folioPedido || `PED-${String(_ventaPedido.id).padStart(5,'0')}`;
      if (!c._sinCotiz) {
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100,116,139);
        doc.text(`Cotización #${c.folio||c.id}`, W - M, headerY + 7, { align: 'right' });
      }
      doc.setFont(modFont, 'bold'); doc.setTextColor(30,41,59); doc.setFontSize(19);
      doc.text(`PEDIDO ${pedidoLabel}`, W - M, c._sinCotiz ? headerY + 16 : headerY + 18, { align: 'right' });
    } else {
      const folioMostrar = c.folioPedido || null;
      if (folioMostrar) {
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100,116,139);
        doc.text(`# Pedido: ${folioMostrar}`, W - M, headerY + 8, { align: 'right' });
      }
      doc.setFont(modFont, 'bold'); doc.setTextColor(30,41,59); doc.setFontSize(17);
      doc.text(`COTIZACIÓN #${c.folio||c.id}`, W - M, folioMostrar ? headerY + 18 : headerY + 16, { align: 'right' });
    }

    const lineY = Math.max(logoBottom, headerY + 20) + 4;
    doc.setDrawColor(226,232,240); doc.setLineWidth(0.5);
    doc.line(M, lineY, W - M, lineY);
    let y = lineY + 10;

    // ── DATOS DEL CLIENTE ──
    if (showCliente) {
      leftLabelValue('Para: ', c.cliente, M, y, 11);
      rightLabelValue('Fecha: ', fechaLarga(c.fecha), W - M, y, 10);
      y += 6;
      const ctParts = [
        c.ctEmpresa && c.ctEmpresa!=='No aplica' ? `Empresa: ${c.ctEmpresa}` : '',
        c.ctCiudad  && c.ctCiudad !=='No aplica' ? `Ciudad: ${c.ctCiudad}${c.ctEstado&&c.ctEstado!=='No aplica'?', '+c.ctEstado:''}` : '',
        c.ctTelFijo && c.ctTelFijo!=='No aplica' ? `Tel.: ${c.ctTelFijo}` : '',
        c.ctCelular && c.ctCelular!=='No aplica' ? `Cel.: ${c.ctCelular}` : '',
      ].filter(Boolean);
      if (ctParts.length) {
        doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
        doc.text(ctParts.join('   ·   '), M, y);
      }
      y += 6;
      leftLabelValue('Elaborado por: ', autor, M, y, 10);
      if (c.validez!=null) rightLabelValue('Vigencia: ' + c.validez + ' días', '', W - M, y, 10);
      if (c.fechaEntrega) { y += 5; rightLabelValue('Tiempo de fabricación: ', c.fechaEntrega, W - M, y, 10); }
    } else {
      rightLabelValue('Fecha: ', fechaLarga(c.fecha), W - M, y, 10);
      if (c.fechaEntrega) { y += 5; rightLabelValue('Tiempo de fabricación: ', c.fechaEntrega, W - M, y, 10); }
    }
    y += 12;

    // ── ESPECIFICACIONES ──
    const specs = [
      c.unidad ? `Unidad: ${c.unidad}` : '',
      c.tipo   ? `Tipo: ${c.tipo}` : '',
      c.forro  ? `Forro ext.: ${c.forro}` : '',
      c.color  ? `Color: ${c.color}` : '',
    ].filter(Boolean);
    if (specs.length) {
      doc.setFontSize(9.5);
      const lines = doc.splitTextToSize(specs.join('   ·   '), W - M*2 - 10);
      const boxH = 6 + lines.length*5;
      doc.setFillColor(241,245,249);
      doc.roundedRect(M, y, W - M*2, boxH, 2, 2, 'F');
      doc.setFont('helvetica','normal'); doc.setTextColor(51,65,85);
      lines.forEach((ln,i)=> doc.text(ln, M+5, y+6+i*5));
      y += boxH + 6;
    }

    // ── OBSERVACIONES ──
    if (c.observaciones) {
      doc.setFontSize(9.5);
      const obsLines = doc.splitTextToSize(`Observaciones: ${c.observaciones}`, W - M*2 - 10);
      const boxH = 6 + obsLines.length*5;
      doc.setFillColor(254,249,195);
      doc.roundedRect(M, y, W - M*2, boxH, 2, 2, 'F');
      doc.setTextColor(120,53,15);
      obsLines.forEach((ln,i)=>{
        if (i===0) {
          doc.setFont('helvetica','bold');
          doc.text('Observaciones: ', M+5, y+6);
          doc.setFont('helvetica','normal');
          doc.text(ln.replace('Observaciones: ',''), M+5+doc.getTextWidth('Observaciones: '), y+6);
        } else {
          doc.setFont('helvetica','normal');
          doc.text(ln, M+5, y+6+i*5);
        }
      });
      y += boxH + 6;
    }

    // ── TABLA DE CONCEPTOS ──
    const tableW = W - M*2;
    if (showPrecios) {
      const cQty = M + tableW*0.62, cPrice = M + tableW*0.80, cSub = W - M;
      doc.setFillColor(241,245,249);
      doc.rect(M, y, tableW, 8, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(71,85,105);
      doc.text('CONCEPTO / SERVICIO', M+4, y+5.5);
      doc.text('CANT.', cQty, y+5.5, {align:'right'});
      doc.text('PRECIO UNIT.', cPrice, y+5.5, {align:'right'});
      doc.text('SUBTOTAL', cSub, y+5.5, {align:'right'});
      y += 8;
      c.items.forEach((item)=>{
        const rh = 8;
        doc.setDrawColor(226,232,240); doc.setLineWidth(0.2);
        doc.line(M, y+rh, M+tableW, y+rh);
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(30,41,59);
        doc.text(String(item.producto).substring(0,50), M+4, y+5.5);
        doc.text(String(item.cantidad), cQty, y+5.5, {align:'right'});
        doc.text(`$${fmt(item.precio)}`, cPrice, y+5.5, {align:'right'});
        doc.setFont('helvetica','bold');
        doc.text(`$${fmt(item.cantidad*item.precio)}`, cSub, y+5.5, {align:'right'});
        y += rh;
      });
      // ── SALTO DE PÁGINA si ya no hay espacio para el bloque de totales + pie ──
      if (y > 155) { doc.addPage(); y = M; }
      y += 10;
      doc.setFont(modFont, 'bold'); doc.setFontSize(15); doc.setTextColor(15,23,42);
      doc.text(`TOTAL: $${fmt(c.total)}`, W - M, y, { align: 'right' });
      y += 5;
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(100,116,139);
      doc.text(c.iva ? '+IVA (16%)' : 'Neto', W - M, y, { align: 'right' });
    } else {
      // Producción: solo concepto + cantidad
      const cQtyP = W - M;
      doc.setFillColor(241,245,249);
      doc.rect(M, y, tableW, 8, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(71,85,105);
      doc.text('CONCEPTO / SERVICIO', M+4, y+5.5);
      doc.text('CANT.', cQtyP, y+5.5, {align:'right'});
      y += 8;
      c.items.forEach((item)=>{
        const rh = 8;

      const colW = (W - M*2) / 2;

function descargarApp() {
  // Lee el HTML actual
  const html = document.documentElement.outerHTML;
  // Inyecta los datos actuales como script al inicio del body
  const datos = {
    gp_users: JSON.stringify(db.users),
    gp_materia: JSON.stringify(db.materia),
    gp_productos: JSON.stringify(db.productos),
    gp_consignacion: JSON.stringify(db.consignacion),
    gp_ventas: JSON.stringify(db.ventas),
    gp_cotizaciones: JSON.stringify(db.cotizaciones),
    gp_nextid: JSON.stringify(nextId)
  };
  const scriptDatos = `<script id="datos-precargados">
(function(){
  var d=${JSON.stringify(datos)};
  for(var k in d){ try{ if(!localStorage.getItem(k)) localStorage.setItem(k,d[k]); }catch(e){} }
})();
<\/script>`;
  // Inserta justo después de <head>
  const htmlFinal = html.replace('<head>', '<head>' + scriptDatos);
  const blob = new Blob([htmlFinal], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const fecha = new Date().toISOString().slice(0,10);
  a.download = `GestPro_${fecha}.html`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderAgenda() {
  const el = document.getElementById('page-agenda');
  const isAdmin = can(['admin']);
  const canEdit = can(['admin','secretaria','auxiliar']);
  const hoy = new Date().toISOString().slice(0,10);

  const todas = (db.agenda||[]).filter(c => c.estado !== 'Cancelada').sort((a,b) => (a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  const items = filtro === 'proximas'
    ? todas.filter(c => c.fecha >= hoy)
    : filtro === 'hoy'
      ? todas.filter(c => c.fecha === hoy)
      : filtro === 'pasadas'
        ? todas.filter(c => c.fecha < hoy || c.estado === 'Completada').reverse()
        : todas.slice().reverse();

  el.innerHTML = `
    <div class="card">
      <div class="card-header">

      </div>

        ${['proximas','hoy','pasadas','todas'].map(f => `
          <button class="btn btn-sm" style="background:${filtro===f?'var(--primary)':'#e2e8f0'};color:${filtro===f?'white':'#475569'}"
            onclick="window._agendaFiltro='${f}';renderAgenda()">
            ${{proximas:'📆 Próximas',hoy:'📍 Hoy',pasadas:'✅ Pasadas',todas:'📋 Todas'}[f]}
          </button>`).join('')}
      </div>

      ${items.length ? `
        <div style="display:flex;flex-direction:column;gap:10px">
          ${items.map(c => {
            const esHoy = c.fecha === hoy;
            const esPasada = c.fecha < hoy;
            const badgeColor = c.estado==='Completada'?'badge-green':c.estado==='Cancelada'?'badge-red':esHoy?'badge-blue':'badge-yellow';
            return `
            <div style="border:1.5px solid ${esHoy?'var(--primary)':esPasada&&c.estado!=='Completada'?'#fca5a5':'var(--border)'};border-radius:10px;padding:14px 16px;background:${esHoy?'#eff6ff':esPasada&&c.estado!=='Completada'?'#fff7f7':'white'};display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
              ${isAdmin && (c.estado==='Completada' || esPasada) ? `<input type="checkbox" class="ag-chk" data-id="${c.id}" style="margin-top:4px;width:16px;height:16px;flex-shrink:0;cursor:pointer" />` : ''}
              <div style="flex:1;min-width:200px">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
                  <strong style="font-size:0.95rem">${esc(c.cliente)}</strong>
                  ${c.pedido?`<span style="font-size:0.78rem;font-weight:600;color:#2563eb;background:#eff6ff;padding:1px 7px;border-radius:6px;white-space:nowrap">${esc(c.pedido)}</span>`:''}
                  <span class="badge ${badgeColor}">${c.estado}</span>
                  ${esHoy?'<span class="badge badge-blue">Hoy</span>':''}
                </div>
                <div style="font-size:0.85rem;color:var(--text-light);display:flex;flex-wrap:wrap;gap:12px;margin-top:4px">
                  <span>📅 ${fechaLarga(c.fecha)} ${c.hora?'⏰ '+c.hora:''}</span>
                  <span>🔧 ${esc(c.tipo||'Instalación')}</span>
                  ${c.asignado?`<span>👤 Por: ${esc(c.asignado)}</span>`:''}

                <button class="btn btn-outline btn-sm" onclick="verCita(${c.id})">🔍</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      ` : `<div style="text-align:center;padding:40px;color:#94a3b8">
          ${filtro==='hoy'?'No hay citas para hoy.':filtro==='proximas'?'No hay citas próximas pendientes.':'Sin registros.'}

function _agAutoFill(nombre) {
  if (!nombre.trim()) return;
  const key = nombre.trim().toLowerCase();
  const telEl = document.getElementById('ag-tel');
  if (telEl && !telEl.value) {
    const cl = (db.clientes||[]).find(c => c.nombre && c.nombre.trim().toLowerCase() === key);
    if (cl && (cl.telefono||cl.tel)) telEl.value = cl.telefono || cl.tel;
  }
  const pedidoEl = document.getElementById('ag-pedido');
  if (!pedidoEl) return;
  const vts = (db.ventas||[]).filter(v => v.cliente && v.cliente.trim().toLowerCase() === key && v.estado !== 'Cancelada');
  if (!vts.length) return;
  const last = vts.reduce((a, b) => (b.id > a.id ? b : a));
  const folio = last.folioPedido || (last.esPedido ? `PED-${String(last.id).padStart(5,'0')}` : `COT-${String(last.id).padStart(5,'0')}`);
  pedidoEl.value = folio;
}

function _agHideSugs() {
  const d = document.getElementById('ag-sugs-float');
  if (d) d.remove();
  if (window._agDocListener) { document.removeEventListener('mousedown', window._agDocListener); window._agDocListener = null; }
}

function _agShowSugs(query) {
  _agHideSugs();
  const inp = document.getElementById('ag-cliente');
  if (!inp) return;
  const q = (query||'').trim().toLowerCase();
  const clientMap = new Map();
  (db.clientes||[]).forEach(cl => {
    if (!cl.nombre) return;
    const key = cl.nombre.trim().toLowerCase();
    if (!clientMap.has(key)) clientMap.set(key, { nombre: cl.nombre.trim(), telefono: cl.telefono||cl.tel||'', pedido: '', _lastId: -1 });
  });
  (db.ventas||[]).filter(v => v.cliente && v.estado !== 'Cancelada').forEach(v => {
    const key = v.cliente.trim().toLowerCase();
    const folio = v.folioPedido || (v.esPedido ? `PED-${String(v.id).padStart(5,'0')}` : `COT-${String(v.id).padStart(5,'0')}`);
    if (!clientMap.has(key)) clientMap.set(key, { nombre: v.cliente.trim(), telefono: v.telefono||'', pedido: folio, _lastId: v.id });
    else { const ex = clientMap.get(key); if (v.id > ex._lastId) { ex.pedido = folio; ex._lastId = v.id; } if (v.telefono && !ex.telefono) ex.telefono = v.telefono; }
  });
  let matches = [...clientMap.values()];
  if (q) matches = matches.filter(m => m.nombre.toLowerCase().includes(q));
  else matches = matches.filter(m => m.pedido);
  matches.sort((a,b) => a.nombre.localeCompare(b.nombre));
  matches = matches.slice(0, 15);
  if (!matches.length) return;
  window._agSugItems = matches;
  const rect = inp.getBoundingClientRect();
  const d = document.createElement('div');
  d.id = 'ag-sugs-float';
  d.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.bottom+2}px;width:${Math.max(rect.width,260)}px;z-index:99999;background:#fff;border:1.5px solid #cbd5e1;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.15);max-height:300px;overflow-y:auto`;
  d.innerHTML = matches.map((m, idx) => {
    const badge = m.pedido ? `<span style="font-size:0.72rem;color:#2563eb;background:#eff6ff;padding:1px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0">${esc(m.pedido)}</span>` : '';
    return `<div onclick="_agPickSugIdx(${idx})" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''"><span style="font-size:0.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.nombre)}</span>${badge}</div>`;
  }).join('');
  document.body.appendChild(d);
  window._agDocListener = function(e) { if (!d.contains(e.target) && e.target !== inp) _agHideSugs(); };
  setTimeout(() => document.addEventListener('mousedown', window._agDocListener), 0);
}

function _agPickSugIdx(idx) {
  const m = (window._agSugItems||[])[idx];
  if (!m) return;
  const inp = document.getElementById('ag-cliente');
  if (inp) { inp.value = m.nombre; inp.focus(); }
  const telEl = document.getElementById('ag-tel');
  if (telEl && m.telefono && !telEl.value) telEl.value = m.telefono;
  const pedidoEl = document.getElementById('ag-pedido');
  if (pedidoEl && m.pedido) pedidoEl.value = m.pedido;
  _agHideSugs();
}
window['_agHideSugs'] = _agHideSugs;
window['_agPickSugIdx'] = _agPickSugIdx;

function _agAbrirPedido(folio) {
  const vt = (db.ventas||[]).find(v =>

    `#${v.id}` === folio ||

  if (!desc) { _info('Escribe la descripción del artículo.'); return; }

  _ocItems.push({ descripcion: desc, cantidad: cant, precioUnitario: precio });

// CHECADOR DE ASISTENCIA
// Horario: L-V 8:00 entrada | 10:00-10:30 desayuno | 14:00-14:45 comida | 18:00 salida
//          Sab 8:00 entrada | 10:00-10:30 desayuno | 12:45 salida

// Secuencia de eventos por tipo de día
const _CHEC_SEQ = {
  lv:  [
    { tipo:'entrada',       icon:'🟢', label:'Entrada',           esperada:'08:00', color:'#16a34a', bg:'#dcfce7' },
    { tipo:'ini_desayuno',  icon:'☕', label:'Inicio Desayuno',   esperada:'10:00', color:'#ca8a04', bg:'#fef9c3' },
    { tipo:'fin_desayuno',  icon:'🔙', label:'Fin Desayuno',      esperada:'10:30', color:'#16a34a', bg:'#dcfce7' },
    { tipo:'ini_comida',    icon:'🍽️', label:'Inicio Comida',    esperada:'14:00', color:'#ca8a04', bg:'#fef9c3' },
    { tipo:'fin_comida',    icon:'🔙', label:'Fin Comida',        esperada:'14:45', color:'#16a34a', bg:'#dcfce7' },
    { tipo:'salida',        icon:'🏁', label:'Salida',            esperada:'18:00', color:'#2563eb', bg:'#dbeafe' },
  ],
  sab: [
    { tipo:'entrada',       icon:'🟢', label:'Entrada',           esperada:'08:00', color:'#16a34a', bg:'#dcfce7' },
    { tipo:'ini_desayuno',  icon:'☕', label:'Inicio Desayuno',   esperada:'10:00', color:'#ca8a04', bg:'#fef9c3' },
    { tipo:'fin_desayuno',  icon:'🔙', label:'Fin Desayuno',      esperada:'10:30', color:'#16a34a', bg:'#dcfce7' },
    { tipo:'salida',        icon:'🏁', label:'Salida',            esperada:'12:45', color:'#2563eb', bg:'#dbeafe' },
  ],
};

// Labels bonitos para el reporte
const _CHEC_LABEL = { entrada:'Entrada', ini_desayuno:'Ini. Des.', fin_desayuno:'Fin Des.', ini_comida:'Ini. Comida', fin_comida:'Fin Comida', salida:'Salida' };

function _checTipodia(fechaStr) {
  const d = new Date(fechaStr + 'T12:00:00').getDay(); // 0=Dom,6=Sab
  if (d === 0) return null;  // Domingo: no laboral
  if (d === 6) return 'sab';
  return 'lv';
}

// Siguiente evento a registrar para un trabajador en una fecha
function _checSiguiente(nombre, fecha) {
  const tipo = _checTipodia(fecha);
  if (!tipo) return null;
  const seq   = _CHEC_SEQ[tipo];
  const rec   = (db.checadas||[]).find(c => c.trabajador === nombre && c.fecha === fecha);
  const evts  = rec ? (rec.eventos || []) : [];
  const reg   = new Set(evts.map(e => e.tipo));
  return seq.find(s => !reg.has(s.tipo)) || null; // null = turno completo
}

// Estado visual de la tarjeta
function _checEstadoCard(nombre, fecha) {
  const rec  = (db.checadas||[]).find(c => c.trabajador === nombre && c.fecha === fecha);
  const evts = rec ? (rec.eventos||[]) : [];
  const ult  = evts[evts.length - 1];
  if (!ult) return { bg:'#f8fafc', brdr:'#cbd5e1', icon:'🔘', sub:'Sin checar', subColor:'#94a3b8' };
  const tipo = ult.tipo;
  const descs = {
    entrada:      { bg:'#dcfce7', brdr:'#16a34a', icon:'✅', sub:`En turno desde ${ult.hora}` },
    ini_desayuno: { bg:'#fef9c3', brdr:'#ca8a04', icon:'☕', sub:`Desayunando (${ult.hora})` },
    fin_desayuno: { bg:'#dcfce7', brdr:'#16a34a', icon:'✅', sub:`Regresó del desayuno` },
    ini_comida:   { bg:'#fef9c3', brdr:'#ca8a04', icon:'🍽️', sub:`Comiendo (${ult.hora})` },
    fin_comida:   { bg:'#dcfce7', brdr:'#16a34a', icon:'✅', sub:`Regresó de comer` },
    salida:       { bg:'#dbeafe', brdr:'#2563eb', icon:'🏁', sub:`Salió a las ${ult.hora}` },
  };
  return { ...(descs[tipo] || { bg:'#f8fafc', brdr:'#cbd5e1', icon:'🔘', sub:'Sin checar' }), subColor:'#475569' };
}

// Calcular horas efectivas (descuenta desayuno y comida)
function _checHrsEfectivas(eventos) {
  const get = tipo => (eventos.find(e => e.tipo === tipo) || {}).hora;
  const toMins = h => { if (!h) return null; const [hh,mm] = h.split(':').map(Number); return hh*60+mm; };
  const fmtMins = m => { const h=Math.floor(m/60),mn=m%60; return h>0?`${h}h ${mn}min`:`${mn}min`; };
  const entrada  = toMins(get('entrada'));
  const salida   = toMins(get('salida'));
  if (!entrada || !salida || salida <= entrada) return '—';
  let total = salida - entrada;
  // Descontar desayuno
  const iniDes = toMins(get('ini_desayuno')), finDes = toMins(get('fin_desayuno'));
  if (iniDes && finDes && finDes > iniDes) total -= (finDes - iniDes);
  // Descontar comida
  const iniCom = toMins(get('ini_comida')), finCom = toMins(get('fin_comida'));
  if (iniCom && finCom && finCom > iniCom) total -= (finCom - iniCom);
  return total > 0 ? fmtMins(total) : '—';
}

function _checadorRelojStart() {
  const tick = () => {
    const el = document.getElementById('checador-reloj');
    if (!el) return;
    el.textContent = new Date().toTimeString().slice(0,8);
    setTimeout(tick, 500);
  };
  tick();
}

function _checadorTab(tab) {
  ['kiosko','reporte','config'].forEach(t => {
    const panel = document.getElementById('checador-panel-' + t);
    const btn   = document.getElementById('tab-' + t);
    if (panel) panel.style.display = (t === tab) ? '' : 'none';
    if (btn)   { btn.style.background = (t === tab) ? 'var(--primary)' : '#e2e8f0'; btn.style.color = (t === tab) ? 'white' : '#475569'; }
  });
  if (tab === 'reporte') _renderChecadorReporte();
}
window['_checadorTab'] = _checadorTab;

function _renderChecadorReporte() {
  const fechaEl = document.getElementById('checador-fecha-filtro');
  const fecha   = fechaEl ? fechaEl.value : today();
  const datos   = (db.checadas||[]).filter(c => c.fecha === fecha)
    .slice().sort((a,b) => {
      const ea = (a.eventos||[])[0]?.hora || '';
      const eb = (b.eventos||[])[0]?.hora || '';
      return ea.localeCompare(eb);
    });
  const tipoDia = _checTipodia(fecha);
  const seq     = tipoDia ? _CHEC_SEQ[tipoDia] : _CHEC_SEQ.lv;
  const isAdmin = can(['admin','secretaria']);
  const countEl = document.getElementById('checador-reporte-count');
  if (countEl) countEl.textContent = `${datos.length} registro(s)`;
  const wrap = document.getElementById('checador-reporte-tabla');
  if (!wrap) return;
  // Cabecera dinámica según los eventos del día
  const cols = seq.map(s => s.tipo);
  wrap.innerHTML = `<div class="table-wrap"><table>
    <tr>
      <th style="white-space:nowrap">Trabajador</th>
      ${cols.map(c => `<th style="white-space:nowrap">${_CHEC_LABEL[c]||c}</th>`).join('')}
      <th style="white-space:nowrap">Hrs. efectivas</th>
      ${isAdmin ? '<th></th>' : ''}
    </tr>
    ${datos.length ? datos.map(d => {
      const evts   = d.eventos || [];
      const getH   = tipo => (evts.find(e => e.tipo === tipo)||{}).hora || '—';
      const hrs    = _checHrsEfectivas(evts);
      return `<tr>
        <td><strong>${esc(d.trabajador)}</strong></td>
        ${cols.map(c => `<td style="white-space:nowrap">${getH(c)}</td>`).join('')}
        <td><strong>${hrs}</strong></td>
        ${isAdmin ? `<td><button class="btn btn-danger btn-sm" onclick="_delChecada(${d.id})">🗑️</button></td>` : ''}
      </tr>`;
    }).join('') : `<tr><td colspan="${cols.length + (isAdmin?3:2)}" class="td-empty">Sin registros para esta fecha.</td></tr>`}
  </table></div>`;
}
window['_renderChecadorReporte'] = _renderChecadorReporte;

function _checadorAccion(nombre) {
  const hoy    = today();
  const ahora  = new Date().toTimeString().slice(0,5);
  const sigEv  = _checSiguiente(nombre, hoy);

  if (!sigEv) {
    // Turno completo — mostrar resumen
    const rec  = (db.checadas||[]).find(c => c.trabajador === nombre && c.fecha === hoy);
    const evts = rec ? (rec.eventos||[]) : [];
    const hrs  = _checHrsEfectivas(evts);
    _info(`${nombre} completó su turno hoy. Horas efectivas: ${hrs}.`);
    return;
  }

  // Calcular tardanza
  const [eH,eM] = sigEv.esperada.split(':').map(Number);
  const [aH,aM] = ahora.split(':').map(Number);
  const diffMin  = (aH*60+aM) - (eH*60+eM);
  const tardanza = diffMin > 1 ? `<span style="color:#dc2626;font-size:0.8rem">⚠️ ${diffMin} min tarde</span>` :
                   diffMin < -1 ? `<span style="color:#16a34a;font-size:0.8rem">✅ ${-diffMin} min antes</span>` :
                   `<span style="color:#16a34a;font-size:0.8rem">✅ A tiempo</span>`;

  showModal(`${sigEv.icon} ${nombre}`, `
    <div style="text-align:center;padding:18px 8px">
      <div style="font-size:3rem;margin-bottom:10px">${sigEv.icon}</div>
      <p style="font-size:1.1rem;font-weight:700;margin-bottom:8px">${sigEv.label}</p>
      <div style="display:inline-flex;flex-direction:column;gap:4px;align-items:center">
        <span style="font-size:1.6rem;font-weight:800;color:var(--primary)">${ahora}</span>
        <span style="font-size:0.8rem;color:var(--text-light)">Esperada: ${sigEv.esperada} &nbsp;·&nbsp; ${tardanza}</span>
      </div>
    </div>`, [
    { label:`✅ Confirmar ${sigEv.label}`, cls:'btn-primary', action:() => {
      if (!db.checadas) db.checadas = [];
      let rec = db.checadas.find(c => c.trabajador === nombre && c.fecha === hoy);
      if (!rec) {
        rec = { id:sid(), trabajador:nombre, fecha:hoy, eventos:[] };
        db.checadas.push(rec);
      }
      if (!rec.eventos) rec.eventos = [];
      rec.eventos.push({ tipo:sigEv.tipo, hora:ahora, tardanzaMin:diffMin });
      saveDb('checadas');
      closeModal();
      renderChecador();
    }},
    { label:'Cancelar', cls:'btn-secondary', action:closeModal }
  ]);
}

function _eiAutoFill(autoAdd) {
  const inp  = document.getElementById('ei-mat-desc');
  const info = document.getElementById('ei-autofill-info');
  const codigo = (inp?.value||'').trim();
  if (!codigo) { if (info) info.innerHTML = '&nbsp;'; return; }

  // Buscar en inventario por barcode, código o nombre
  const item = (db.materia||[]).find(i =>
    (i.barcode && i.barcode.trim().toLowerCase() === codigo.toLowerCase()) ||
    (i.codigo  && i.codigo.trim().toLowerCase()  === codigo.toLowerCase()) ||
    (i.nombre  && i.nombre.trim().toLowerCase()  === codigo.toLowerCase()));

  if (item) {
    if (inp) inp.value = item.nombre;
    const u = document.getElementById('ei-mat-unidad');
    if (u && !u.value) u.value = item.unidad || '';
    if (info) info.innerHTML = `✅ <strong>${esc(item.nombre)}</strong> — stock: ${item.cantidad} ${esc(item.unidad||'')}`;
    if (autoAdd) setTimeout(addEiItem, 250); // auto-agregar tras escaneo con cámara
    return;
  }

  // Buscar en catálogo de materiales
  const cat = (db.catalogoMateriales||[]).find(m =>
    (m.nombre||'').toLowerCase() === codigo.toLowerCase());
  if (cat) {
    const u = document.getElementById('ei-mat-unidad');
    if (u && !u.value) u.value = cat.unidad || '';
    if (info) info.innerHTML = `📋 Encontrado en catálogo: <strong>${esc(cat.nombre)}</strong>`;
    if (autoAdd) setTimeout(addEiItem, 250);
    return;
  }

  if (info) info.innerHTML = '&nbsp;';
}

// ── CONTADORES ANIMADOS EN DASHBOARD ──────────────────────────
function _animarContador(el, target, isMoney) {
  if (!el || isNaN(target)) return;
  const dur = 700;
  const startTime = performance.now();
  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / dur, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    const val = target * ease;
    el.textContent = isMoney
      ? '$' + (target % 1 !== 0 ? val.toFixed(2) : Math.round(val).toLocaleString('es-MX'))
      : Math.round(val).toLocaleString('es-MX');
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function _initDashboardAnimations() {
  document.querySelectorAll('.stat-value[data-val]').forEach(el => {
    const raw = parseFloat(el.dataset.val) || 0;
    const isMoney = el.dataset.money === '1';
    _animarContador(el, raw, isMoney);
  });
}

// ── COPIAR AL PORTAPAPELES ──────────────────────────────────────────
function _copiar(text, label) {
  if (!text) return;
  const _do = () => showToast('📋 ' + (label || 'Copiado') + ': ' + text, 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(_do).catch(() => {
      _fallbackCopy(text); _do();
    });
  } else { _fallbackCopy(text); _do(); }
}
function _fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

    (db.ventas || []).filter(vt => !vt.papelera).forEach(vt => {
      if (match([vt.cliente || vt.ctNombre || '', String(vt.folioPedido || ''), vt.celular || vt.ctCelular || ''].join(' ')))
        res.push({ tipo: '💰 Venta', label: '#' + (vt.folioPedido || vt.id) + ' — ' + (vt.cliente || vt.ctNombre || ''), sec: 'ventas', id: vt.id, fn: 'verVenta' });
    });
    (db.clientes || []).forEach(c => {
      if (match([c.nombre || '', c.apellido || '', c.empresa || '', c.celular || '', c.correo || ''].join(' ')))
        res.push({ tipo: '👤 Cliente', label: [c.nombre, c.apellido].filter(Boolean).join(' ') + (c.empresa ? ' (' + c.empresa + ')' : ''), sec: 'clientes', id: null, fn: null });
    });
    if (!res.length) { showToast('Sin resultados para "' + v + '"', 'warn'); return; }
    window._globalSR = res.slice(0, 12);
    const lista = window._globalSR.map((r, i) => `
      <div onclick="_irResultGlobal(${i})"
        style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);
               display:flex;gap:10px;align-items:center;transition:background .1s"
        onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
        <span style="font-size:0.73rem;white-space:nowrap;color:var(--text-light);min-width:80px">${r.tipo}</span>
        <span style="font-size:0.88rem;font-weight:500">${esc(r.label)}</span>
      </div>`).join('');
    showModal('🔍 Resultados para "' + esc(v) + '"', lista, [{ label: 'Cerrar', cls: 'btn-secondary', action: closeModal }]);
  }, 280);
}
function _irResultGlobal(i) {
  const r = (window._globalSR || [])[i];
  if (!r) return;
  const inp = document.getElementById('global-srch');
  if (inp) inp.value = '';
  closeModal();
  if (r.sec) {
    nav(r.sec);
    if (r.fn && r.id != null) setTimeout(() => { if (window[r.fn]) window[r.fn](r.id); }, 400);
  }
}

// ── EXPORTAR COTIZACIONES A EXCEL ────────────────────────────────────
function exportCotizXLSX() {
  if (typeof XLSX === 'undefined') {
    showToast('Cargando librería Excel…', 'info');
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => exportCotizXLSX();
    document.head.appendChild(s);
    return;
  }
  const filas = (db.cotizaciones || []).slice().reverse().map(c => ({
    'ID': c.id,
    'Fecha': c.fecha || '',
    'Cliente': c.cliente || '',
    'Empresa': c.ctEmpresa || '',
    'Celular': c.ctCelular || '',
    'Estado': c.estado || '',
    'Elaborado por': c.usuario || '',
    'Total ($)': (c.items || []).reduce((s, i) => s + (i.pendiente ? 0 : ((i.precio || 0) * (i.cantidad || 0))), 0),
    'Pendientes': (c.items || []).filter(i => i.pendiente).length,
    'Productos': (c.items || []).map(i => i.producto || '').join(', '),
    'Observaciones': c.observaciones || ''
  }));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(filas);
  // Ancho de columnas
  ws['!cols'] = [5,10,22,22,14,12,16,10,8,40,30].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws, 'Cotizaciones');
  XLSX.writeFile(wb, 'cotizaciones_' + today() + '.xlsx');
  showToast('📊 Excel descargado correctamente.', 'ok');
}

// ── ATAJOS DE TECLADO ────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  // Esc: cerrar modal
  if (e.key === 'Escape') {
    const ov = document.getElementById('modal-overlay');
    if (ov && ov.classList.contains('open')) {
      closeModalWithConfirm();
      e.stopPropagation();
    }
    return;
  }
  // Ctrl+S / Cmd+S: guardar formulario abierto
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    const footer = document.getElementById('modal-footer');
    if (!footer) return;
    const saveBtn = Array.from(footer.querySelectorAll('button')).find(b =>
      /guardar|save|agregar|crear|registrar|confirm/i.test(b.textContent)
    );
    if (saveBtn && !saveBtn.disabled) {
      e.preventDefault();
      saveBtn.click();
    }
  }
}, true);

// ── CIERRE DE SESIÓN POR INACTIVIDAD (20 MIN) ────────────────────────
(function _sessionTimeout() {
  const TIMEOUT = 20 * 60 * 1000;
  let _timer = null;
  function _reset() {
    clearTimeout(_timer);
    _timer = setTimeout(() => {
      // No mostrar si el login está activo
      const app = document.getElementById('app');
      if (!app || app.style.display === 'none') return;
      const ov = document.getElementById('modal-overlay');
      if (ov && ov.classList.contains('open')) closeModal();
      showModal('⏱️ Sesión expirada', `
        <div style="text-align:center;padding:16px 0">
          <div style="font-size:3rem;margin-bottom:14px">🔒</div>
          <p style="color:var(--text-light)">Tu sesión se cerró por 20 minutos de inactividad.</p>
        </div>`, [
        { label: 'Cerrar sesión', cls: 'btn-danger', action: () => { closeModal(); firebase.auth().signOut(); } },
        { label: 'Seguir trabajando', cls: 'btn-primary', action: () => { closeModal(); _reset(); } }
      ]);
    }, TIMEOUT);
  }
  ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(ev =>
    document.addEventListener(ev, _reset, { passive: true })
  );
  window._startIdleTimer = _reset;
})();

// ── BITÁCORA DE ACTIVIDAD ─────────────────────────────────────────────
function logActividad(accion, detalle) {
  if (!window.session || !window.session.nombre) return;
  try {
    const e = {
      id: sid(), fecha: today(),
      hora: new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }),
      usuario: session.nombre, rol: session.rol || '',
      accion: accion, detalle: detalle || ''
    };
    db.bitacora = db.bitacora || [];
    db.bitacora.unshift(e);
    if (db.bitacora.length > 300) db.bitacora.length = 300;
    if (window._firestoreDb) {
      window._firestoreDb.collection('bitacora').doc(String(e.id)).set(e).catch(() => {});
    }
  } catch(err) {}
}

// ── TOPBAR SCROLL SHADOW ──────────────────────────────────────
(function() {
  const content = document.querySelector('.content');
  const topbar  = document.querySelector('.topbar');
  if (!content || !topbar) return;
  content.addEventListener('scroll', function() {
    topbar.classList.toggle('scrolled', content.scrollTop > 8);
  }, { passive: true });
})();

</script>
