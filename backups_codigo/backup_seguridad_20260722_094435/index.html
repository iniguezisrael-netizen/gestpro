let _fotosSubiendoC = 0;
let _fotoSessionC = 0; // token de sesión: evita que fotos de un modal anterior contaminen el siguiente

function handleFotoUploadC(event) {
  const files = Array.from(event.target.files);
  event.target.value = '';
  const token = _fotoSessionC;
  files.forEach(file => {
    comprimirImagen(file, dataUrl => {
      if (_fotoSessionC !== token) return; // modal cambió, descartar
      _fotosSubiendoC++; renderFotosPreviewC();
      subirFotoAStorage(dataUrl, 'consignacion', url => {
        if (_fotoSessionC !== token) return; // modal cambió mientras subía
        _fotosSubiendoC--; _tempFotosC.push(url); renderFotosPreviewC();
      });
    });
  });
}

function handleFotoDropC(event) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const files = Array.from(event.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  const token = _fotoSessionC;
  files.forEach(file => {
    comprimirImagen(file, dataUrl => {
      if (_fotoSessionC !== token) return;
      _fotosSubiendoC++; renderFotosPreviewC();
      subirFotoAStorage(dataUrl, 'consignacion', url => {
        if (_fotoSessionC !== token) return;
        _fotosSubiendoC--; _tempFotosC.push(url); renderFotosPreviewC();
      });
    });
  });
}

function renderFotosPreviewC() {
  const c = document.getElementById('fotos-preview-consig');
  if (!c) return;
  c.innerHTML = _tempFotosC.map((src, idx) => `
    <div class="foto-prev-wrap">
      <img src="${src}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer" onclick="openLightboxSrc('${src}')" />
      <button class="foto-prev-del" onclick="_tempFotosC.splice(${idx},1);renderFotosPreviewC()">✕</button>
    </div>`).join('') + (_fotosSubiendoC > 0 ? `<div style="display:flex;align-items:center;color:#64748b;font-size:0.78rem;padding:8px">⏳ Subiendo ${_fotosSubiendoC} foto(s)...</div>` : '');
}

function openLightboxConsig(id) {
  const c = findById(db.consignacion, id);
  if (!c || !c.fotos || !c.fotos.length) return;
  _lbFotos = c.fotos; _lbIdx = 0; showLightbox();
}

function saveConsig(id) {
  const producto = v('c-producto');
  if (!producto) { _info('El producto es obligatorio'); return; }
  const prev = id ? findById(db.consignacion, id) : null;
  const canFull = session.rol === 'admin'; // costo y datos del cliente: solo admin
  const canPrecioPublico = can(['admin','secretaria','auxiliar']);
  const obj = {
    id:id||sid(), producto,
    lugar: prev ? prev.lugar : v('c-lugar'),
    folio: v('c-folio'),
    categoria: v('c-categoria'),
    barcode: v('c-barcode'),
    // Datos del cliente y precios: solo el administrador puede capturarlos/modificarlos.
    // Si quien guarda no tiene permiso completo, se conserva lo que ya existía.
    clienteNombre: canFull ? v('c-cnombre') : (prev ? prev.clienteNombre : ''),
    clienteApellido: canFull ? v('c-capellido') : (prev ? prev.clienteApellido : ''),
    telFijo: canFull ? v('c-telfijo') : (prev ? prev.telFijo : ''),
    celular: canFull ? v('c-celular') : (prev ? prev.celular : ''),
    ciudad: canFull ? v('c-ciudad') : (prev ? prev.ciudad : ''),
    cestado: canFull ? v('c-cestado') : (prev ? prev.cestado : ''),
    colonia: canFull ? v('c-colonia') : (prev ? prev.colonia : ''),
    direccion: canFull ? v('c-direccion') : (prev ? prev.direccion : ''),
    cantidad: +v('c-cantidad'),
    valor: canFull ? +v('c-valor') : (prev ? (prev.valor || 0) : 0),
    precioPublico: canPrecioPublico ? +v('c-precio-pub') : (prev ? (prev.precioPublico || 0) : 0),
    fecha: v('c-fecha'),
    estado: v('c-estado'),
    notas: v('c-notas'),
    especUnidad: v('c-eunidad'), especTipo: v('c-etipo'),
    especForro: v('c-eforro'), especColor: v('c-ecolor'),
    desc: v('c-desc'),
    especObservaciones: v('c-eobs'),
    fotos: [..._tempFotosC]
  };
  if (id) { const idx = db.consignacion.findIndex(x=>x.id===id); db.consignacion[idx]=obj; }
  else db.consignacion.push(obj);
  saveDb('consignacion'); closeModal(); renderConsignacion();
}

function cambiarEstadoConsig(id, nuevoEstado) {
  const c = findById(db.consignacion, id);
  if (!c) return;
  c.estado = nuevoEstado;
  saveDb('consignacion'); renderConsignacion();
}

function delConsig(id) {
  if (!confirm('¿Eliminar?')) return;
  db.consignacion = db.consignacion.filter(x => x.id !== id);
  saveDb('consignacion'); renderConsignacion();
}

// Indica de dónde salen los artículos de una venta/pedido: si vienen del
// inventario de Producto Terminado, Materia Prima o Consignación (según el
// _tipo guardado al agregarlos desde el picker), o si es un pedido por
// fabricar (artículo escrito a mano, sin liga a inventario).
function _origenItemsVenta(vt) {
  const items = vt.items || [];
  if (!items.length) return '';
  const tipos = new Set(items.map(i => i._tipo).filter(Boolean));
  const sinTipo = items.some(i => !i._tipo);
  const labels = [];
  if (tipos.has('productos')) labels.push('<span style="font-size:0.66rem;font-weight:700;padding:1px 6px;border-radius:8px;background:#fef3e2;color:#92400e;white-space:nowrap">📦 Prod. Terminado</span>');
  if (tipos.has('materia')) labels.push('<span style="font-size:0.66rem;font-weight:700;padding:1px 6px;border-radius:8px;background:#e0e7ff;color:#3730a3;white-space:nowrap">🔩 Materia Prima</span>');
  if (tipos.has('consignacion')) labels.push('<span style="font-size:0.66rem;font-weight:700;padding:1px 6px;border-radius:8px;background:#dbeafe;color:#1e40af;white-space:nowrap">🔄 Consignación</span>');
  if (sinTipo) labels.push('<span style="font-size:0.66rem;font-weight:700;padding:1px 6px;border-radius:8px;background:#f1f5f9;color:#475569;white-space:nowrap">🛠 Por fabricar</span>');
  const dir = labels.length > 1 ? 'column' : 'row';
  return labels.length ? `<div style="display:flex;flex-direction:${dir};flex-wrap:wrap;align-items:flex-start;gap:3px">${labels.join('')}</div>` : '';
}

            ${isAdmin && (window._mostrarArchivo||false) ? `<th>Archivado por</th>` : ''}
            <th>Acciones</th></tr>
          ${(() => {
            // El select de "estado" tiene prioridad si se elige algo explícito (incluye 'Cancelada').
            // Si no hay select activo, el botón "Mostrar/Ocultar canceladas" decide: mostrando =
            // SOLO las canceladas; ocultando (por defecto) = solo las NO canceladas.
            const mostrandoArchivo = isAdmin && (window._mostrarArchivo || false);
            const filtroVentas = filtroEstado
              ? (vt => vt.estado === filtroEstado && !vt.archivado)
              : mostrandoArchivo
                ? (vt => vt.archivado === true)
                : (vt => mostrandoCanceladas ? vt.estado === 'Cancelada' : vt.estado !== 'Cancelada' && !vt.archivado);
            let ventasFiltradas = db.ventas.slice().reverse().filter(filtroVentas);
            const _vtS = window._vtSort;
            if (_vtS) {
              const asc = _vtS.dir === 'asc';
              const getVal = (vt) => {
                if (_vtS.col === 'folio')   return vt.folioPedido || '';
                if (_vtS.col === 'fecha')   return vt.fecha || '';
                if (_vtS.col === 'cliente') return (vt.cliente || '').toLowerCase();
                if (_vtS.col === 'empresa') return (vt.ctEmpresa && vt.ctEmpresa !== 'No aplica' ? vt.ctEmpresa : '').toLowerCase();
                return '';
              };
              const opts = _vtS.col === 'folio' ? {numeric: true} : undefined;
              ventasFiltradas.sort((a, b) => {
                const va = getVal(a), vb = getVal(b);
                const cmp = opts ? va.localeCompare(vb, undefined, opts) : va < vb ? -1 : va > vb ? 1 : 0;
                return asc ? cmp : -cmp;
              });
            }
            window._vtTotalVentas = ventasFiltradas.length;
            const _vtPaged = _pg('ventas', ventasFiltradas);
            return window._vtTotalVentas ? _vtPaged.map(vt => `<tr data-search="${esc((vt.cliente+' '+(vt.ctEmpresa&&vt.ctEmpresa!=='No aplica'?vt.ctEmpresa:'')+' '+(vt.folioPedido||'')+' '+vt.id+' '+(vt.cotizRef||'')+' '+(vt.fecha||'')+' '+fechaLarga(vt.fecha)).toLowerCase())}">
            ${isAdmin ? `<td><input type="checkbox" class="vt-chk ${vt.estado==='Cancelada'?'vt-cancel-chk':'vt-active-chk'}" data-id="${vt.id}" data-estado="${esc(vt.estado)}" /></td>` : ''}
            <td>${_origenItemsVenta(vt)}</td>
            <td style="white-space:nowrap">${vt.folioPedido?`<strong style="color:var(--primary)">${esc(vt.folioPedido)}</strong>`:`#${vt.id}`}</td><td style="white-space:nowrap">${fechaCorta(vt.fecha)}</td><td><strong>${esc(vt.cliente)}</strong></td><td>${vt.ctEmpresa&&vt.ctEmpresa!=='No aplica'?esc(vt.ctEmpresa):'<span style="color:#cbd5e1">—</span>'}</td>
            <td style="white-space:nowrap;text-align:right">${vt.total!=null?`<span style="font-weight:600">$${fmt(vt.total)}</span><br><span style="font-size:0.72rem;color:${vt.ivaMode==='mas'?'#0f6e56':vt.ivaMode==='incluido'?'#7c3aed':'#64748b'};font-weight:600">${vt.ivaMode==='mas'?'+ IVA':vt.ivaMode==='incluido'?'IVA inc.':'Neto'}</span>`:'<span style="color:#cbd5e1">—</span>'}</td>
            <td>${can(['admin','secretaria']) && vt.estado !== 'Cancelada' ? `
              <select onchange="_cambiarEstadoVtInline(${vt.id},this.value)" onclick="event.stopPropagation()"
                style="padding:3px 6px;border-radius:12px;font-size:0.78rem;font-weight:600;border:none;cursor:pointer;outline:none;
                  ${vt.estado==='Pagada'||vt.estado==='Entregado'?'background:#dcfce7;color:#15803d':vt.estado==='En Proceso'?'background:#dbeafe;color:#1e40af':'background:#fef3c7;color:#92400e'}">
                ${['Pendiente','En Proceso','Entregado','Pagada'].map(s=>`<option value="${s}" ${vt.estado===s?'selected':''}>${s}</option>`).join('')}
              </select>` :
              `<span class="badge ${vt.estado==='Pagada'||vt.estado==='Entregado'?'badge-green':vt.estado==='Listo para entrega'?'badge-orange':vt.estado==='En Proceso'?'badge-blue':vt.estado==='Pendiente'?'badge-yellow':'badge-red'}">${vt.estado}</span>`
            }</td>
            ${mostrandoArchivo ? `<td style="font-size:0.82rem;color:#0f766e;white-space:nowrap">${esc(vt.archivadoPor||'—')}${vt.archivadoEn?`<br><span style="color:#94a3b8">${fechaLarga(vt.archivadoEn.slice(0,10))}</span>`:''}</td>` : ''}
            <td style="display:flex;gap:4px">
              <button class="btn btn-outline btn-sm" onclick="verVenta(${vt.id},${vt.folioPedido?`'${vt.folioPedido.replace(/'/g,"\\'")}'`:null})">🔍</button>

          })()}

    btn.addEventListener('click', function() { generarPDFPedido(this.dataset.vid); });

}

function _cambiarEstadoVtInline(id, nuevoEstado) {
  if (!can(['admin','secretaria'])) return;
  const vt = (db.ventas||[]).find(v => v.id === id);
  if (!vt) return;
  const estadoAnterior = vt.estado;
  vt.estado = nuevoEstado;
  // Si pasan a Pagada y tenía saldo, avisar que el saldo sigue igual
  if (nuevoEstado === 'Pagada' && vt.saldo > 0) {
    if (!confirm(`El pedido tiene un saldo pendiente de $${fmt(vt.saldo)}. ¿Marcar como Pagada de todas formas?`)) {
      vt.estado = estadoAnterior;
      renderVentas();
      return;
    }
  }
  saveDb('ventas');
  showToast(`✅ ${vt.folioPedido||('#'+vt.id)} → ${nuevoEstado}`);
  renderVentas();
}

window['vSelRenderPicker'] = vSelRenderPicker;

// Busca el artículo del tipo dado por nombre exacto (al seleccionar una
// sugerencia de la lista queda el nombre completo en el campo).
function _vSelFindItem(tipo, nombre) {
  const n = (nombre||'').trim().toLowerCase();
  if (!n) return null;
  return (db[tipo]||[]).find(i => ((tipo==='consignacion'?i.producto:i.nombre)||'').trim().toLowerCase() === n) || null;
}

// Lista de sugerencias propia (no depende del <datalist> nativo, que no se
// muestra de forma confiable dentro de la app). Se actualiza en cada tecleo
// y al enfocar el campo, mostrando los artículos importados de Excel/inventario
// que coincidan con lo escrito.
function vSelItemChange() {
  const tipo = v('vsel-tipo');
  const txt = (v('vsel-item')||'').trim().toLowerCase();
  const sugs = document.getElementById('vsel-item-sugs');
  if (sugs) {
    const all = db[tipo]||[];
    const matches = txt ? all.filter(i => ((tipo==='consignacion'?i.producto:i.nombre)||'').toLowerCase().includes(txt)) : [];
    if (!all.length || !txt) {
      sugs.style.display = 'none';
    } else if (!matches.length) {
      sugs.innerHTML = `<div style="padding:8px 10px;color:#94a3b8;font-size:0.85rem">Sin coincidencias</div>`;
      sugs.style.display = 'block';
    } else {
      sugs.innerHTML = matches.slice(0,50).map(i => {
        const nom = (tipo==='consignacion'?i.producto:i.nombre)||'';
        const stk = i.cantidad||0;
        const foto = i.fotos && i.fotos[0] ? `<img src="${i.fotos[0]}" style="width:38px;height:32px;object-fit:cover;border-radius:5px;margin-right:8px;flex-shrink:0;border:1px solid #e2e8f0" />` : '';
        return `<div class="vsel-sug" data-nombre="${esc(nom)}" style="padding:7px 10px;cursor:pointer;font-size:0.9rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center" onmousedown="event.preventDefault()">${foto}<span>${esc(nom)} <span style="color:${stk>0?'#94a3b8':'#dc2626'};font-size:0.8rem">· stock: ${stk}</span></span></div>`;
      }).join('');
      sugs.style.display = 'block';
    }
  }
  const item = _vSelFindItem(tipo, v('vsel-item'));
  const priceInput = document.getElementById('vsel-price');
  if (item && priceInput) priceInput.value = round2(item.precioPublico||0);
}
window['vSelItemChange'] = vSelItemChange;

// Click en una sugerencia: completa el campo con ese artículo.
document.addEventListener('click', e => {
  const sug = e.target.closest && e.target.closest('.vsel-sug');
  if (!sug) return;
  const inp = document.getElementById('vsel-item');
  if (inp) inp.value = sug.getAttribute('data-nombre') || '';
  vSelItemChange();
  const sugs = document.getElementById('vsel-item-sugs');
  if (sugs) sugs.style.display = 'none';
});

// Oculta la lista de sugerencias al salir del campo (con un pequeño retraso

function vSelAddItem() {
  const tipo = v('vsel-tipo');
  const nombre = v('vsel-item').trim();
  if (!nombre) { _info('Escribe el nombre del artículo'); return; }
  const item = _vSelFindItem(tipo, nombre);
  const qty = +v('vsel-qty');
  const price = +v('vsel-price');
  if (!qty || qty <= 0) { _info('Ingresa una cantidad válida'); return; }
  if (price === '' || price < 0 || isNaN(price)) { _info('Ingresa un precio válido'); return; }
  if (item) {
    if (qty > (item.cantidad||0)) { _info('⚠️ No hay suficiente stock ('+(item.cantidad||0)+' disponible). Se agregará el artículo de cualquier forma.'); }
    ventaItems.push({
      producto: tipo==='consignacion'?item.producto:item.nombre,
      cantidad: qty, precio: price,
      _tipo: tipo, _itemId: item.id
    });
  } else if (tipo === 'materia') {
    // Materia Prima: si no existe en inventario, se agrega como artículo libre, sin descontar stock.
    ventaItems.push({ producto: nombre, cantidad: qty, precio: price });
  } else {
    _info('Escribe y selecciona un artículo válido de la lista (Producto Terminado / Consignación deben estar dados de alta en inventario)');
    return;
  }
  updateVentaItems();
  vSelRenderPicker();
}

      if (_fotoSessionVt !== token) return;
      _fotosSubiendoVt++; renderFotosPreviewVt();

function updateVentaItems() {

  list.innerHTML = ventaItems.length ? `<table style="width:100%;font-size:0.85rem;border-collapse:collapse">

    </tr>`).join('')}
  </table>` : '<p style="color:#94a3b8;font-size:0.85rem">Sin items. Agrega productos arriba.</p>';
  const subtotalVt = ventaItems.reduce((s, i) => s + i.cantidad * i.precio, 0);
  const ivaElVt = document.querySelector('input[name="vt-iva"]:checked');
  const ivaModeVt = ivaElVt ? ivaElVt.value : 'neto';
  let ivaAmtVt = 0, total = subtotalVt, netoVt = subtotalVt;
  if (ivaModeVt === 'mas')      { ivaAmtVt = subtotalVt * 0.16; total = subtotalVt + ivaAmtVt; netoVt = subtotalVt; }
  if (ivaModeVt === 'incluido') { netoVt = subtotalVt / 1.16; ivaAmtVt = subtotalVt - netoVt; total = subtotalVt; }
  const tv = document.getElementById('venta-total');
  if (tv) {
    if (!ventaItems.length) { tv.innerHTML = ''; }
    else if (ivaModeVt === 'mas') {
      tv.innerHTML = `<div style="font-size:0.85rem;color:var(--text-light)">Subtotal: $${fmt(netoVt)}</div><div style="font-size:0.85rem;color:var(--text-light)">IVA (16%): $${fmt(ivaAmtVt)}</div><div style="font-weight:700;font-size:1.1rem;color:var(--primary)">Total: $${fmt(total)}</div>`;
    } else if (ivaModeVt === 'incluido') {
      tv.innerHTML = `<div style="font-size:0.85rem;color:var(--text-light)">Neto: $${fmt(netoVt)}</div><div style="font-size:0.85rem;color:var(--text-light)">IVA incluido (16%): $${fmt(ivaAmtVt)}</div><div style="font-weight:700;font-size:1.1rem;color:var(--primary)">Total: $${fmt(total)}</div>`;
    } else {
      tv.textContent = `Total: $${fmt(total)}`;
    }
  }
  calcSaldoVenta();
}

function calcSaldoVenta() {
  const subtotalVt2 = ventaItems.reduce((s, i) => s + i.cantidad * i.precio, 0);
  const ivaElVt2 = document.querySelector('input[name="vt-iva"]:checked');
  const ivaModeVt2 = ivaElVt2 ? ivaElVt2.value : 'neto';
  const total = ivaModeVt2 === 'mas' ? subtotalVt2 * 1.16 : subtotalVt2; // 'incluido': precio ya tiene IVA, total = subtotal
  const anticipo = +document.getElementById('v-anticipo')?.value || 0;
  const saldo = Math.max(0, total - anticipo);
  const sEl = document.getElementById('v-saldo');
  if (sEl) sEl.value = saldo.toFixed(2);
}
window['calcSaldoVenta'] = calcSaldoVenta;

// Genera el siguiente folio automático en formato "NOTA DE VENTA-001", "NOTA
// DE VENTA-002"... cuando el usuario deja el campo de Número de Pedido vacío.
// Busca el número más alto ya usado con ese formato y le suma 1.
function _siguienteNotaVenta() {
  let max = 0;
  (db.ventas||[]).forEach(x => {
    const m = /^NOTA DE VENTA-(\d+)$/i.exec((x.folioPedido||'').trim());
    if (m) { const n = parseInt(m[1], 10); if (n > max) max = n; }
  });
  return `NOTA DE VENTA-${String(max + 1).padStart(3,'0')}`;
}
window['_siguienteNotaVenta'] = _siguienteNotaVenta;

function saveVenta() {
  const nombre = v('v-nombre');
  const apellido = v('v-apellido');
  const cliente = [nombre, apellido].filter(Boolean).join(' ');
  if (!cliente) { _info('Ingresa el nombre del cliente'); return; }
  const _pendienteCotizar = document.getElementById('v-pendiente-cotizar')?.checked || false;
  if (!ventaItems.length && !_pendienteCotizar) { _info('Agrega al menos un producto, o marca "Precio pendiente de cotizar"'); return; }
  const folioManual = v('v-folio').trim();
  if (folioManual && db.ventas.find(x=>x.folioPedido===folioManual && x.estado!=='Cancelada')) {
    _info(`❌ Ya existe un pedido activo con el folio "${folioManual}". Asigna un número diferente (solo se puede reutilizar si ese pedido está cancelado).`);
    return;
  }
  const nuevoId = sid();
  const folioPedido = folioManual || _siguienteNotaVenta();
  const ivaElSv = document.querySelector('input[name="vt-iva"]:checked');
  const ivaModeSv = ivaElSv ? ivaElSv.value : 'neto'; // 'neto' | 'mas' | 'incluido'
  const subtotalSv = ventaItems.reduce((s, i) => s + i.cantidad * i.precio, 0);
  const netoSv    = ivaModeSv === 'incluido' ? subtotalSv / 1.16 : subtotalSv;
  const ivaAmtSv  = ivaModeSv === 'mas' ? subtotalSv * 0.16 : (ivaModeSv === 'incluido' ? subtotalSv - netoSv : 0);
  const totalBruto = ivaModeSv === 'mas' ? subtotalSv + ivaAmtSv : subtotalSv; // 'incluido': precio ya tiene IVA
  const total = _pendienteCotizar ? 0 : totalBruto;
  const anticipo = +v('v-anticipo') || 0;
  const saldo = _pendienteCotizar ? 0 : Math.max(0, total - anticipo);
  const formaPagoAnticipo = anticipo > 0 ? (document.getElementById('v-forma-pago')?.value || 'efectivo') : null;
  const pagosIniciales = anticipo > 0
    ? [{ monto: anticipo, fecha: v('v-fecha'), hora: new Date().toTimeString().slice(0,5), nota: 'Anticipo inicial', recibidoPor: session.nombre, formaPago: formaPagoAnticipo }]
    : [];
  db.ventas.push({
    id:nuevoId, folioPedido, esPedido:true, fecha:v('v-fecha'), cliente,
    ctNombre:nombre, ctApellido:apellido,
    ctCiudad:v('v-ciudad'), ctEstado:v('v-estado'), ctEmpresa:v('v-empresa'),
    ctTelFijo:v('v-telfijo'), ctCelular:v('v-celular'), ctCorreo:v('v-correo'),
    ctDireccion:v('v-direccion'), ctColonia:v('v-colonia'), ctCp:v('v-cp'), ctRfc:v('v-rfc'),
    unidad:v('v-unidad'), tipo:v('v-tipo'), forro:v('v-forro'), color:v('v-color'),
    observaciones:v('v-observaciones'),
    fotos:[..._tempFotosVt],
    items:ventaItems, total, anticipo, saldo, pagos: pagosIniciales,
    iva: ivaModeSv !== 'neto', ivaMode: ivaModeSv, subtotal: netoSv, ivaAmount: ivaAmtSv,
    pendienteCotizar: _pendienteCotizar || undefined,
    estado:v('v-estado-form'), fechaEntrega:v('v-fecha-entrega'), usuario:session.nombre
  });
  // Descontar stock de los artículos agregados desde inventario (materia/productos/consignación).
  ventaItems.forEach(i => {
    if (i._itemId != null) {
      const item = (db[i._tipo]||[]).find(x=>x.id===i._itemId);
      if (item && item.cantidad != null) item.cantidad = Math.max(0, item.cantidad - i.cantidad);
    }
  });
  // Si el anticipo fue en efectivo y quien registra es secretaria/auxiliar, afectar su caja chica.
  // Si no hay caja abierta se crea una automáticamente para que el efectivo siempre quede registrado.
  if (anticipo > 0 && formaPagoAnticipo === 'efectivo' && (session.rol === 'secretaria' || session.rol === 'auxiliar')) {
    const caja = cajaActivaOCrear();
    if (caja) {
      const movId = sid();
      caja.movimientos = caja.movimientos || [];
      caja.movimientos.push({ id: movId, tipo: 'entrada', monto: anticipo, concepto: `Anticipo pedido ${folioPedido} — ${cliente}`, fecha: v('v-fecha'), hora: new Date().toTimeString().slice(0,5) });
      caja.saldo = (caja.saldo || 0) + anticipo;
      if (pagosIniciales[0]) { pagosIniciales[0].cajaMovId = movId; pagosIniciales[0].cajaUsuario = session.nombre; }
    }
  }
  upsertCliente({ nombre, apellido, ciudad: v('v-ciudad'), estado: v('v-estado'), empresa: v('v-empresa'), telfijo: v('v-telfijo'), celular: v('v-celular'), correo: v('v-correo'), direccion: v('v-direccion'), colonia: v('v-colonia'), cp: v('v-cp'), rfc: v('v-rfc') });
  saveDb(['ventas','cajas','clientes']); closeModal(); renderVentas();
}

let _tempFotosEp = [];
let _fotoSessionEp = 0;
let _fotosSubiendoEp = 0;

function handleFotoUploadEp(event) {
  const files = [...event.target.files];
  event.target.value = '';
  const token = _fotoSessionEp;
  files.forEach(file => {
    comprimirImagen(file, dataUrl => {
      if (_fotoSessionEp !== token) return;
      _fotosSubiendoEp++; renderFotosPreviewEp();
      subirFotoAStorage(dataUrl, 'ventas', url => {
        if (_fotoSessionEp !== token) return;
        _fotosSubiendoEp--; _tempFotosEp.push(url); renderFotosPreviewEp();
      });
    });
  });
}
function handleFotoDropEp(event) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const files = Array.from(event.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  const token = _fotoSessionEp;
  files.forEach(file => {
    comprimirImagen(file, dataUrl => {
      if (_fotoSessionEp !== token) return;
      _fotosSubiendoEp++; renderFotosPreviewEp();
      subirFotoAStorage(dataUrl, 'ventas', url => {

function guardarEditPedido(id) {
  if (!can(['admin','secretaria'])) { _info('Sin permiso para editar pedidos.'); return; }
  // Usa la referencia directa guardada al abrir el modal (evita buscar por ID con duplicados).
  const vt = _editingVentaRef || findById(db.ventas, id);
  if (!vt) return;
  // Si no hay items en el editor, conservar los originales del pedido
  if (!ventaItems.length) ventaItems = JSON.parse(JSON.stringify(vt.items || []));
  const anticipo = document.getElementById('ep-anticipo')?.value !== '' ? +document.getElementById('ep-anticipo').value : vt.anticipo;
  const total = ventaItems.reduce((s,i)=>s+i.cantidad*i.precio,0);
  if (can(['admin'])) {
    const nuevoFolio = document.getElementById('ep-folio')?.value.trim();
    if (nuevoFolio && nuevoFolio !== vt.folioPedido) {
      if (db.ventas.find(x => x.folioPedido === nuevoFolio && x.id !== vt.id)) {
        _info('❌ Ya existe un pedido con ese número. Asigna uno diferente.');
        return;
      }
      vt.folioPedido = nuevoFolio;
    }
  }
  vt.cliente     = document.getElementById('ep-cliente')?.value.trim()  || vt.cliente;
  vt.fecha       = document.getElementById('ep-fecha')?.value           || vt.fecha;
  vt.celular     = document.getElementById('ep-celular')?.value.trim()  || '';
  vt.telfijo     = document.getElementById('ep-telfijo')?.value.trim()  || '';
  vt.email       = document.getElementById('ep-email')?.value.trim()    || '';
  vt.ctEmpresa   = document.getElementById('ep-empresa')?.value.trim()  || '';
  vt.ciudad      = document.getElementById('ep-ciudad')?.value.trim()   || '';
  vt.rfc         = document.getElementById('ep-rfc')?.value.trim()      || '';
  vt.fechaEntrega = document.getElementById('ep-fecha-entrega')?.value  || vt.fechaEntrega || '';
  vt.estado      = document.getElementById('ep-estado')?.value          || vt.estado;
  vt.unidad      = document.getElementById('ep-unidad')?.value.trim()   || '';
  vt.tipo        = document.getElementById('ep-tipo')?.value.trim()     || '';
  vt.forro       = document.getElementById('ep-forro')?.value.trim()    || '';
  vt.color       = document.getElementById('ep-color')?.value.trim()    || '';
  vt.observaciones = document.getElementById('ep-obs')?.value           || '';
  vt.notas       = document.getElementById('ep-notas')?.value           || '';
  vt.fotos = [..._tempFotosEp];
  vt.items = ventaItems;
  vt.total = total;
  vt.anticipo = anticipo != null ? anticipo : 0;
  vt.saldo = total - (vt.anticipo || 0);
  if (ventaItems.length && total > 0) vt.pendienteCotizar = undefined;
  saveDb('ventas'); closeModal(); renderVentas();
}

function _rpToggle(key, estado) {
  const okBtn = document.getElementById('rp-ok-'+key);
  const naBtn = document.getElementById('rp-na-'+key);
  if (!okBtn || !naBtn) return;
  const yaActivo = (estado==='ok' && okBtn.classList.contains('btn-success'))
                || (estado==='na' && naBtn.classList.contains('btn-warning'));
  okBtn.classList.remove('btn-success'); okBtn.classList.add('btn-outline');
  naBtn.classList.remove('btn-warning'); naBtn.classList.add('btn-outline');
  if (!yaActivo) {
    if (estado==='ok') { okBtn.classList.remove('btn-outline'); okBtn.classList.add('btn-success'); }
    else               { naBtn.classList.remove('btn-outline'); naBtn.classList.add('btn-warning'); }
  }
}
window['_rpToggle'] = _rpToggle;

function _rpFotoUpload(event) {
  const files = Array.from(event.target.files || []);
  const ses = _rpFotoSession;
  files.forEach(file => {
    _rpFotosSubiendo++;
    _rpRenderFotos();
    comprimirImagen(file, dataUrl => {
      if (ses !== _rpFotoSession) return;
      subirFotoAStorage(dataUrl, 'reportesProduccion', url => {
        if (ses !== _rpFotoSession) return;
        _rpFotos.push(url);
        _rpFotosSubiendo--;
        _rpRenderFotos();
      });
    });
  });
  event.target.value = '';
}
window['_rpFotoUpload'] = _rpFotoUpload;

function _rpFotoDrop(event) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const files = Array.from(event.dataTransfer.files||[]).filter(f=>f.type.startsWith('image/'));
  const ses = _rpFotoSession;
  files.forEach(file => {
    _rpFotosSubiendo++;
    _rpRenderFotos();
    comprimirImagen(file, dataUrl => {
      if (ses !== _rpFotoSession) return;
      subirFotoAStorage(dataUrl, 'reportesProduccion', url => {
        if (ses !== _rpFotoSession) return;
        _rpFotos.push(url);
        _rpFotosSubiendo--;
        _rpRenderFotos();
      });
    });
  });
}

function guardarReporteProduccion(vtId) {
  if (_rpFotosSubiendo > 0) { _info('Espera a que terminen de subir las fotos.'); return; }
  const vt = findById(db.ventas, vtId);
  if (!vt) return;
  const items = _RP_ITEMS.map(it => {
    const okBtn = document.getElementById('rp-ok-'+it.key);
    const naBtn = document.getElementById('rp-na-'+it.key);
    let estado = '';
    if (okBtn && okBtn.classList.contains('btn-success')) estado = 'ok';
    else if (naBtn && naBtn.classList.contains('btn-warning')) estado = 'na';
    const nota = document.getElementById('rp-nota-'+it.key)?.value || '';
    return { key:it.key, label:it.label, grupo:it.grupo, estado, nota };
  });
  const fecha       = document.getElementById('rp-fecha')?.value    || today();
  const revisadoPor = document.getElementById('rp-revisor')?.value  || session.nombre;
  const notas       = document.getElementById('rp-notas')?.value    || '';

  db.reportesProduccion = db.reportesProduccion || [];
  const idx = db.reportesProduccion.findIndex(r => r.pedidoId === vt.id || r.folioPedido === vt.folioPedido);
  const rep = {
    id: idx>=0 ? db.reportesProduccion[idx].id : sid(),
    pedidoId: vt.id, folioPedido: vt.folioPedido||'',
    cliente: vt.cliente, fecha, revisadoPor, items, fotos: [..._rpFotos], notas
  };
  if (idx >= 0) db.reportesProduccion[idx] = rep;
  else db.reportesProduccion.push(rep);
  // Cambiar estado del pedido a "Listo para entrega"
  if (vt.estado !== 'Listo para entrega' && vt.estado !== 'Entregado' && vt.estado !== 'Cancelada') {
    vt.estado = 'Listo para entrega';
    saveDb(['reportesProduccion','ventas']);
  } else {
    saveDb(['reportesProduccion']);
  }
  closeModal();
  renderVentas();
  _info('✅ Reporte de producción guardado. Pedido marcado como "Listo para entrega".');
}

window['_abrirPDFReporteProduccion'] = _abrirPDFReporteProduccion;

// ============================================================
// REPORTE DE ENTREGA — Formato 002
// ============================================================
const _RE_ITEMS = [
  { key:'golpes',      label:'Revisar camioneta golpes o daños' },
  { key:'limp_unidad', label:'Limpieza de unidad' },
  { key:'limp_camion', label:'Limpieza camioneta' },
  { key:'luces',       label:'Revisión de todas las luces' },
  { key:'chapas',      label:'Revisar todas las chapas y/o cerrojos' },
  { key:'partes',      label:'Subir partes o piezas del cliente' },
  { key:'llanta',      label:'Orificio llanta refacción' },
  { key:'ventaneria',  label:'Ventanería que deslice' },
  { key:'barra',       label:'Entregar 1 barra estabilizadora (si le corresponde)', remolque:true },
  { key:'ac',          label:'Revisar aire acondicionado',                          remolque:true },
  { key:'mueble',      label:'Cantidad y acomodo de mueble',                        remolque:true },
  { key:'serie',       label:'Confirmar con cliente número de serie',               remolque:true },
  { key:'llaves',      label:'Revisar con cliente chapas y llaves',                 remolque:true },
];
let _reFotos = [], _reFotoSession = 0, _reFotosSubiendo = 0;

function abrirReporteEntrega(vtId) {
  const vt = findById(db.ventas, vtId);
  if (!vt) return;
  db.reportesEntrega = db.reportesEntrega || [];
  const existente = db.reportesEntrega.find(r => r.pedidoId === vt.id || r.folioPedido === vt.folioPedido);
  _reFotos = existente ? [...(existente.fotos||[])] : [];
  _reFotoSession++;
  _reFotosSubiendo = 0;
  const items = existente
    ? existente.items
    : _RE_ITEMS.map(i => ({ key:i.key, label:i.label, remolque:!!i.remolque, estado:'', nota:'' }));

  const filaItem = (it) => `
    <tr id="re-row-${it.key}" style="border-top:.5px solid var(--border)">
      <td style="padding:6px 8px;font-size:0.87rem">${it.remolque?'<span style="font-size:0.7rem;background:#e0f2fe;color:#0369a1;padding:1px 5px;border-radius:3px;margin-right:4px">remolque</span>':''}${esc(it.label)}</td>
      <td style="padding:4px 6px;text-align:center">
        <button onclick="_reToggle('${it.key}','ok')" id="re-ok-${it.key}" class="btn btn-sm ${it.estado==='ok'?'btn-success':'btn-outline'}" style="padding:3px 10px;font-size:0.8rem;min-width:58px">✅ OK</button>
      </td>
      <td style="padding:4px 6px;text-align:center">
        <button onclick="_reToggle('${it.key}','na')" id="re-na-${it.key}" class="btn btn-sm ${it.estado==='na'?'btn-warning':'btn-outline'}" style="padding:3px 10px;font-size:0.8rem;min-width:52px">➖ N/A</button>
      </td>
      <td style="padding:4px 6px">
        <input id="re-nota-${it.key}" value="${esc(it.nota||'')}" placeholder="Observación..." style="width:100%;padding:3px 6px;font-size:0.8rem;border:1px solid var(--border);border-radius:4px" />
      </td>
    </tr>`;

  showModal(`📋 Reporte de Entrega — ${vt.folioPedido||('#'+vt.id)}`, `
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:0.83rem;color:#475569;margin-bottom:10px;background:#f8fafc;padding:8px 12px;border-radius:8px">
      <span><strong>Cliente:</strong> ${esc(vt.cliente)}</span>
      <span><strong>Fecha:</strong> <input id="re-fecha" type="date" value="${existente?.fecha||today()}" style="padding:2px 6px;border:1px solid var(--border);border-radius:4px;font-size:0.83rem" /></span>
      <span><strong>Revisó:</strong> <input id="re-revisor" value="${esc(existente?.revisadoPor||session.nombre)}" style="padding:2px 8px;border:1px solid var(--border);border-radius:4px;font-size:0.83rem;width:130px" /></span>
    </div>
    <p style="font-size:0.75rem;color:#64748b;background:#fef9c3;padding:5px 10px;border-radius:5px;margin-bottom:10px;border-left:3px solid #ca8a04">⚠️ Si un punto no aplica, selecciona <strong>N/A</strong>. Deja en blanco solo si está pendiente.</p>
    <div class="table-wrap" style="margin-bottom:12px">
      <table style="width:100%;border-collapse:collapse">
        <tr style="background:var(--bg)">
          <th style="padding:6px 8px;text-align:left;font-size:0.78rem">Punto de revisión</th>
          <th style="padding:4px;width:76px;text-align:center;font-size:0.78rem">OK</th>
          <th style="padding:4px;width:68px;text-align:center;font-size:0.78rem">N/A</th>
          <th style="padding:4px;text-align:left;font-size:0.78rem">Observación</th>
        </tr>
        ${items.map(filaItem).join('')}
      </table>
    </div>
    <div class="form-group">
      <label style="font-size:0.82rem;font-weight:700">📷 Fotos (golpes, estado general, detalles)</label>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('re-foto-file').click()">📁 Galería</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('re-foto-cam').click()">📷 Cámara</button>
      </div>
      <div class="foto-upload-area"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="_reFotoDrop(event)"
        onclick="document.getElementById('re-foto-file').click()"
        style="font-size:0.82rem;padding:10px">📁 O arrastra fotos aquí — se comprimen automáticamente</div>
      <input type="file" id="re-foto-file" accept="image/*" multiple style="display:none" onchange="_reFotoUpload(event)" />
      <input type="file" id="re-foto-cam" accept="image/*" capture="environment" style="display:none" onchange="_reFotoUpload(event)" />
      <div class="fotos-preview" id="re-fotos-preview" style="margin-top:8px"></div>
    </div>
    <div class="form-group"><label>Notas generales</label>
      <textarea id="re-notas" rows="2" placeholder="Observaciones adicionales, pendientes, etc." style="resize:vertical">${esc(existente?.notas||'')}</textarea>
    </div>
  `, [
    { label:'💾 Guardar reporte', cls:'btn-primary', action:()=>guardarReporteEntrega(vt.id) },
    ...(existente ? [{ label:'🖨️ Imprimir PDF', cls:'btn-secondary btn-sm', action:()=>{ closeModal(); setTimeout(()=>_cargarLogoYAbrirPDFReporte(existente.id),100); } }] : []),
    { label:'✕ Cancelar', cls:'btn-secondary btn-sm', action:closeModal }
  ], { wide: true });

  setTimeout(() => _reRenderFotos(), 60);
}
window['abrirReporteEntrega'] = abrirReporteEntrega;

function _reToggle(key, estado) {
  const okBtn = document.getElementById('re-ok-'+key);
  const naBtn = document.getElementById('re-na-'+key);
  if (!okBtn || !naBtn) return;
  const yaActivo = (estado==='ok' && okBtn.classList.contains('btn-success'))
                || (estado==='na' && naBtn.classList.contains('btn-warning'));
  okBtn.classList.remove('btn-success'); okBtn.classList.add('btn-outline');
  naBtn.classList.remove('btn-warning'); naBtn.classList.add('btn-outline');
  if (!yaActivo) {
    if (estado==='ok') { okBtn.classList.remove('btn-outline'); okBtn.classList.add('btn-success'); }
    else               { naBtn.classList.remove('btn-outline'); naBtn.classList.add('btn-warning'); }
  }
}
window['_reToggle'] = _reToggle;

function _reFotoUpload(event) {
  const files = Array.from(event.target.files || []);
  const ses = _reFotoSession;
  files.forEach(file => {
    _reFotosSubiendo++;
    _reRenderFotos();
    comprimirImagen(file, dataUrl => {
      if (ses !== _reFotoSession) return;
      subirFotoAStorage(dataUrl, 'reportesEntrega', url => {
        if (ses !== _reFotoSession) return;
        _reFotos.push(url);
        _reFotosSubiendo--;
        _reRenderFotos();
      });
    });
  });
  event.target.value = '';
}
window['_reFotoUpload'] = _reFotoUpload;

function _reFotoDrop(event) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const files = Array.from(event.dataTransfer.files||[]).filter(f=>f.type.startsWith('image/'));
  const ses = _reFotoSession;
  files.forEach(file => {
    _reFotosSubiendo++;
    _reRenderFotos();
    comprimirImagen(file, dataUrl => {
      if (ses !== _reFotoSession) return;
      subirFotoAStorage(dataUrl, 'reportesEntrega', url => {
        if (ses !== _reFotoSession) return;
        _reFotos.push(url);
        _reFotosSubiendo--;
        _reRenderFotos();
      });
    });
  });
}
window['_reFotoDrop'] = _reFotoDrop;

function _reRenderFotos() {
  const el = document.getElementById('re-fotos-preview');
  if (!el) return;
  const subiendo = _reFotosSubiendo > 0
    ? `<div style="color:#64748b;font-size:0.78rem;padding:4px 0">⏳ Subiendo ${_reFotosSubiendo} foto(s)…</div>` : '';
  el.innerHTML = subiendo + _reFotos.map((src,i) => `
    <div style="position:relative;display:inline-block;margin:2px">
      <img src="${src}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border)" />
      <button onclick="_reElimFoto(${i})" style="position:absolute;top:-5px;right:-5px;background:#dc2626;color:white;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px;line-height:1;padding:0">✕</button>
    </div>`).join('');
}
window['_reRenderFotos'] = _reRenderFotos;

function _reElimFoto(i) { _reFotos.splice(i,1); _reRenderFotos(); }
window['_reElimFoto'] = _reElimFoto;

function guardarReporteEntrega(vtId) {
  if (_reFotosSubiendo > 0) { _info('Espera a que terminen de subir las fotos.'); return; }
  const vt = findById(db.ventas, vtId);
  if (!vt) return;
  const items = _RE_ITEMS.map(it => {
    const okBtn = document.getElementById('re-ok-'+it.key);
    const naBtn = document.getElementById('re-na-'+it.key);
    let estado = '';
    if (okBtn && okBtn.classList.contains('btn-success')) estado = 'ok';
    else if (naBtn && naBtn.classList.contains('btn-warning')) estado = 'na';
    const nota = document.getElementById('re-nota-'+it.key)?.value || '';
    return { key:it.key, label:it.label, remolque:!!it.remolque, estado, nota };
  });
  const fecha      = document.getElementById('re-fecha')?.value   || today();
  const revisadoPor= document.getElementById('re-revisor')?.value || session.nombre;
  const notas      = document.getElementById('re-notas')?.value   || '';

  db.reportesEntrega = db.reportesEntrega || [];
  const idx = db.reportesEntrega.findIndex(r => r.pedidoId === vt.id || r.folioPedido === vt.folioPedido);
  const rep = {
    id: idx>=0 ? db.reportesEntrega[idx].id : sid(),
    pedidoId: vt.id, folioPedido: vt.folioPedido||'',
    cliente: vt.cliente, fecha, revisadoPor, items, fotos: [..._reFotos], notas
  };
  if (idx >= 0) db.reportesEntrega[idx] = rep;
  else db.reportesEntrega.push(rep);
  saveDb(['reportesEntrega']);
  closeModal();
  _info('✅ Reporte de entrega guardado.');
}
window['guardarReporteEntrega'] = guardarReporteEntrega;

function _cargarLogoYAbrirPDFReporte(repId) {
  const rep = (db.reportesEntrega||[]).find(r => r.id === repId);
  if (!rep) return;
  const logoEl = document.getElementById('logo-img');
  const intentarConLogo = (src) => {
    if (!src) { _abrirPDFReporteEntrega(rep,''); return; }
    const c = document.createElement('canvas');
    const img = new Image(); img.crossOrigin='anonymous';
    img.onload = () => { c.width=img.width; c.height=img.height; c.getContext('2d').drawImage(img,0,0); _abrirPDFReporteEntrega(rep, c.toDataURL('image/png')); };
    img.onerror = () => _abrirPDFReporteEntrega(rep,'');
    img.src = src;
  };
  intentarConLogo(logoEl?.src && !logoEl.src.includes('undefined') ? logoEl.src : '');
}
window['_cargarLogoYAbrirPDFReporte'] = _cargarLogoYAbrirPDFReporte;

  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Reporte Entrega ${e2(rep.folioPedido||rep.id)}</title>

async function archivarVenta(id) {
  const vt = db.ventas.find(v => v.id === id);
  if (!vt) return;
  const folio = esc(vt.folioPedido || ('#' + vt.id));
  showModal('Archivar venta', `

function clienteKey(nombre) { return (nombre || '').trim().toLowerCase(); }
function clienteCreditoAutorizado(nombre) {
  return (db.clientesCredito || []).includes(clienteKey(nombre));
}
function autorizarCreditoCliente(nombre) {
  const k = clienteKey(nombre);
  if (!k) return;
  if (!db.clientesCredito) db.clientesCredito = [];
  if (!db.clientesCredito.includes(k)) db.clientesCredito.push(k);
}
function revocarCreditoCliente(nombre) {
  const k = clienteKey(nombre);
  db.clientesCredito = (db.clientesCredito || []).filter(c => c !== k);
}

// Otorgar crédito a un pedido: lo marca como "Entregado" y crea automáticamente su registro
// en Cobranza con el saldo pendiente, para darle seguimiento de cobro ahí. El administrador
// puede hacerlo directo; cualquier otro usuario necesita autorización (usuario+contraseña admin)
// la primera vez para ese cliente — después ya no se le vuelve a pedir, salvo que el

  const vt = findById(db.ventas, id);

async function _autorizarCredito(id) {

function _aplicarCredito(id) {
  const vt = findById(db.ventas, id);
  if (!vt) return;
  const saldo = vt.saldo != null ? vt.saldo : Math.max(0, vt.total - (vt.anticipo||0));
  const yaPagado = Math.max(0, vt.total - saldo);
  const credito = document.getElementById('oc-credito')?.value.trim() || '';
  const encargado = document.getElementById('oc-encargado')?.value.trim() || '';
  const tel = document.getElementById('oc-tel')?.value.trim() || '';
  const folioDefault = vt.folioPedido || 'PED-' + String(vt.id).padStart(5,'0');
  const pedido = document.getElementById('oc-pedido')?.value.trim() || folioDefault;

  const cobId = sid();
  db.cobranza.push({
    id: cobId,
    cliente: vt.cliente,
    encargado: encargado || vt.usuario || session.nombre,
    tel,
    pedido,
    fecha: today(),
    total: vt.total,
    credito,
    estado: 'Pendiente',
    recFecha: '',
    recNota: '',
    recHecho: false,
    abonos: yaPagado > 0 ? [{ monto: yaPagado, fecha: today(), nota: 'Anticipo del pedido (previo a cobranza)' }] : [],
    usuario: session.nombre
  });
  vt.cobranzaId = cobId;
  vt.estado = 'Entregado';
  autorizarCreditoCliente(vt.cliente);
  saveDb(['ventas','cobranza','clientesCredito']); closeModal(); renderVentas();

      const fecha = esAdminPago ? document.getElementById('pago-fecha').value : today();
      const hora  = horaAhora;
      const nota  = document.getElementById('pago-nota').value.trim();
      const formaPago = document.getElementById('pago-forma').value || 'efectivo';

      // El pago de secretaria/auxiliar se refleja en SU PROPIA caja chica (igual que abonos de
      // cobranza), pero solo si fue en efectivo: si fue cheque/transferencia/tarjeta el dinero

      let cajaMovId = null, cajaUsuario = null;

      vt.anticipo = vt.pagos.reduce((s,p) => s + p.monto, 0);
      vt.saldo    = Math.max(0, vt.total - vt.anticipo);

function _aplicarEliminarPago(id, idx) {
  const vt = (window._verVentaRef && (window._verVentaRef.id === id || window._verVentaRef.id == id) ? window._verVentaRef : null) || findById(db.ventas, id);
  if (!vt || !vt.pagos) return;
  const pago = vt.pagos[idx];

  // Si este pago había generado un movimiento en caja chica, lo revertimos para que
  // las cantidades de caja vuelvan a coincidir.
  if (pago && pago.cajaMovId && pago.cajaUsuario) {
    const caja = db.cajas.find(c => c.usuario === pago.cajaUsuario && c.movimientos && c.movimientos.some(m => m.id === pago.cajaMovId));
    if (caja) {
      const mIdx = caja.movimientos.findIndex(m => m.id === pago.cajaMovId);
      if (mIdx > -1) caja.movimientos.splice(mIdx, 1);
    }
  }

  vt.pagos.splice(idx, 1);
  vt.anticipo = vt.pagos.reduce((s,p) => s + p.monto, 0);
  vt.saldo    = Math.max(0, vt.total - vt.anticipo);
  if (vt.saldo > 0 && vt.estado === 'Pagada') vt.estado = 'Pendiente';
  saveDb(['ventas','cajas']); renderVentas(); closeModal();
  setTimeout(() => verVenta(id), 150);
}

// ── Devolución en caja al cancelar venta ──
// 1) Pagos que ya tenían cajaMovId → salida automática en esa caja (si sigue abierta).
// 2) Monto pagado sin vínculo a caja (cheque/transferencia/tarjeta o cobrado por admin):
//    si quien cancela es secretaria/auxiliar, pregunta si devuelve en efectivo desde su caja.
function _procesarDevolucionCajaCancel(vt) {
  const pagos = vt.pagos || [];
  const ahora = new Date();
  const hora = ahora.toTimeString().slice(0,5);
  let montoAutoCaja = 0;

  // 1. Revertir pagos vinculados a caja
  pagos.forEach(p => {
    if (!p.cajaMovId || !p.cajaUsuario) return;
    const caja = db.cajas.find(c => c.usuario === p.cajaUsuario && !c.cerrada);
    if (!caja) return; // caja ya cerrada, no se puede revertir en línea
    caja.movimientos = caja.movimientos || [];
    caja.movimientos.push({
      id: sid(), tipo: 'salida',
      concepto: `Devolución — cancelación ${vt.folioPedido || ''} (${vt.cliente || ''})`,
      monto: p.monto, hora, usuario: session.nombre
    });
    montoAutoCaja += p.monto;
  });

  const totalPagado = pagos.reduce((s, p) => s + (p.monto || 0), 0);
  const sinCaja = Math.max(0, totalPagado - montoAutoCaja);

  if (montoAutoCaja > 0) saveDb('cajas');

  // 2. Si queda monto sin caja y quien cancela es secretaria/auxiliar, preguntar
  if (sinCaja > 0 && (session.rol === 'secretaria' || session.rol === 'auxiliar')) {
    const caja = cajaActiva();
    const _saldo = (c) => {
      if (!c) return 0;
      const movs = c.movimientos || [];
      const ventas = (db.ventas || []).filter(v => v.cajaSesion === c.id).reduce((s, v) => s + v.total, 0);
      return c.fondo + movs.filter(m => m.tipo === 'entrada').reduce((s, m) => s + m.monto, 0) + ventas - movs.filter(m => m.tipo === 'salida').reduce((s, m) => s + m.monto, 0);
    };
    const saldoDisp = _saldo(caja);
    const formas = [...new Set(pagos.filter(p => !p.cajaMovId).map(p => p.formaPago || 'efectivo'))].join(', ');

    showModal('💵 Devolución al cliente', `
      <div style="text-align:center;padding:8px 0">
        <p style="margin-bottom:10px">Hay un pago de <strong>$${fmt(sinCaja)}</strong> (${formas}) que no está en tu caja chica.</p>
        <p style="font-size:0.85rem;color:#64748b;margin-bottom:14px">Tu saldo en caja: <strong style="color:${saldoDisp>=sinCaja?'var(--success)':'var(--danger)'}">$${fmt(saldoDisp)}</strong></p>
        <p style="font-size:0.9rem">¿Devuelves este dinero al cliente desde tu caja?</p>
      </div>
    `, [
      { label: `💵 Sí, lo devuelvo`, cls: saldoDisp > 0 ? 'btn-primary' : 'btn-warning', action: () => {
        if (!caja) {
          closeModal();
          setTimeout(() => showModal('⚠️ Sin caja abierta', '<p style="text-align:center">No tienes caja abierta. El administrador debe entregar la devolución al cliente.</p>', [{ label: 'Cerrar', cls: 'btn-secondary', action: closeModal }]), 150);
          return;
        }
        const faltante = sinCaja - saldoDisp;
        if (faltante > 0) {
          // No alcanza — preguntar si cubre parcial o todo lo da el admin
          closeModal();
          setTimeout(() => showModal('⚠️ Saldo insuficiente', `
            <div style="text-align:center;padding:8px 0">
              <p>Necesitas devolver <strong>$${fmt(sinCaja)}</strong> pero tu caja solo tiene <strong style="color:var(--danger)">$${fmt(saldoDisp)}</strong>.</p>
              <p style="margin-top:10px;font-size:0.9rem">¿Cómo se cubre la devolución?</p>
            </div>
          `, [
            { label: `Yo pongo $${fmt(saldoDisp)} y el admin $${fmt(faltante)}`, cls: 'btn-primary', action: () => {
              caja.movimientos = caja.movimientos || [];
              caja.movimientos.push({ id: sid(), tipo: 'salida', concepto: `Devolución (parcial) — cancelación ${vt.folioPedido || ''} (${vt.cliente || ''})`, monto: saldoDisp, hora, usuario: session.nombre });
              saveDb('cajas'); closeModal();
              setTimeout(() => showModal('📋 Aviso para el administrador', `<p style="text-align:center">El administrador debe entregar <strong>$${fmt(faltante)}</strong> al cliente para completar la devolución.</p>`, [{ label: 'Entendido', cls: 'btn-secondary', action: closeModal }]), 200);
            }},
            { label: 'Todo lo cubre el administrador', cls: 'btn-secondary', action: closeModal }
          ]), 200);
        } else {
          caja.movimientos = caja.movimientos || [];
          caja.movimientos.push({ id: sid(), tipo: 'salida', concepto: `Devolución — cancelación ${vt.folioPedido || ''} (${vt.cliente || ''})`, monto: sinCaja, hora, usuario: session.nombre });
          saveDb('cajas'); closeModal();
        }
      }},
      { label: 'No, lo entrega el administrador', cls: 'btn-secondary', action: closeModal }
    ]);
  }
}

function cancelarVenta(id) {
  const vt = findById(db.ventas, id);
  if (!vt) return;
  if (vt.estado === 'Cancelada') { _info('Esta venta ya está cancelada.'); return; }

  const _doCancelar = (autorizadoPor) => {
    vt.estado = 'Cancelada';
    vt.canceladaPor = autorizadoPor || session.nombre;
    vt.canceladaFecha = today();
    saveDb('ventas'); renderVentas();
    closeModal();
    setTimeout(() => _procesarDevolucionCajaCancel(vt), 200);
  };

  if (can(['admin'])) {
    // Admin cancela con modal propio (evita bloqueo de confirm() en Chrome)
    const msg = vt.ticketImpreso
      ? `<p>⚠️ Este ticket ya fue impreso el <strong>${vt.ticketFecha}</strong>.</p><p>¿Confirmas la cancelación?</p>`
      : `<p>¿Cancelar esta venta/pedido?</p>`;
    showModal('Cancelar venta', `<div style="text-align:center;padding:8px 0">${msg}</div>`, [
      { label: '✕ Sí, cancelar', cls: 'btn-danger', action: () => { _doCancelar(session.nombre); } },
      { label: 'No', cls: 'btn-secondary', action: closeModal }
    ]);
    return;
  }

  // Otro usuario: solicitar usuario y contraseña de un administrador (validado contra Firebase Auth, sin afectar la sesión activa)
  showModal('🔒 Autorización requerida', `
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:2.5rem;margin-bottom:8px">🔒</div>
      <p style="font-size:0.9rem;color:#475569;margin-bottom:16px">Para cancelar esta venta se requiere<br>usuario y contraseña de un <strong>Administrador</strong>.</p>
      <div class="form-group" style="max-width:240px;margin:0 auto">
        <label>Usuario administrador</label>
        <input id="admin-user-cancel" type="text" placeholder="usuario..." autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" />
      </div>
      <div class="form-group" style="max-width:240px;margin:0 auto">
        <label>Contraseña de administrador</label>
        <div style="position:relative">
        <input id="admin-pass-cancel" type="text" placeholder="Contraseña..." autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" style="padding-right:38px;-webkit-text-security:disc;text-security:disc"
          onkeydown="if(event.key==='Enter')confirmarCancelConPass(${id})" />
        <button type="button" onclick="toggleVerPass('admin-pass-cancel',this)" title="Mostrar/ocultar contraseña" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;padding:4px">👁️</button>
        </div>
      </div>
      <p id="cancel-pass-error" style="color:#dc2626;font-size:0.82rem;margin-top:8px;display:none">Usuario o contraseña incorrectos</p>
    </div>
  `, [
    { label: '✕ Cancelar venta', cls: 'btn-danger', action: () => confirmarCancelConPass(id) },
    { label: 'Cerrar', cls: 'btn-secondary', action: closeModal }
  ]);
  setTimeout(() => document.getElementById('admin-user-cancel')?.focus(), 100);
}

async function confirmarCancelConPass(id) {
  const vt = findById(db.ventas, id);
  if (!vt) return;
  const adminLogin = document.getElementById('admin-user-cancel')?.value || '';
  const pass = document.getElementById('admin-pass-cancel')?.value || '';
  const errEl = document.getElementById('cancel-pass-error');
  const btnDanger = document.querySelector('#modal .btn-danger');
  if (btnDanger) { btnDanger.disabled = true; }
  const ok = await verificarPasswordAdmin(adminLogin, pass);
  if (btnDanger) { btnDanger.disabled = false; }
  if (!ok) {
    if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Usuario o contraseña incorrectos'; }
    return;
  }
  vt.estado = 'Cancelada';
  vt.canceladaPor = `${esc(session.nombre)} (auth: ${adminLogin})`;
  vt.canceladaFecha = today();
  saveDb('ventas'); renderVentas();
  closeModal();
  setTimeout(() => _procesarDevolucionCajaCancel(vt), 200);
}

// Genera los códigos de barras (vía CDN, igual patrón que la carga diferida de jsPDF) en los

// del ticket para poder escanearlo después al procesar una devolución.
function _dibujarBarcodesYImprimir(ids, valor) {
  const dibujar = () => {
    try {
      ids.forEach(elId => {
        const el = document.getElementById(elId);
        if (el && window.JsBarcode) {
          window.JsBarcode(el, valor, { format:'CODE128', width:1.3, height:32, fontSize:10, margin:0, displayValue:true });
        }
      });
    } catch(e) { console.warn('[Barcode] no se pudo generar', e); }
    window.print();
  };
  if (window.JsBarcode) { dibujar(); return; }
  // Nota: antes esta función cargaba JsBarcode 3.11.5 desde una URL de cdnjs que ya
  // no existe (404) — el código de barras del ticket llevaba tiempo sin generarse en
  // silencio. Se corrigió reutilizando el mismo cargador (con SRI) que ya usa el resto
  // de la app para JsBarcode.
  _cargarLibJsBarcode(dibujar);
}

// ===================== DEVOLUCIONES =====================
// Solo el administrador puede procesar devoluciones. Se busca la venta por el folio del
// ticket (el mismo valor codificado en el código de barras impreso), se eligen los
// artículos y cantidades a devolver, se reintegran a inventario, se reduce el total de la
// venta y, si se cobró en efectivo, se retira el monto de la caja chica de quien lo cobró.

function _devBuscarVentaPorFolio(texto) {
  const q = (texto||'').trim().toUpperCase();
  if (!q) return null;
  const soloNum = q.replace(/^TKT-?/,'').replace(/^0+/,'') || q.replace(/\D/g,'');
  return db.ventas.find(vt => {
    if ((vt.ticketFolio||'').toUpperCase() === q) return true;
    if (`TKT-${String(vt.id).padStart(5,'0')}` === q) return true;
    if (soloNum && String(vt.id) === soloNum) return true;
    if ((vt.folioPedido||'').toUpperCase() === q) return true;
    return false;
  }) || null;
}

function _devToggleQuien() {

function _devActualizarMonto(anticipo) {
  const radios = document.querySelectorAll('input[name="dev-penalidad"]');
  const selVal = Array.from(radios).find(r => r.checked)?.value || 'total';
  const inputWrap = document.getElementById('dev-penalidad-input');
  if (inputWrap) inputWrap.style.display = selVal === 'otro' ? '' : 'none';
  const totalEl = document.getElementById('dev-total');
  if (!totalEl) return;
  let monto = anticipo;
  if (selVal === 'otro') {
    const inp = document.getElementById('dev-monto-penal');
    monto = Math.min(+(inp && inp.value) || 0, anticipo);
  }
  const penalidad = anticipo - monto;
  totalEl.innerHTML = `Total a reembolsar: <strong>$${fmt(monto)}</strong>` +
    (penalidad > 0 ? `<span style="color:#dc2626;font-size:0.82rem;display:block">Penalización aplicada: $${fmt(penalidad)}</span>` : '') +
    `<span style="font-size:0.78rem;color:#64748b;font-weight:400;display:block">El importe completo del pedido lo gestiona el administrador.</span>`;
}
window['_devActualizarMonto'] = _devActualizarMonto;

// Calcula el saldo actual disponible en una caja (mismo cálculo que renderCaja).
function _saldoCajaActual(caja) {
  if (!caja) return 0;
  const movs = caja.movimientos || [];
  const entradas = movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(m.monto||0),0);
  const salidas  = movs.filter(m=>m.tipo==='salida').reduce((s,m)=>s+(m.monto||0),0);
  const ventasCaja = (db.ventas||[]).filter(v => v.cajaSesion === caja.id);
  const totalVentas = ventasCaja.reduce((s,v)=>s+(v.total||0),0);
  return (caja.fondo||0) + entradas + totalVentas - salidas;
}

function _devCalcular() {
  const vt = window._devVentaActual;
  if (!vt) return;
  let total = 0;
  document.querySelectorAll('.dev-chk').forEach(chk => {
    const idx = +chk.dataset.idx;
    const item = vt.items[idx];
    const qtyInput = document.querySelector(`.dev-qty[data-idx="${idx}"]`);
    const subEl = document.querySelector(`.dev-sub[data-idx="${idx}"]`);
    const qty = chk.checked ? (+(qtyInput && qtyInput.value) || 0) : 0;
    const sub = qty * (item.precio||0);
    if (subEl) subEl.textContent = '$' + fmt(sub);
    total += sub;
  });
  const totalEl = document.getElementById('dev-total');
  if (!totalEl) return;
  // Secretaria/auxiliar: solo reembolsa el anticipo (o menos si hay penalización)
  if (!can(['admin'])) {
    _devActualizarMonto(vt.anticipo || 0);
  } else {
    totalEl.textContent = 'Total a reembolsar: $' + fmt(total);
  }
}
window['_devCalcular'] = _devCalcular;

// Busca una caja del usuario indicado (de preferencia la que tenga abierta; si no, la más
// reciente) para reflejar ahí el retiro por una devolución cobrada en efectivo.
function _devCajaDeUsuario(usuario) {
  const cajas = (db.cajas||[]).filter(c => c.usuario === usuario);
  if (!cajas.length) return null;
  return cajas.find(c => !c.cerrada) || cajas[cajas.length-1];
}

function _devConfirmar(id) {
  if (!can(['admin']) && !window._devAutorizadoPor) { _info('Esta acción requiere autorización de un administrador.'); return; }
  const vt = findById(db.ventas, id);
  if (!vt) return;
  const seleccion = [];
  for (const chk of Array.from(document.querySelectorAll('.dev-chk'))) {
    if (!chk.checked) continue;
    const idx = +chk.dataset.idx;
    const qtyInput = document.querySelector(`.dev-qty[data-idx="${idx}"]`);
    const qty = +(qtyInput && qtyInput.value) || 0;
    const item = vt.items[idx];
    if (!item || qty <= 0) continue;
    const disponible = (item.cantidad||0) - (item.devuelto||0);
    if (qty > disponible) { _info(`La cantidad a devolver de "${item.producto}" excede lo disponible (${disponible}).`); return; }
    seleccion.push({ idx, qty, item });
  }
  if (!seleccion.length) { _info('Selecciona al menos un artículo a devolver.'); return; }
  // Secretaria/auxiliar solo reembolsa el anticipo (o menos si hay penalización)
  const totalCalculado = round2(seleccion.reduce((s,x) => s + x.qty * (x.item.precio||0), 0));
  let totalReembolso;
  if (can(['admin'])) {
    totalReembolso = totalCalculado;
  } else {
    const anticipo = vt.anticipo || 0;
    const radios = document.querySelectorAll('input[name="dev-penalidad"]');
    const selVal = Array.from(radios).find(r => r.checked)?.value || 'total';
    if (selVal === 'otro') {
      const inp = document.getElementById('dev-monto-penal');
      totalReembolso = round2(Math.min(+(inp && inp.value) || 0, anticipo));
    } else {
      totalReembolso = round2(anticipo);
    }
  }
  const motivo = v('dev-motivo');
  const forma = v('dev-forma') || 'efectivo';
  const quien = v('dev-quien') || 'admin';
  const formaTxt = forma === 'efectivo' ? 'Efectivo' : (forma === 'transferencia' ? 'Transferencia' : 'Cheque');

  // Si el efectivo lo entrega la secretaria/auxiliar desde su propia caja, debe tener
  // saldo suficiente; si no alcanza, se bloquea la devolución por esa vía.
  let cajaPropia = null;
  if (forma === 'efectivo' && quien === 'propia' && totalReembolso > 0) {
    cajaPropia = _devCajaDeUsuario(session.nombre);
    const saldoDisp = _saldoCajaActual(cajaPropia);
    if (!cajaPropia || saldoDisp < totalReembolso) {
      _info(`No hay suficiente dinero en tu caja chica para entregar esta devolución.\nDisponible: $${fmt(saldoDisp)} · Requerido: $${fmt(totalReembolso)}\n\nElige que la entregue el Administrador, o usa otra forma de devolución.`);
      return;
    }
  }

  const confirmMsg = forma === 'efectivo'
    ? (quien === 'propia'
        ? `¿Confirmar devolución por $${fmt(totalReembolso)} en EFECTIVO, que tú entregarás desde tu caja chica?\n\nEsto regresará los artículos a inventario y descontará el monto de tu caja.`
        : `¿Confirmar devolución por $${fmt(totalReembolso)} en EFECTIVO, entregado directamente por el Administrador?\n\nEsto regresará los artículos a inventario. No afectará ninguna caja chica de secretaria/auxiliar.`)
    : `¿Confirmar devolución por $${fmt(totalReembolso)} vía ${formaTxt}?\n\nEsto regresará los artículos a inventario. Esta forma no afecta ninguna caja chica.`;
  if (!confirm(confirmMsg)) return;

  // 1) Regresar a inventario y marcar lo devuelto en cada renglón de la venta.
  seleccion.forEach(({qty, item}) => {
    item.devuelto = (item.devuelto||0) + qty;
    if (item._tipo && item._itemId != null) {
      const inv = findById(db[item._tipo]||[], item._itemId);
      if (inv) inv.cantidad = (inv.cantidad||0) + qty;
    }
  });

  // 2) Reducir el total por el VALOR de los artículos devueltos (no por el reembolso en efectivo).
  //    El reembolso reduce el anticipo (lo que ya se pagó). El saldo se recalcula.
  vt.total = round2(Math.max(0, (vt.total||0) - totalCalculado));
  vt.anticipo = round2(Math.max(0, (vt.anticipo||0) - totalReembolso));
  vt.saldo = round2(Math.max(0, vt.total - (vt.anticipo||0)));

  // 3) Si todos los artículos fueron devueltos → cancelar la nota automáticamente.
  const todoDevuelto = (vt.items||[]).every(i => (i.devuelto||0) >= (i.cantidad||0));
  if (todoDevuelto) {
    vt.estado = 'Cancelada';
    vt.canceladaPor = window._devAutorizadoPor || session.nombre;
    vt.canceladaFecha = today();
  }

  // 3) Afectar caja chica SOLO si la devolución es en efectivo y la entrega secretaria/auxiliar
  // desde su propia caja. Si la entrega el Administrador directamente, o si la forma es
  // transferencia/cheque, no se toca ninguna caja chica.
  let cajaAfectada = null;
  let entregadoPor = null;
  if (forma === 'efectivo') {
    entregadoPor = quien === 'propia' ? session.nombre : 'Administrador';
    if (quien === 'propia' && totalReembolso > 0) {
      const caja = cajaPropia || _devCajaDeUsuario(session.nombre);
      if (caja) {
        if (!caja.movimientos) caja.movimientos = [];
        caja.movimientos.push({ id: sid(), tipo:'salida', concepto: 'Devolución — ' + (vt.cliente||''), monto: totalReembolso, hora: new Date().toTimeString().slice(0,5), usuario: session.nombre });
        cajaAfectada = caja.usuario;
      }
    }
  }

  if (!vt.devoluciones) vt.devoluciones = [];
  vt.devoluciones.push({
    fecha: today(), hora: new Date().toTimeString().slice(0,5), usuario: window._devAutorizadoPor || session.nombre, motivo,
    forma: formaTxt, entregadoPor,
    items: seleccion.map(s => ({ producto: s.item.producto, cantidad: s.qty, precio: s.item.precio })),
    monto: totalReembolso
  });

  window._devAutorizadoPor = null;
  saveDb(['ventas','cajas','materia','productos','consignacion']); closeModal(); renderVentas();
  let nota = '';
  if (cajaAfectada) nota = ' Se reflejó como salida en la caja chica de ' + cajaAfectada + '.';
  else if (forma === 'efectivo') nota = ' El Administrador entregó el efectivo directamente; no afectó ninguna caja chica.';
  else nota = ` Forma: ${formaTxt} — no afecta caja chica.`;
  _info(`✅ Devolución registrada por $${fmt(totalReembolso)}.${nota}`);
}
window['_devConfirmar'] = _devConfirmar;

// ===================== DIRECTORIO DE CLIENTES =====================
// Guarda/actualiza un registro central de clientes cada vez que se elabora una
// cotización o una venta/pedido directo, para que si el cliente vuelve a comprar
// ya tengamos sus datos (y se le puedan autocompletar en el formulario).
function _limpiarTel(t) {
  return (t || '').replace(/\D/g, '');
}
function buscarClientePorContacto(celular, telfijo, correo) {
  const cel = _limpiarTel(celular), tel = _limpiarTel(telfijo);
  const mail = (correo || '').trim().toLowerCase();
  if (!cel && !tel && !mail) return null;
  return (db.clientes || []).find(c =>
    (cel && cel.length >= 8 && _limpiarTel(c.celular) === cel) ||
    (tel && tel.length >= 8 && _limpiarTel(c.telfijo) === tel) ||
    (mail && (c.correo || '').trim().toLowerCase() === mail)
  ) || null;
}
function upsertCliente(datos) {
  const limpio = x => (x && x !== 'No aplica') ? String(x).trim() : '';
  const nombre = limpio(datos.nombre), apellido = limpio(datos.apellido);
  const celular = limpio(datos.celular), telfijo = limpio(datos.telfijo), correo = limpio(datos.correo);
  if (!nombre && !celular && !correo) return null; // no hay nada útil que guardar
  const existente = buscarClientePorContacto(celular, telfijo, correo);
  const hoy = today();
  if (existente) {
    if (nombre) existente.nombre = nombre;
    if (apellido) existente.apellido = apellido;
    if (limpio(datos.ciudad)) existente.ciudad = limpio(datos.ciudad);
    if (limpio(datos.estado)) existente.estado = limpio(datos.estado);
    if (limpio(datos.empresa)) existente.empresa = limpio(datos.empresa);
    if (telfijo) existente.telfijo = telfijo;
    if (celular) existente.celular = celular;
    if (correo) existente.correo = correo;
    if (limpio(datos.direccion)) existente.direccion = limpio(datos.direccion);
    if (limpio(datos.colonia)) existente.colonia = limpio(datos.colonia);
    if (limpio(datos.cp)) existente.cp = limpio(datos.cp);
    if (limpio(datos.rfc)) existente.rfc = limpio(datos.rfc);
    existente.ultimaCompra = hoy;
    existente.totalCompras = (existente.totalCompras || 0) + 1;
    return existente;
  }
  const nuevo = {
    id: sid(), nombre, apellido,
    ciudad: limpio(datos.ciudad), estado: limpio(datos.estado), empresa: limpio(datos.empresa),
    telfijo, celular, correo,
    direccion: limpio(datos.direccion||''), colonia: limpio(datos.colonia||''), cp: limpio(datos.cp||''), rfc: limpio(datos.rfc||''),
    primeraCompra: hoy, ultimaCompra: hoy, totalCompras: 1
  };
  db.clientes.push(nuevo);
  return nuevo;
}
// Se llama al salir (onblur) del campo de teléfono/celular en un formulario.
// prefix: 'cz' (cotización) o 'v' (venta directa). Si encuentra un cliente ya
// registrado con ese teléfono, rellena el resto de los campos vacíos.
// ── AUTOCOMPLETE CLIENTE (dropdown al escribir el nombre) ──────────────────
function _acCliente(prefix, el) {
  const q = (el.value || '').trim().toLowerCase();
  let drop = document.getElementById('_ac-global-drop');
  if (q.length < 2) { if (drop) drop.style.display = 'none'; return; }

  const matches = (db.clientes || []).filter(c => {
    const n = [c.nombre, c.apellido].filter(Boolean).join(' ').toLowerCase();
    const emp = (c.empresa && c.empresa !== 'No aplica' ? c.empresa : '').toLowerCase();
    return n.includes(q) || emp.includes(q);
  }).sort((a, b) => {
    const na = [a.nombre, a.apellido].filter(Boolean).join(' ').toLowerCase();
    const nb = [b.nombre, b.apellido].filter(Boolean).join(' ').toLowerCase();
    if (na.startsWith(q) && !nb.startsWith(q)) return -1;
    if (!na.startsWith(q) && nb.startsWith(q)) return 1;
    return (b.totalCompras||0) - (a.totalCompras||0);
  }).slice(0, 8);

  if (!matches.length) { if (drop) drop.style.display = 'none'; return; }

  if (!drop) {
    drop = document.createElement('div');
    drop.id = '_ac-global-drop';
    drop.className = 'ac-drop';
    drop.style.position = 'fixed';
    drop.style.zIndex = '99999';
    document.body.appendChild(drop);
  }

  const rect = el.getBoundingClientRect();
  drop.style.left   = rect.left + 'px';
  drop.style.top    = (rect.bottom + 4) + 'px';
  drop.style.width  = rect.width + 'px';
  drop.style.display = 'block';
  drop.dataset.prefix = prefix;

  drop.innerHTML = matches.map(c => {
    const nombre = [c.nombre, c.apellido].filter(Boolean).join(' ');
    const emp = c.empresa && c.empresa !== 'No aplica' ? c.empresa : '';
    const sub = [emp, c.ciudad].filter(Boolean).join(' · ');
    return `<div class="ac-item" onmousedown="_acSelect(event,'${prefix}',${c.id})">
      <div class="ac-item-name">${esc(nombre)}</div>
      ${sub ? `<div class="ac-item-sub">${esc(sub)}</div>` : ''}
    </div>`;
  }).join('');
}

function _acSelect(e, prefix, clienteId) {
  e.preventDefault();
  const c = (db.clientes || []).find(x => x.id === clienteId);
  if (!c) return;
  const set = (campo, val) => {
    const el = document.getElementById(prefix + '-' + campo);
    if (el) el.value = (val && val !== 'No aplica') ? val : '';
  };
  set('nombre',    c.nombre);
  set('apellido',  c.apellido);
  set('empresa',   c.empresa);
  set('ciudad',    c.ciudad);
  set('estado',    c.estado);
  set('telfijo',   c.telfijo);
  set('celular',   c.celular);
  set('correo',    c.correo);
  set('direccion', c.direccion);
  set('colonia',   c.colonia);
  set('cp',        c.cp);
  set('rfc',       c.rfc);
  // Abrir el <details> de datos del cliente si está cerrado
  const sec = document.getElementById('sec-datos-cliente-' + prefix);
  if (sec && !sec.open) sec.open = true;
  // Cerrar dropdown
  const drop = document.getElementById('_ac-global-drop');
  if (drop) drop.style.display = 'none';
  // Aviso de cliente encontrado
  const aviso = document.getElementById(prefix + '-cliente-encontrado');
  const nombre = [c.nombre, c.apellido].filter(Boolean).join(' ');
  if (aviso) aviso.textContent = `✓ ${nombre}${c.totalCompras ? ' — ' + c.totalCompras + ' compra(s) anterior(es)' : ''}`;
}
window['_acCliente'] = _acCliente;
window['_acSelect']  = _acSelect;

// Cerrar dropdown al hacer clic fuera
document.addEventListener('click', e => {

function autocompletarCliente(prefix) {
  const celEl = document.getElementById(prefix + '-celular');
  const telEl = document.getElementById(prefix + '-telfijo');
  const cel = celEl ? celEl.value.trim() : '';
  const tel = telEl ? telEl.value.trim() : '';
  if (!cel && !tel) return;
  const c = buscarClientePorContacto(cel, tel, '');
  const avisoId = prefix + '-cliente-encontrado';
  let aviso = document.getElementById(avisoId);
  if (!c) { if (aviso) aviso.textContent = ''; return; }
  const setIfVacio = (campo, val) => {
    const el = document.getElementById(prefix + '-' + campo);
    if (el && !el.value.trim() && val) el.value = val;
  };
  setIfVacio('nombre', c.nombre); setIfVacio('apellido', c.apellido);
  setIfVacio('ciudad', c.ciudad); setIfVacio('estado', c.estado);
  setIfVacio('empresa', c.empresa);
  setIfVacio('direccion', c.direccion); setIfVacio('colonia', c.colonia); setIfVacio('cp', c.cp); setIfVacio('rfc', c.rfc);
  // No autocompletar correos propios de la empresa (evita propagar emails incorrectos)
  const _correoCliente = (c.correo||'').trim();
  if (_correoCliente && !_correoCliente.toLowerCase().includes('camperslacuesta')) {
    setIfVacio('correo', _correoCliente);
  }
  setIfVacio('telfijo', c.telfijo); setIfVacio('celular', c.celular);
  if (aviso) aviso.textContent = `✓ Cliente ya registrado: ${[c.nombre, c.apellido].filter(Boolean).join(' ')} — ${c.totalCompras} compra(s) anterior(es)`;
}

// Muestra en un modal todas las compras (ventas/pedidos) y cotizaciones de un
// cliente, junto con la nota/descripción de lo que pidió en cada una.
function verComprasCliente(id) {
  const c = findById(db.clientes, id);
  if (!c) { _info('Cliente no encontrado.'); return; }
  const cel = _limpiarTel(c.celular), tel = _limpiarTel(c.telfijo);
  const mail = (c.correo||'').trim().toLowerCase();
  const coincide = (vCel, vTel, vMail) => {
    const cv = _limpiarTel(vCel), tv = _limpiarTel(vTel), mv = (vMail||'').trim().toLowerCase();
    return (cel && cel.length>=8 && cv===cel) || (tel && tel.length>=8 && tv===tel) || (mail && mv===mail);
  };
  const ventas = (db.ventas||[]).filter(vt => coincide(vt.ctCelular||vt.celular, vt.ctTelFijo||vt.telefono, vt.ctCorreo||vt.correo));
  const cotiz = (db.cotizaciones||[]).filter(cz => coincide(cz.ctCelular, cz.ctTelFijo, cz.ctCorreo));
  const notaDe = (it) => {
    if (it.observaciones) return it.observaciones.replace(/\n/g,'<br>');

function abrirEnvioMasivo() {

    <div style="background:#f0f9ff;border-radius:8px;padding:10px 12px;font-size:0.78rem;color:#0369a1;margin-bottom:14px">
      ⚠️ Por restricciones de WhatsApp, no existe un botón que mande todo de un solo clic gratis: la app abrirá <strong>${conCelular}</strong> pestañas de WhatsApp Web, una por cliente, con el mensaje ya escrito — solo te falta dar clic en "Enviar" en cada una. Permite las ventanas emergentes (pop-ups) en tu navegador para que abran todas.
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="enviarWhatsAppMasivo()">💬 Abrir WhatsApp (${conCelular})</button>
      <button class="btn btn-outline" onclick="enviarCorreoMasivo()">✉️ Enviar por correo (${seleccionados.filter(c=>c.correo).length})</button>
    </div>
    <div id="envio-masivo-progreso" style="font-size:0.78rem;color:#64748b;margin-top:10px"></div>
  `);
  // Guardamos la selección para usarla cuando se den los clics de envío.
  window._envioMasivoClientes = seleccionados;
}
function _aplicarPlantilla(msg, cliente) {
  return msg.replace(/\{nombre\}/gi, cliente.nombre || 'cliente');
}
function enviarWhatsAppMasivo() {
  const msg = document.getElementById('envio-masivo-msg').value.trim();
  if (!msg) { _info('Escribe un mensaje primero.'); return; }
  const clientes = (window._envioMasivoClientes||[]).filter(c => c.celular || c.telfijo);
  if (!clientes.length) { _info('Ninguno de los seleccionados tiene teléfono registrado.'); return; }
  const progreso = document.getElementById('envio-masivo-progreso');
  let i = 0;
  function abrirSiguiente() {
    if (i >= clientes.length) { if (progreso) progreso.textContent = `✓ Listo: se abrieron ${clientes.length} chats.`; return; }
    const c = clientes[i];
    const tel = _limpiarTel(c.celular || c.telfijo);
    const telConLada = tel.length === 10 ? '52' + tel : tel; // México: antepone lada si parece número local de 10 dígitos
    const texto = encodeURIComponent(_aplicarPlantilla(msg, c));
    window.open(`https://wa.me/${telConLada}?text=${texto}`, '_blank');
    i++;
    if (progreso) progreso.textContent = `Abriendo chat ${i} de ${clientes.length}...`;
    setTimeout(abrirSiguiente, 1000); // separa cada apertura para reducir bloqueo de pop-ups
  }
  abrirSiguiente();
}
async function enviarCorreoMasivo() {
  const asunto = document.getElementById('envio-masivo-asunto')?.value.trim();
  const msg = document.getElementById('envio-masivo-msg')?.value.trim();
  if (!asunto) { _info('Escribe el asunto del correo.'); return; }
  if (!msg) { _info('Escribe un mensaje primero.'); return; }
  const clientes = (window._envioMasivoClientes||[]).filter(c => c.correo);
  if (!clientes.length) { _info('Ninguno de los seleccionados tiene correo registrado.'); return; }
  if (!functions) { _info('No se pudo conectar con el servidor de funciones.'); return; }
  const progreso = document.getElementById('envio-masivo-progreso');
  if (progreso) progreso.textContent = `Enviando ${clientes.length} correo(s)...`;
  try {
    const call = functions.httpsCallable('enviarCorreoMasivo');
    const { data } = await call({
      destinatarios: clientes.map(c => ({ correo: c.correo, nombre: c.nombre })),
      asunto, mensaje: msg
    });
    let texto = `✓ Enviados: ${data.enviados}`;
    if (data.omitidos) texto += ` · Omitidos por límite diario: ${data.omitidos}`;
    if (data.errores && data.errores.length) texto += ` · Con error: ${data.errores.length}`;
    if (data.motivo) texto = '⚠️ ' + data.motivo;
    if (progreso) progreso.textContent = texto;
  } catch (e) {
    if (progreso) progreso.textContent = '';
    _info('No se pudieron enviar los correos: ' + e.message);
  }
}

let _tempFotosCz = [];
let _fotoSessionCz = 0;
let _fotosSubiendoCz = 0;

function handleFotoUploadCz(event) {
  const files = [...event.target.files];
  event.target.value = '';
  const token = _fotoSessionCz;
  files.forEach(file => {
    comprimirImagen(file, dataUrl => {
      if (_fotoSessionCz !== token) return;
      _fotosSubiendoCz++; renderFotosPreviewCz();
      subirFotoAStorage(dataUrl, 'cotizaciones', url => {
        if (_fotoSessionCz !== token) return;
        _fotosSubiendoCz--; _tempFotosCz.push(url); renderFotosPreviewCz();
      });
    });
  });
}
function handleFotoDropCz(event) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const files = Array.from(event.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  const token = _fotoSessionCz;
  files.forEach(file => {
    comprimirImagen(file, dataUrl => {
      if (_fotoSessionCz !== token) return;
      _fotosSubiendoCz++; renderFotosPreviewCz();
      subirFotoAStorage(dataUrl, 'cotizaciones', url => {
        if (_fotoSessionCz !== token) return;
        _fotosSubiendoCz--; _tempFotosCz.push(url); renderFotosPreviewCz();
      });
    });
  });
}
function renderFotosPreviewCz() {
  const cont = document.getElementById('fotos-preview-cz');
  if (!cont) return;
  cont.innerHTML = _tempFotosCz.map((src, idx) => `
    <div class="foto-prev-wrap">
      <img src="${src}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer" onclick="openLightboxSrc('${src}')" />
      <button class="foto-prev-del" onclick="_tempFotosCz.splice(${idx},1);renderFotosPreviewCz()">✕</button>
    </div>`).join('') + (_fotosSubiendoCz > 0 ? `<div style="display:flex;align-items:center;color:#64748b;font-size:0.78rem;padding:8px">⏳ Subiendo ${_fotosSubiendoCz} foto(s)...</div>` : '');
}
