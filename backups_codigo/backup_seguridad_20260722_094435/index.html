function _emMostrarFoto(url) {
  const cont = document.getElementById('em-foto-preview');
  const img = document.getElementById('em-foto-img');
  if (!cont || !img) return;
  if (url) { img.src = url; cont.style.display = 'block'; }
  else { img.src = ''; cont.style.display = 'none'; }
}

function _emAutoFill() {
  const codigo = (document.getElementById('em-material')?.value||'').trim();
  const info = document.getElementById('em-stock-info');
  if (!codigo) { if (info) info.innerHTML = '&nbsp;'; _emMostrarFoto(null); return; }
  const item = (db.materia||[]).find(i =>
    (i.barcode && i.barcode.trim().toLowerCase() === codigo.toLowerCase()) ||
    (i.codigo && i.codigo.trim().toLowerCase() === codigo.toLowerCase()) ||
    (i.nombre && i.nombre.trim().toLowerCase() === codigo.toLowerCase()));
  if (item) {
    document.getElementById('em-material').value = item.nombre;
    if (!document.getElementById('em-unidad').value) document.getElementById('em-unidad').value = item.unidad || '';
    if (info) info.innerHTML = `📦 En inventario: <strong>${item.cantidad} ${esc(item.unidad||'')}</strong> disponibles`;
    _emMostrarFoto(item.fotos && item.fotos[0] ? item.fotos[0] : null);
    return;
  }
  const matCat = (db.catalogoMateriales||[]).find(m => (m.nombre||'').toLowerCase() === codigo.toLowerCase());
  if (matCat) {
    if (!document.getElementById('em-unidad').value) document.getElementById('em-unidad').value = matCat.unidad || '';
    if (info) info.innerHTML = '&nbsp;';
    _emMostrarFoto(matCat.foto || null);
  } else {
    if (info) info.innerHTML = '&nbsp;';
    _emMostrarFoto(null);
  }
}

function _emHideSugs() {
  const d = document.getElementById('em-sugs-float');
  if (d) d.remove();
  if (window._emDocListener) {
    document.removeEventListener('mousedown', window._emDocListener);
    window._emDocListener = null;
  }
}

function _emShowSugs(query) {
  _emHideSugs();
  const inp = document.getElementById('em-material');
  if (!inp) return;
  const q = (query||'').trim().toLowerCase();
  if (!q) return;
  const matMap = new Map((db.materia||[]).map(m => [m.nombre.toLowerCase(), m]));
  const cat = [
    ...(db.materia||[]).map(m => ({ nombre: m.nombre, foto: m.fotos&&m.fotos[0]?m.fotos[0]:null, stock: m.cantidad, unidad: m.unidad })),
    ...(db.catalogoMateriales||[])
        .filter(m => !matMap.has((m.nombre||'').toLowerCase()))
        .map(m => ({ nombre: m.nombre, foto: m.foto||null, stock: null, unidad: m.unidad }))
  ];
  const matches = cat.filter(m => (m.nombre||'').toLowerCase().includes(q)).slice(0, 12);
  if (!matches.length) return;
  window._emSugItems = matches;
  const rect = inp.getBoundingClientRect();
  const d = document.createElement('div');
  d.id = 'em-sugs-float';
  d.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.bottom+2}px;width:${rect.width}px;z-index:99999;background:#fff;border:1.5px solid #cbd5e1;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.15);max-height:260px;overflow-y:auto`;
  d.innerHTML = matches.map((m, idx) => {
    const imgHtml = m.foto
      ? `<img src="${esc(m.foto)}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;flex-shrink:0;border:1px solid #e2e8f0" />`
      : `<div style="width:40px;height:40px;border-radius:6px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.2rem">\u{1f4e6}</div>`;
    const stockHtml = m.stock != null ? `<span style="font-size:0.72rem;color:#64748b">${m.stock} ${esc(m.unidad||'')}</span>` : '';
    return `<div onclick="_emPickSugIdx(${idx})"
      style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9"
      onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''">
      ${imgHtml}
      <div style="min-width:0;flex:1;overflow:hidden">
        <div style="font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.nombre)}</div>
        ${stockHtml}
      </div>
    </div>`;
  }).join('');
  document.body.appendChild(d);
  window._emDocListener = function(e) {
    if (!d.contains(e.target) && e.target !== inp) _emHideSugs();
  };
  setTimeout(() => document.addEventListener('mousedown', window._emDocListener), 0);
}

function _emPickSug(nombre) {
  const inp = document.getElementById('em-material');
  if (inp) { inp.value = nombre; inp.focus(); _emAutoFill(); }
  _emHideSugs();
}
function _emPickSugIdx(idx) {
  const m = (window._emSugItems || [])[idx];
  if (m) _emPickSug(m.nombre);
}
window['_emPickSug'] = _emPickSug;
window['_emPickSugIdx'] = _emPickSugIdx;
window['_emHideSugs'] = _emHideSugs;

function _emBuscarItemMateria(nombre) {
  return (db.materia||[]).find(i =>
    (i.barcode && i.barcode.trim().toLowerCase() === nombre.toLowerCase()) ||
    (i.codigo && i.codigo.trim().toLowerCase() === nombre.toLowerCase()) ||
    (i.nombre && i.nombre.trim().toLowerCase() === nombre.toLowerCase()));
}

function _emAgregarALista() {
  const nombre = document.getElementById('em-material').value.trim();
  if (!nombre) { _info('Escribe o escanea el material.'); return; }
  const cantidad = parseFloat(document.getElementById('em-cant').value) || 0;
  if (!cantidad) { _info('Indica la cantidad.'); return; }
  const unidad = document.getElementById('em-unidad').value.trim();

  const item = _emBuscarItemMateria(nombre);
  if (item) {
    const yaEnLista = _emItems.filter(x => x.nombre.toLowerCase() === item.nombre.toLowerCase()).reduce((s,x)=>s+x.cantidad,0);
    const disponible = (item.cantidad||0) - yaEnLista;
    if (disponible < cantidad && !confirm(`El inventario de Materia Prima solo tiene ${disponible} ${item.unidad||''} disponibles de "${item.nombre}" (considerando lo ya agregado a esta lista). ¿Agregar de todos modos?`)) return;
  }

  _emItems.push({ nombre: item ? item.nombre : nombre, cantidad, unidad: unidad || (item ? item.unidad : '') });

  // Si es un material manual que no existe en inventario ni en el catálogo, lo guardamos
  // en el catálogo para que la próxima vez aparezca sugerido.
  if (!item) {
    const enCatalogo = (db.catalogoMateriales||[]).some(m => (m.nombre||'').toLowerCase() === nombre.toLowerCase());
    if (!enCatalogo) {
      if (!db.catalogoMateriales) db.catalogoMateriales = [];
      db.catalogoMateriales.push({ id: sid(), nombre, unidad: unidad || '', costoUnit: 0, precioPublico: 0, cantidad: 0, foto: '' });
      saveDb('catalogoMateriales');
    }
  }

  document.getElementById('em-material').value = '';
  document.getElementById('em-cant').value = '';
  document.getElementById('em-unidad').value = '';
  const info = document.getElementById('em-stock-info');
  if (info) info.innerHTML = '&nbsp;';
  _emRenderLista();
  document.getElementById('em-material').focus();
}

function _emQuitarDeLista(idx) {
  _emItems.splice(idx, 1);
  _emRenderLista();
}

function _emRenderLista() {
  const cont = document.getElementById('em-items-list');
  if (!cont) return;
  cont.innerHTML = _emItems.length ? `
    <div style="font-size:0.85rem;font-weight:600;margin-bottom:6px">Materiales en la lista (${_emItems.length}):</div>
    <table style="width:100%;font-size:0.85rem;border-collapse:collapse">
      <tr style="background:var(--bg)"><th style="padding:6px;text-align:left">Material</th><th>Cant.</th><th>Unidad</th><th></th></tr>
      ${_emItems.map((it,idx)=>`<tr style="border-top:1px solid var(--border)">
        <td style="padding:6px">${esc(it.nombre)}</td>
        <td style="text-align:center">${it.cantidad}</td>
        <td style="text-align:center">${esc(it.unidad||'-')}</td>
        <td><button type="button" onclick="_emQuitarDeLista(${idx})" style="background:none;border:none;cursor:pointer;color:var(--danger)">✕</button></td>
      </tr>`).join('')}
    </table>
  ` : '<p style="font-size:0.8rem;color:#94a3b8">Sin materiales agregados todavía. Agrega uno o más arriba.</p>';
}

function _guardarEntregaMaterial() {
  if (!can(ROLES_PRODUCCION)) return;
  const ventaId = document.getElementById('em-pedido').value;
  if (!ventaId) { _info('Selecciona el número de pedido.'); return; }

  // Si quedó un material escrito sin agregar a la lista, se incluye también
  const nombreSuelto = document.getElementById('em-material').value.trim();
  if (nombreSuelto) {
    const cantidadSuelto = parseFloat(document.getElementById('em-cant').value) || 0;
    if (cantidadSuelto) {
      _emItems.push({ nombre: nombreSuelto, cantidad: cantidadSuelto, unidad: document.getElementById('em-unidad').value.trim() });
    }
  }
  if (!_emItems.length) { _info('Agrega al menos un material a la lista.'); return; }

  if (!db.produccion) db.produccion = [];
  let prod = db.produccion.find(p => String(p.ventaId) === String(ventaId));
  if (!prod) {
    prod = { id:String(sid()), ventaId, fechaInicio: today(), horaInicio:'', fechaFin:'', horaFin:'', notas:'', estadoProd:'Pendiente', trabajadores:[], materiales:[], gastos:[] };
    db.produccion.push(prod);
  }
  if (!prod.materiales) prod.materiales = [];

  let tocoMateria = false;
  _emItems.forEach(({nombre, cantidad, unidad}) => {
    const item = _emBuscarItemMateria(nombre);
    let costoUnit = 0, nombreFinal = nombre;
    if (item) {
      nombreFinal = item.nombre;
      costoUnit = parseFloat(item.precio) || 0;
      item.cantidad = Math.max(0, (item.cantidad||0) - cantidad);
      tocoMateria = true;
    } else {
      const matCat = (db.catalogoMateriales||[]).find(m => (m.nombre||'').toLowerCase() === nombre.toLowerCase());
      if (matCat) costoUnit = parseFloat(matCat.costoUnit) || 0;
    }
    prod.materiales.push({
      nombre: nombreFinal,
      cantidad,
      unidad: unidad || (item ? item.unidad : ''),
      costoUnit,
      total: cantidad * costoUnit,
      entregadoPor: (session && session.nombre) || '',
      fecha: today()
    });
  });

  saveDb('produccion');
  if (tocoMateria) saveDb('materia');
  showToast(`✅ ${_emItems.length} material(es) entregado(s) al pedido`);
  renderProduccion();
  _emUltimoPedido = ventaId;
  _emItems = [];
  closeModal();
}

function verDetalleProduccion(prodId) {
  if (!can(ROLES_PRODUCCION)) return;
  const prod = (db.produccion||[]).find(p => p.id === prodId);
  if (!prod) return;
  const vt = (db.ventas||[]).find(v => String(v.id) === String(prod.ventaId)) || {};
  const isAdmin = session.rol === 'admin';

  function _render() {
    const trab  = prod.trabajadores||[];
    const mats  = prod.materiales||[];
    const gastos = prod.gastos||[];

    const totalHoras      = trab.reduce((s,t)=>s+(parseFloat(t.horasTotales)||0),0);
    const costoTrabajadores = trab.reduce((s,t)=>s+(parseFloat(t.horasTotales)||0)*(parseFloat(t.costoPorHora)||0),0);
    const costoMateriales   = mats.reduce((s,m)=>s+(parseFloat(m.total)||0),0);
    const costoGastos       = gastos.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
    const costoTotal        = costoTrabajadores + costoMateriales + costoGastos;

    // Verificar si algún trabajador le falta fecha/hora de terminación
    const trabSinFin = trab.filter(t=>!(t.fechaFin||t.fecha)||!t.horaFin);
    const puedeCalcular = trabSinFin.length === 0;

    const body = `
      <div style="margin-bottom:8px">
        <strong>Pedido:</strong> ${esc(vt.folioPedido||('#'+vt.id)||'-')} &nbsp;|&nbsp; <strong>Cliente:</strong> ${esc(vt.cliente||'-')}
      </div>
      <div style="margin-bottom:8px">
        <label>Estado: </label>
        <select id="prod-estado-sel" class="form-control" style="display:inline-block;width:auto;margin-left:8px" onchange="cambiarEstadoProduccion('${prodId}',this.value)">
          <option ${prod.estadoProd==='Pendiente'?'selected':''}>Pendiente</option>
          <option ${prod.estadoProd==='En proceso'?'selected':''}>En proceso</option>
          <option ${prod.estadoProd==='Terminado'?'selected':''}>Terminado</option>
        </select>
      </div>

      ${isAdmin ? `
      <hr style="margin:12px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>👷 Trabajadores</strong>
        <button class="btn btn-sm btn-primary" onclick="_addTrabajador('${prodId}')">+ Agregar</button>
      </div>
      ${trab.length ? `
      <div style="overflow-x:auto">
      <table class="table" style="width:100%;font-size:0.82rem;border-collapse:collapse;margin-bottom:12px">
        <thead><tr><th>Nombre</th><th>F.Inicio</th><th>H.Ini</th><th>F.Fin</th><th>H.Fin</th><th>T.Fuera</th><th>Horas</th><th>$/hr</th><th>Costo</th><th>Actividad</th><th></th></tr></thead>
        <tbody>
          ${trab.map((t,i)=>{
            const costo = (parseFloat(t.horasTotales)||0)*(parseFloat(t.costoPorHora)||0);
            const sinFin = !t.fechaFin||!t.horaFin;
            return `<tr style="${sinFin?'background:#fff7ed':''}">
              <td>${esc(t.nombre)}</td>
              <td style="font-size:0.75rem">${t.fechaInicio||t.fecha||'-'}</td>
              <td>${t.horaInicio||'-'}</td>

// Calcula horas netas descontando descansos del horario y tiempo fuera
// Calcula horas netas usando el horario real de la empresa
// Lun-Vie: 8:00-10:00, 10:30-14:00, 14:45-18:00
// Sábado:  8:00-10:00, 10:30-12:45
// Domingo: descanso
function _fmtHoras(h) {
  if (!h || isNaN(h)) return '--';
  const totalMin = Math.round(h * 60);
  const hrs = Math.floor(totalMin / 60);
  const min = totalMin % 60;
  return min > 0 ? hrs + 'h ' + min + 'min' : hrs + 'h';
}

function _calcHorasNetas(fechaIni, horaIni, fechaFin, horaFin2, tiempoFueraMin) {
  if (!fechaIni || !horaIni || !fechaFin || !horaFin2) return 0;
  try {
    const tsIni = new Date(fechaIni + 'T' + horaIni).getTime();
    const tsFin = new Date(fechaFin + 'T' + horaFin2).getTime();
    if (tsFin <= tsIni) return 0;

    // Turnos en minutos desde medianoche [inicio, fin]
    const turnosLV  = [[480,600],[630,840],[885,1080]]; // lun-vie
    const turnosSab = [[480,600],[630,765]];             // sábado (sale 12:45)
    // Domingo = []

    let minTotales = 0;
    let cur = new Date(tsIni);
    cur.setHours(0, 0, 0, 0);

    while (cur.getTime() < tsFin) {
      const diaSem = cur.getDay(); // 0=dom,6=sab
      const turnos = diaSem === 0 ? [] : diaSem === 6 ? turnosSab : turnosLV;

      for (const [tStart, tEnd] of turnos) {
        const turnIniTs = cur.getTime() + tStart * 60000;
        const turnFinTs = cur.getTime() + tEnd   * 60000;
        const winIni = Math.max(tsIni, turnIniTs);
        const winFin = Math.min(tsFin, turnFinTs);
        if (winFin > winIni) minTotales += (winFin - winIni) / 60000;
      }
      cur.setDate(cur.getDate() + 1);
    }

    minTotales -= (parseFloat(tiempoFueraMin) || 0);
    return Math.max(0, minTotales / 60);
  } catch(e) { return 0; }
}

function _recalcTrabForm() {
  const fIni  = document.getElementById('tr-fecha-ini')?.value;
  const hIni  = document.getElementById('tr-hora-ini')?.value;
  const fFin  = document.getElementById('tr-fecha-fin')?.value;
  const hFin  = document.getElementById('tr-hora-fin')?.value;
  const fuera = document.getElementById('tr-fuera')?.value;
  const h = _calcHorasNetas(fIni, hIni, fFin, hFin, fuera);
  const el = document.getElementById('tr-horas-calc');
  if (el) el.textContent = (fIni && hIni && fFin && hFin) ? _fmtHoras(h) : '--';
}

  return `
    <div class="form-group"><label>Nombre</label><input id="tr-nombre" class="form-control" value="${esc(d.nombre||'')}" placeholder="Nombre del trabajador" /></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

      <div class="form-group"><label>⏰ Hora de inicio</label><input id="tr-hora-ini" type="time" class="form-control" value="${esc(hIni)}" oninput="_recalcTrabForm()" onchange="_recalcTrabForm()" /></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="form-group"><label>🏁 Fecha de terminación</label><input id="tr-fecha-fin" type="date" class="form-control" value="${esc(fFin)}" oninput="_recalcTrabForm()" onchange="_recalcTrabForm()" /></div>
      <div class="form-group"><label>⏰ Hora de terminación</label><input id="tr-hora-fin" type="time" class="form-control" value="${esc(hFin)}" oninput="_recalcTrabForm()" onchange="_recalcTrabForm()" /></div>
    </div>
    <div class="form-group">
      <label>⏸ Tiempo fuera (minutos) <span style="font-size:0.78rem;color:#64748b">— salió y regresó</span></label>
      <input id="tr-fuera" type="number" min="0" class="form-control" value="${esc(d.tiempoFuera||'')}" placeholder="0" oninput="_recalcTrabForm()" />
    </div>
    <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px">
      <span style="font-size:0.85rem;color:#166534">⏱ Horas netas (descontando descansos + tiempo fuera):</span>
      <strong id="tr-horas-calc" style="font-size:1.1rem;color:#15803d">${d.horasTotales ? _fmtHoras(parseFloat(d.horasTotales)) : '--'}</strong>
    </div>
    <div class="form-group"><label>Actividad realizada</label><input id="tr-actividad" class="form-control" value="${esc(d.actividad||'')}" placeholder="Descripción de actividad" /></div>
    <div class="form-group"><label>💲 Costo por hora ($)</label><input id="tr-costo-hr" type="number" step="0.01" min="0" class="form-control" value="${esc(d.costoPorHora||'')}" placeholder="0.00" /></div>
    <p style="font-size:0.75rem;color:#94a3b8;margin-top:4px">Descansos automáticos por día: desayuno 10:00-10:30 · comida 14:00-14:45 (lun-vie)</p>
  `;
}

function _guardarTrabajador(prodId, idx) {
  if (session.rol !== 'admin') return;
  const prod = (db.produccion||[]).find(p => p.id === prodId);
  if (!prod) return;
  const nombre = document.getElementById('tr-nombre').value.trim();
  if (!nombre) { _info('Escribe el nombre del trabajador.'); return; }
  const fechaInicio = document.getElementById('tr-fecha-ini').value;
  const horaInicio  = document.getElementById('tr-hora-ini').value;
  const fechaFin    = document.getElementById('tr-fecha-fin').value;
  const horaFin     = document.getElementById('tr-hora-fin').value;
  const tiempoFuera = parseFloat(document.getElementById('tr-fuera').value)||0;
  const horas = _calcHorasNetas(fechaInicio, horaInicio, fechaFin, horaFin, tiempoFuera);
  const reg = {
    nombre,
    fechaInicio, horaInicio,
    fechaFin, horaFin,
    tiempoFuera: tiempoFuera || '',
    horasTotales: horas ? horas.toFixed(2) : '',
    actividad: document.getElementById('tr-actividad').value.trim(),
    costoPorHora: parseFloat(document.getElementById('tr-costo-hr').value)||0
  };
  if (!prod.trabajadores) prod.trabajadores = [];
  if (idx === undefined) prod.trabajadores.push(reg);
  else prod.trabajadores[idx] = reg;
  saveDb('produccion');
  showToast('✅ Trabajador guardado');
  renderProduccion();
  verDetalleProduccion(prodId);
}

function _autoFillMaterial() {
  const nombre = document.getElementById('mat-nombre').value.trim();
  const cat = db.catalogoMateriales || [];
  const match = cat.find(m => m.nombre.toLowerCase() === nombre.toLowerCase());
  if (match) {
    document.getElementById('mat-unidad').value = match.unidad || '';
    const costoEl = document.getElementById('mat-costo');
    if (costoEl && match.costoUnit) costoEl.value = parseFloat(match.costoUnit).toFixed(2);
    _calcTotalMat();
  }
}

function _calcTotalMat() {
  const cant = parseFloat(document.getElementById('mat-cant')?.value) || 0;
  // Si hay campo de costo manual, úsalo; si no, búscalo en catálogo
  const costoEl = document.getElementById('mat-costo');
  let costo = costoEl ? (parseFloat(costoEl.value) || 0) : 0;
  if (!costo) {
    const nombre = (document.getElementById('mat-nombre')?.value||'').trim().toLowerCase();
    const matCat = (db.catalogoMateriales||[]).find(m=>m.nombre.toLowerCase()===nombre);
    costo = matCat ? (parseFloat(matCat.costoUnit)||0) : 0;
    if (costoEl && costo) costoEl.value = costo.toFixed(2);
  }
  const total = cant * costo;
  const el = document.getElementById('mat-total');
  if (el) el.value = total > 0 ? '$' + total.toFixed(2) : '';
}

// ===================== CATÁLOGO DE MATERIALES =====================
function _loadSheetJS(cb) {
  if (window.XLSX) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.integrity = 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw';
  s.crossOrigin = 'anonymous';
  s.onload = cb;
  document.head.appendChild(s);
}

// Refleja los materiales del catálogo (importados de Excel o agregados manualmente)
// dentro del inventario real de Materia Prima (db.materia), para que aparezcan en la
// tabla principal. Si el material ya existe ahí (por nombre), solo actualiza precios
// y unidad, conservando su cantidad/código/fotos actuales; si no existe, lo crea.
function _sincronizarCatalogoAMateria(items, opts) {
  opts = opts || {};
  if (!db.materia) db.materia = [];
  const porNombre = new Map(db.materia.map(i => [(i.nombre||'').toLowerCase(), i]));
  let hayNuevos = false;
  (items||[]).forEach(m => {
    if (!m.nombre) return;
    const existente = porNombre.get(m.nombre.toLowerCase());
    if (existente) {
      if (!opts.soloFaltantes) {
        existente.precio = m.costoUnit || 0;
        existente.precioPublico = m.precioPublico || 0;
        if (!existente.unidad) existente.unidad = m.unidad || 'pza';
      }
    } else {
      const nuevo = {
        id: sid(),
        codigo: _generarCodigoUnicoQR('MP'),
        nombre: m.nombre,
        barcode: '',
        clienteNombre: '', clienteApellido: '', clienteEmpresa: '',
        categoria: 'Importado Excel',
        ubicacion: '',
        cantidad: m.cantidad || 0,
        unidad: m.unidad || 'pza',
        precio: m.costoUnit || 0,
        precioPublico: m.precioPublico || 0,
        minimo: 5,
        sinMinimo: true,
        desc: '',
        fotos: m.foto ? [m.foto] : []
      };
      db.materia.push(nuevo);
      porNombre.set(m.nombre.toLowerCase(), nuevo);
      hayNuevos = true;
    }
  });
  if (hayNuevos || !opts.soloFaltantes) saveDb('materia');
  return hayNuevos;
}
window['_sincronizarCatalogoAMateria'] = _sincronizarCatalogoAMateria;

function importarCatalogoMateriales() {
  if (!can(['admin'])) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      _loadSheetJS(() => {
        try {
          const wb = XLSX.read(ev.target.result, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
          if (!rows.length) { _info('El archivo está vacío o no tiene datos.'); return; }

          // Detectar columnas (insensible a mayúsculas)
          const firstRow = rows[0];
          const keys = Object.keys(firstRow);
          const findKey = (...candidates) => keys.find(k => candidates.some(c => k.toLowerCase().includes(c))) || '';
          const kNombre = findKey('material','nombre','descrip','producto','concepto');
          const kUnidad = findKey('unidad','unit','um','medida');
          const kCosto  = findKey('costo','precio costo','price','valor','cost');
          const kPub    = findKey('precio publico','precio público','pvp','precio venta','público','publico');

          if (!kNombre) { _info('No se encontró columna de nombre/material en el Excel.'); return; }

          // Parsear filas del Excel
          const filas = rows.map(r => ({
            nombre: String(r[kNombre]||'').trim(),
            unidad: String(r[kUnidad]||'').trim(),
            costoUnit: round2(parseFloat(String(r[kCosto]||'0').replace(/[^0-9.]/g,'')) || 0),
            precioPublico: kPub ? round2(parseFloat(String(r[kPub]||'0').replace(/[^0-9.]/g,'')) || 0) : 0
          })).filter(f => f.nombre);

          if (!filas.length) { _info('No se encontraron materiales válidos.'); return; }

          // Clasificar: existentes en inventario (actualizar precio) vs nuevos
          const porNombreMateria = new Map((db.materia||[]).map(i => [(i.nombre||'').toLowerCase(), i]));
          const aActualizar = filas.filter(f => porNombreMateria.has(f.nombre.toLowerCase()));
          const aNuevos     = filas.filter(f => !porNombreMateria.has(f.nombre.toLowerCase()));

          showModal('📂 Importar catálogo de precios', `
            <div style="display:flex;gap:12px;margin-bottom:12px">
              <div style="flex:1;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;text-align:center">
                <div style="font-size:1.5rem;font-weight:800;color:#16a34a">${aActualizar.length}</div>
                <div style="font-size:0.8rem;color:#15803d">precios a actualizar</div>
              </div>
              <div style="flex:1;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px;text-align:center">
                <div style="font-size:1.5rem;font-weight:800;color:#2563eb">${aNuevos.length}</div>
                <div style="font-size:0.8rem;color:#1d4ed8">productos nuevos</div>
              </div>
            </div>
            <p style="color:#64748b;font-size:0.82rem;margin-bottom:8px">Columnas detectadas: <strong>${esc(kNombre||'-')}</strong> | Costo: <strong>${esc(kCosto||'-')}</strong>${kPub?' | P. Público: <strong>'+esc(kPub)+'</strong>':''}</p>
            <div style="max-height:200px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px">
              <table style="width:100%;font-size:0.82rem;border-collapse:collapse">
                <thead style="background:#f8fafc;position:sticky;top:0"><tr>
                  <th style="padding:6px 8px">Material</th>
                  <th style="padding:6px 8px">Costo</th>
                  ${kPub?'<th style="padding:6px 8px">P. Público</th>':''}
                  <th style="padding:6px 8px">Acción</th>
                </tr></thead>
                <tbody>
                  ${filas.slice(0,50).map(f => {
                    const existe = porNombreMateria.has(f.nombre.toLowerCase());
                    return `<tr style="border-top:1px solid #f1f5f9">
                      <td style="padding:5px 8px">${esc(f.nombre)}</td>
                      <td style="padding:5px 8px">$${f.costoUnit.toFixed(2)}</td>
                      ${kPub?`<td style="padding:5px 8px">$${f.precioPublico.toFixed(2)}</td>`:''}
                      <td style="padding:5px 8px">
                        <span style="font-size:0.75rem;padding:1px 6px;border-radius:10px;font-weight:700;${existe?'background:#dcfce7;color:#15803d':'background:#dbeafe;color:#1d4ed8'}">
                          ${existe ? '✏️ precio' : '+ nuevo'}
                        </span>
                      </td>
                    </tr>`;
                  }).join('')}
                  ${filas.length>50?`<tr><td colspan="${kPub?4:3}" style="padding:6px 8px;color:#94a3b8;text-align:center">...y ${filas.length-50} más</td></tr>`:''}
                </tbody>
              </table>
            </div>
            <p style="font-size:0.8rem;color:#64748b;margin-top:8px">
              Los productos existentes <strong>solo actualizarán su precio</strong>. Stock, ubicación, código de barras y fotos no se tocan.
            </p>
          `, [
            { label:'✅ Importar', cls:'btn-primary', action:() => {
              let actualizados = 0, agregados = 0;

              // Actualizar precios de los existentes (solo precio, nada más)
              aActualizar.forEach(f => {
                const item = porNombreMateria.get(f.nombre.toLowerCase());
                if (!item) return;
                item.precio = f.costoUnit;
                if (kPub && f.precioPublico) item.precioPublico = f.precioPublico;
                actualizados++;
              });

              // Agregar los nuevos al inventario
              aNuevos.forEach(f => {
                const nuevo = {
                  id: sid(),
                  codigo: _generarCodigoUnicoQR('MP'),
                  nombre: f.nombre,
                  barcode: '',
                  clienteNombre: '', clienteApellido: '', clienteEmpresa: '',
                  categoria: 'Importado Excel',
                  ubicacion: '',
                  cantidad: 0,
                  unidad: f.unidad || 'pza',
                  precio: f.costoUnit,
                  precioPublico: f.precioPublico || 0,
                  minimo: 5,
                  sinMinimo: false,
                  desc: '',
                  fotos: []
                };
                db.materia.push(nuevo);
                agregados++;
              });

              saveDb('materia');

              // Sincronizar también el catálogo de referencia (por nombre, solo precios)
              if (!db.catalogoMateriales) db.catalogoMateriales = [];
              const catMap = new Map(db.catalogoMateriales.map(m => [(m.nombre||'').toLowerCase(), m]));
              filas.forEach(f => {
                const c = catMap.get(f.nombre.toLowerCase());
                if (c) {
                  c.costoUnit = f.costoUnit;
                  if (kPub) c.precioPublico = f.precioPublico;
                } else {
                  const nc = { id: sid(), nombre: f.nombre, unidad: f.unidad||'pza', costoUnit: f.costoUnit, precioPublico: f.precioPublico||0, cantidad: 0, foto: '' };
                  db.catalogoMateriales.push(nc);
                  catMap.set(f.nombre.toLowerCase(), nc);
                }
              });
              saveDb('catalogoMateriales');

              closeModal();
              renderInventario('materia');
              _info(`✅ Importación completada:\n• ${actualizados} precio${actualizados!==1?'s':''} actualizado${actualizados!==1?'s':''}\n• ${agregados} producto${agregados!==1?'s':''} nuevo${agregados!==1?'s':''} agregado${agregados!==1?'s':''}`);
            }},
            { label:'Cancelar', cls:'btn-secondary', action:closeModal }
          ]);
        } catch(err) {
          _info('Error al leer el archivo: ' + err.message);
        }
      });
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

    <div class="form-group"><label>Nombre</label><input id="cat-ed-nombre" value="${esc(m.nombre||'')}" /></div>

function numToLetras(n) {
  const uni=['','un','dos','tres','cuatro','cinco','seis','siete','ocho','nueve',
    'diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve'];
  const dec=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const cen=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  function grupo(num) {
    if (num === 0) return '';
    if (num === 100) return 'cien';
    let r = '';
    const c = Math.floor(num/100), d = Math.floor((num%100)/10), u = num%10;
    if (c) r += cen[c] + ' ';
    const du = (d*10)+u;
    if (du < 20 && du > 0) { r += uni[du]; }
    else {
      if (d) r += dec[d] + (u ? ' y ' + uni[u] : '');
      else if (u) r += uni[u];
    }
    return r.trim();
  }
  n = Math.round(Math.abs(n));
  if (n === 0) return 'CERO PESOS M.N.';
  const mill = Math.floor(n/1000000), miles = Math.floor((n%1000000)/1000), cientos = n%1000;
  let res = '';
  if (mill) res += (mill===1?'un millón':grupo(mill)+' millones') + ' ';
  if (miles) res += (miles===1?'mil':grupo(miles)+' mil') + ' ';
  if (cientos) res += grupo(cientos);
  return res.trim().toUpperCase() + ' PESOS M.N.';
}
function fmt(n) { return Number(n).toLocaleString('es-MX', { minimumFractionDigits:0, maximumFractionDigits:2 }); }
// Inserta salto de línea automático al escribir ". " (punto + espacio),
// excepto cuando el punto está entre dígitos (p.ej. $1,500.00 o 3.5 kg).
function autoSaltoPunto(el) {
  const pos = el.selectionStart;
  const txt = el.value;
  // Busca ". " recién escrito (el cursor justo después del espacio)
  if (pos >= 2 && txt[pos-1] === ' ' && txt[pos-2] === '.') {
    const antes = txt[pos-3] || '';
    // No reemplazar si el punto va entre dígitos (decimal/precio)
    if (/\d/.test(antes)) return;
    el.value = txt.slice(0, pos-1) + '\n' + txt.slice(pos);
    el.selectionStart = el.selectionEnd = pos; // mantener cursor
  }
}
// Redondea a 2 decimales evitando errores de punto flotante (ej. 173.77499999999998 -> 173.77... -> 173.78)
function round2(n) { return Math.round((Number(n)||0) * 100) / 100; }
function today() { return new Date().toISOString().split('T')[0]; }
// Convierte 'YYYY-MM-DD' (u 'YYYY-MM-DDTHH:mm...') a '20 de junio de 2026'
function fechaLarga(iso) {
  if (!iso) return '-';
  const soloFecha = String(iso).substring(0,10);
  const m = soloFecha.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return soloFecha;
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const dia = parseInt(m[3],10);
  const mes = meses[parseInt(m[2],10)-1] || '';
  const anio = m[1];
  return `${dia} de ${mes} de ${anio}`;
}
// Versión corta para tablas: "14 Jul 26"
function fechaCorta(iso) {
  if (!iso) return '-';
  const soloFecha = String(iso).substring(0,10);
  const m = soloFecha.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return soloFecha;
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const dia = parseInt(m[3],10);
  const mes = meses[parseInt(m[2],10)-1] || '';
  const anio = m[1].substring(2);
  return `${dia} ${mes} '${anio}`;
}

// Devuelve ['Unidad: X', 'Tipo: Y', 'Forro: Z', 'Color: W'] omitiendo vacíos/'No aplica',
// para que las especificaciones siempre se muestren completas (con su etiqueta) y no solo el valor.
function specsLabeled(o) {
  if (!o) return [];
  const pares = [['Unidad', o.unidad], ['Tipo', o.tipo], ['Forro', o.forro], ['Color', o.color]];
  return pares.filter(([_, v]) => v && v !== 'No aplica').map(([l, v]) => l + ': ' + v);
}

function toggleVerPass(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  // Estos campos usan type="text" + -webkit-text-security (en vez de type="password") para
  // evitar que Chrome los reconozca como campo de contraseña y autorrellene una credencial
  // guardada (a veces obsoleta) sin que el administrador la haya escrito. Por eso el botón
  // de mostrar/ocultar alterna el enmascarado visual en lugar del atributo "type".
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; return; }
  const oculto = inp.style.webkitTextSecurity !== 'none';
  inp.style.webkitTextSecurity = oculto ? 'none' : 'disc';
  inp.style.textSecurity = oculto ? 'none' : 'disc';
  btn.textContent = oculto ? '🙈' : '👁️';
}

const _filterTableTimers = {};
const _filterTablePrev = {};
// Normaliza texto: quita acentos, comas, puntos y caracteres especiales para búsqueda
function _normSearch(str) {
  return (str || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '') // quitar acentos
    .replace(/[,.\-_'"()¿?¡!#/\\]/g, ' ')            // convertir puntuación en espacio
    .replace(/\s+/g, ' ')                              // colapsar espacios
    .trim();
}

function filterTable(input, tableId) {
  const valor = input.value;
  if (_filterTablePrev[tableId] === valor) return;
  _filterTablePrev[tableId] = valor;
  clearTimeout(_filterTableTimers[tableId]);
  _filterTableTimers[tableId] = setTimeout(() => {
    // Normalizar la búsqueda y dividir en palabras (cada palabra debe aparecer)
    const words = _normSearch(valor).split(' ').filter(Boolean);
    const tabla = document.getElementById(tableId);
    if (!tabla) return;
    const wrap = tabla.closest('.table-wrap') || tabla.parentElement;
    const alturaActual = wrap ? wrap.offsetHeight : 0;
    if (wrap && alturaActual > 0) wrap.style.minHeight = alturaActual + 'px';
    const filas = tabla.querySelectorAll('tr[data-search]');
    filas.forEach(row => {
      const haystack = _normSearch(row.dataset.search);
      const visible = words.length === 0 || words.every(w => haystack.includes(w));
      row.style.display = visible ? '' : 'none';
    });
    if (document.activeElement !== input && input) input.focus();
  }, 200);
}

function filtrarCategoria(cat, tablaId) {
  const tabla = document.getElementById(tablaId);
  if (!tabla) return;
  tabla.querySelectorAll('tr[data-cat]').forEach(tr => {
    if (!cat) { tr.style.display = ''; return; }
    tr.style.display = tr.getAttribute('data-cat') === cat.toLowerCase() ? '' : 'none';

}

const PG_SIZE = 50;
window._pgState = window._pgState || {};

function _pg(key, arr) {
  const page = window._pgState[key] || 0;
  const maxPage = Math.max(0, Math.ceil(arr.length / PG_SIZE) - 1);
  window._pgState[key] = Math.min(page, maxPage);
  return arr.slice(window._pgState[key] * PG_SIZE, (window._pgState[key] + 1) * PG_SIZE);
}

function _pgHTML(key, total, renderFn) {
  if (total <= PG_SIZE) return '';
  const page = window._pgState[key] || 0;
  const totalPages = Math.ceil(total / PG_SIZE);
  const start = page * PG_SIZE + 1;
  const end = Math.min((page + 1) * PG_SIZE, total);
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);font-size:0.84rem;color:var(--text-light)">
    <span>${start}\u2013${end} de ${total} registros</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-sm" style="padding:4px 12px" ${page===0?'disabled':''} onclick="window._pgState['${key}']=${page-1};${renderFn}()">&#8249; Ant</button>
      <span style="padding:0 6px">${page+1}&nbsp;/&nbsp;${totalPages}</span>
      <button class="btn btn-sm" style="padding:4px 12px" ${page>=totalPages-1?'disabled':''} onclick="window._pgState['${key}']=${page+1};${renderFn}()">Sig &#8250;</button>
    </div>
  </div>`;
}

let _rbScanTimer = null;

  buscarPorBarcode(codigo);

function rbIniciarGlobalScanner() {
  _rbScanBuffer = '';
  _rbScanActive = true;
  document.addEventListener('keydown', _rbGlobalKeyHandler);
}

function rbDetenerGlobalScanner() {
  _rbScanActive = false;
  document.removeEventListener('keydown', _rbGlobalKeyHandler);
  _rbScanBuffer = '';
  if (_rbScanTimer) { clearTimeout(_rbScanTimer); _rbScanTimer = null; }
}

function _rbGlobalKeyHandler(e) {
  if (!_rbScanActive) return;
  // Si el foco está en rb-codigo (escritura manual), no interferir
  if (document.activeElement && document.activeElement.id === 'rb-codigo') return;

  if (e.key === 'Enter') {
    if (_rbScanBuffer.length >= 3) {
      rbScannerRecibido(_rbScanBuffer);
    }
    _rbScanBuffer = '';
    if (_rbScanTimer) { clearTimeout(_rbScanTimer); _rbScanTimer = null; }
    e.preventDefault();
    return;
  }
  // Acumular caracteres imprimibles
  if (e.key.length === 1) {
    _rbScanBuffer += e.key;
    // Auto-disparar si el buffer parece completo (escáner sin Enter)
    if (_rbScanTimer) clearTimeout(_rbScanTimer);
    _rbScanTimer = setTimeout(() => {
      if (_rbScanBuffer.length >= 3) rbScannerRecibido(_rbScanBuffer);
      _rbScanBuffer = '';
    }, 120);
  }
}

// ===================== GENERADOR DE CÓDIGO DE BARRAS =====================
function generarBarcode(inputId, canvasId, modo) {
  inputId = inputId || 'c-barcode';
  canvasId = canvasId || 'barcode-preview';
  // Genera un código EAN-13 válido con prefijo 200 (uso interno)
  const base = '200' + String(Date.now()).slice(-9);
  const codigo = base.slice(0, 12) + calcEAN13(base.slice(0, 12));
  const inp = document.getElementById(inputId);
  if (inp) inp.value = codigo;
  dibujarBarcode(codigo, canvasId, modo);
}

function calcEAN13(doce) {
  let s = 0;
  for (let i = 0; i < 12; i++) s += parseInt(doce[i]) * (i % 2 === 0 ? 1 : 3);
  return String((10 - (s % 10)) % 10);
}

// Carga (una sola vez) la librería QRCode.js usada para generar códigos QR
// (consignación) realmente escaneables por la cámara de cualquier celular.
function _cargarLibQR(callback) {
  if (typeof QRCode !== 'undefined') { callback(); return; }
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  script.integrity = 'sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU';
  script.crossOrigin = 'anonymous';
  script.onload = callback;
  script.onerror = () => _info('No se pudo cargar el generador de códigos QR. Revisa tu conexión a internet.');
  document.head.appendChild(script);
}

// Carga (una sola vez) la librería JsBarcode usada para generar códigos de
// BARRAS reales (Code128 / EAN-13), legibles con la cámara de cualquier celular
// o lector de códigos de barras común — usado en Materia Prima.
function _cargarLibJsBarcode(callback) {
  if (typeof JsBarcode !== 'undefined') { callback(); return; }
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js';
  script.integrity = 'sha384-Kk5SjBOKprEnGfyBWfD2zROFd1Cu8kwOXxG2GIhYPcoDL2rBJS9P8Ud1ZMy4412a';
  script.crossOrigin = 'anonymous';
  script.onload = callback;
  script.onerror = () => _info('No se pudo cargar el generador de código de barras. Revisa tu conexión a internet.');
  document.head.appendChild(script);
}

// Dibuja el código dentro del contenedor indicado.
//  - modo 'barras' (Materia Prima): genera un CÓDIGO DE BARRAS real (EAN-13/UPC/Code128)
//    legible con la cámara de cualquier celular o lector de código de barras.
//  - modo por defecto / 'qr' (Consignación): genera un código QR real.
function dibujarBarcode(codigo, contId, modo) {
  const cont = document.getElementById(contId || 'barcode-preview');
  if (!cont || !codigo) return;
  const texto = String(codigo).trim();
  if (modo === 'barras') {
    _cargarLibJsBarcode(() => {
      cont.innerHTML = '';
      cont.style.display = 'flex';
      cont.style.justifyContent = 'center';
      const canvas = document.createElement('canvas');
      cont.appendChild(canvas);
      // Si son 13 dígitos válidos como EAN-13 (o 12 como UPC) usamos ese formato
      // estándar de retail; si no, Code128 — que acepta cualquier texto/número.
      const formatosAIntentar = /^\d{13}$/.test(texto) ? ['EAN13','CODE128']
                              : /^\d{12}$/.test(texto) ? ['UPC','CODE128']
                              : ['CODE128'];
      let dibujado = false;
      for (const fmt of formatosAIntentar) {
        try {
          JsBarcode(canvas, texto, { format: fmt, width: 2, height: 70, displayValue: true, fontSize: 14, margin: 8 });
          dibujado = true;
          break;
        } catch (e) { /* probar el siguiente formato */ }
      }
      if (!dibujado) cont.innerHTML = '<p style="color:#ef4444;font-size:0.8rem;text-align:center">No se pudo generar el código de barras con ese texto.</p>';
    });
  } else {
    _cargarLibQR(() => {
      cont.innerHTML = '';
      cont.style.display = 'flex';
      const urlQR = `https://sistemas.camperslacuesta.com/?codigo=${encodeURIComponent(texto)}`;
      new QRCode(cont, { text: urlQR, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
    });
  }
}

// ===================== ESCÁNER DE CÓDIGOS CON CÁMARA DEL CELULAR =====================
// Lee tanto códigos de barras (EAN-13, Code128, etc.) como códigos QR usando la
// cámara del dispositivo — funciona con cualquier celular o tablet con cámara.
function _cargarLibZXing(callback) {
  if (typeof ZXing !== 'undefined') { callback(); return; }
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
  script.integrity = 'sha384-DOP3OlIzNeWpufSZMxZihUYSqCAZFirsVmSAVg8ItvU9ac1FcQF6ZHjQ9CbCznNS';
  script.crossOrigin = 'anonymous';
  script.onload = callback;
  script.onerror = () => _info('No se pudo cargar el lector de códigos por cámara. Revisa tu conexión a internet.');
  document.head.appendChild(script);
}

let _zxingReader = null;
let _camScanStream = null;
let _camScanInterval = null;
let _camScanTorchOn = false;
let _camScanTrack = null;

// Lista de formatos de código de barras 1D + QR que tratamos de leer.
function _formatosEscaner() {
  return ['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','codabar','itf','data_matrix','pdf417','aztec'];
}
function _zxingHints() {
  const hints = new Map();
  if (window.ZXing && ZXing.DecodeHintType && ZXing.BarcodeFormat) {
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93, ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.CODABAR, ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.PDF_417,
      ZXing.BarcodeFormat.AZTEC
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  }
  return hints;
}

// Abre la cámara y, en cuanto detecta un código (de barras o QR), llama a onResult(texto).
// modo: 'barras' ajusta los textos de ayuda para códigos de barras 1D (Materia Prima).
// Combina DOS estrategias para maximizar la detección en cualquier celular:
//   1) Detección automática continua mientras se apunta la cámara (lector nativo del
//      celular si está disponible, o ZXing como respaldo).
//   2) Botón "Tomar foto y leer código": captura una imagen fija de alta resolución y
//      la analiza con todos los lectores disponibles — esto es MUCHO más confiable para
//      códigos de barras 1D que la lectura continua de video, sobre todo con poca luz
//      o cuando el celular no soporta el lector nativo.
function abrirEscanerCamara(onResult, modo) {
  const esBarras = modo === 'barras';
  // IMPORTANTE: usamos un overlay PROPIO (cam-scan-overlay) y NO el modal genérico
  // (showModal/closeModal). Así, si el escáner se abre desde dentro de otro formulario
  // (p. ej. "Agregar producto"), ese formulario permanece intacto debajo y no se pierde
  // al detectar el código.
  document.getElementById('cam-scan-title').textContent = '📷 Escanear código';
  document.getElementById('cam-scan-body').innerHTML = `
    <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:6px">
      ${esBarras ? 'Apunta la cámara al código de barras del producto.' : 'Apunta la cámara al código de barras o código QR del producto.'} Se detecta automáticamente, o toca "Tomar foto" para forzar la lectura.
    </p>
    <p style="font-size:0.78rem;color:#92400e;background:#fef9c3;border-radius:8px;padding:8px 10px;margin-bottom:10px">
      💡 Mantén el celular a unos 15-20 cm del código, busca buena luz, evita reflejos y mantén el código horizontal, derecho y dentro del recuadro. Si tu celular tiene linterna, actívala con el botón de abajo en lugares oscuros.
    </p>
    <div style="position:relative;width:100%;border-radius:10px;overflow:hidden;background:#000;max-height:320px">
      <video id="cam-scan-video" style="width:100%;display:block;max-height:320px;object-fit:cover" autoplay muted playsinline></video>
      <div id="cam-scan-line" style="position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#00ff41,transparent);box-shadow:0 0 8px #00ff41;animation:scanLine 1.8s linear infinite;top:0"></div>
      <div style="position:absolute;inset:0;border:2px solid rgba(0,255,65,0.4);border-radius:10px;pointer-events:none"></div>
    </div>
    <canvas id="cam-scan-canvas" style="display:none"></canvas>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button type="button" id="cam-scan-capture" class="btn btn-primary" style="flex:1;justify-content:center;padding:12px;font-size:0.95rem" disabled>📸 Tomar foto y leer código</button>
      <button type="button" id="cam-scan-torch" class="btn btn-outline" style="display:none;white-space:nowrap">🔦 Linterna</button>
    </div>
    <p id="cam-scan-status" style="font-size:0.8rem;color:#64748b;margin-top:8px;text-align:center">Iniciando cámara…</p>
  `;
  const footer = document.getElementById('cam-scan-footer');
  footer.innerHTML = '';
  const btnCancelar = document.createElement('button');
  btnCancelar.className = 'btn btn-secondary';
  btnCancelar.textContent = 'Cancelar';
  btnCancelar.onclick = () => { _cerrarEscanerCamara(); _cerrarOverlayEscaner(); };
  footer.appendChild(btnCancelar);
  document.getElementById('cam-scan-overlay').classList.add('open');
  setTimeout(() => _iniciarEscaneoCamara(onResult, modo), 150);
}

// Cierra SOLO el overlay del escáner (deja intacto cualquier modal/formulario debajo)
function _cerrarOverlayEscaner() {
  const ov = document.getElementById('cam-scan-overlay');
  if (ov) ov.classList.remove('open');
}
document.getElementById('cam-scan-overlay').addEventListener('click', function(e) {
  if (e.target === this) { _cerrarEscanerCamara(); _cerrarOverlayEscaner(); }
});

async function _iniciarEscaneoCamara(onResult, modo) {
  const video = document.getElementById('cam-scan-video');
  const status = document.getElementById('cam-scan-status');
  const btnCapturar = document.getElementById('cam-scan-capture');
  const btnTorch = document.getElementById('cam-scan-torch');
  if (!video) return;

  let resuelto = false;
  const marcarDetectado = (textoCrudo) => {
    const texto = String(textoCrudo || '').trim();
    if (resuelto || !texto) return;
    resuelto = true;
    if (status) status.textContent = '✅ Código detectado: ' + texto;
    _cerrarEscanerCamara();
    _cerrarOverlayEscaner();
    onResult(texto);
  };

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    if (resuelto) { stream.getTracks().forEach(t=>t.stop()); return; }
    _camScanStream = stream;
    video.srcObject = stream;
    try { await video.play(); } catch(e) {}

    // Forzar autoenfoque continuo (Samsung/Android Edge)
    const [track] = stream.getVideoTracks();
    _camScanTrack = track;
    (async () => {
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        // Intentar todos los modos posibles de autoenfoque continuo
        const modos = ['continuous', 'auto'];
        for (const m of modos) {
          if (caps.focusMode && caps.focusMode.includes(m)) {
            await track.applyConstraints({ advanced: [{ focusMode: m }] });
            break;
          }
        }
      } catch(e) {}
    })();

    // Botón de linterna, si el celular la soporta
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps && caps.torch && btnTorch) {
        btnTorch.style.display = 'inline-flex';
        btnTorch.onclick = async () => {
          _camScanTorchOn = !_camScanTorchOn;
          try { await track.applyConstraints({ advanced: [{ torch: _camScanTorchOn }] }); } catch(e) {}
          btnTorch.textContent = _camScanTorchOn ? '🔦 Apagar luz' : '🔦 Linterna';
        };
      }
    } catch(e) {}

    // Cargar ZXing en segundo plano para análisis de foto
    _cargarLibZXing(() => { try { _zxingReader = new ZXing.BrowserMultiFormatReader(_zxingHints()); } catch(e) {} });

    // Detección automática DESACTIVADA — el video borroso del navegador causa lecturas incorrectas.
    // Solo se lee cuando el usuario toma foto manualmente con la cámara nativa.
    if (status) status.textContent = '📷 Apunta al código y toca "📸 Tomar foto" para leerlo.';

    // Botón usa la cámara NATIVA del celular (abre la app de cámara que sí enfoca)
    if (btnCapturar) {
      btnCapturar.disabled = false;
      // Input oculto que abre la cámara nativa
      const fileIn = document.createElement('input');
      fileIn.type = 'file';
      fileIn.accept = 'image/*';
      fileIn.setAttribute('capture', 'environment');
      fileIn.style.cssText = 'position:absolute;opacity:0;pointer-events:none;width:1px;height:1px';
      document.body.appendChild(fileIn);

      fileIn.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        _sonidoShutter();
        if (status) status.textContent = '🔍 Analizando la foto…';
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const canvas = document.getElementById('cam-scan-canvas') || document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          canvas.getContext('2d').drawImage(img, 0, 0);
          _analizarCanvas(canvas, marcarDetectado, status);
        };
        img.onerror = () => { URL.revokeObjectURL(url); if (status) status.textContent = '❌ No se pudo leer la imagen.'; };
        img.src = url;
        fileIn.value = '';
      };

      btnCapturar.onclick = () => { fileIn.click(); };
    }
  } catch (e) {
    if (status) status.textContent = '❌ No se pudo acceder a la cámara: ' + (e.message || e);
  }
}

function esBarrasTxt(modo) { return modo === 'barras' ? 'Apuntando al código de barras.' : 'Apuntando al código.'; }

// Captura un fotograma de alta resolución y lo analiza con TODOS los lectores
// disponibles (nativo del celular + ZXing con TRY_HARDER). Decodificar sobre una
// imagen fija suele tener mucho mejor resultado que el video continuo, especialmente

function _capturarYLeer(video, marcarDetectado, status) {
  if (status) status.textContent = '🔍 Analizando la foto…';
  const canvas = document.getElementById('cam-scan-canvas') || document.createElement('canvas');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  _analizarCanvas(canvas, marcarDetectado, status);
}

function _analizarCanvas(canvas, marcarDetectado, status) {
  let yaResuelto = false;
  const intentar = (texto) => {
    if (yaResuelto || !texto) return;
    yaResuelto = true;
    marcarDetectado(texto);
  };

  const intentarNativo = async () => {
    if (!('BarcodeDetector' in window)) return false;
    try {
      let formatos = null;
      try { formatos = await window.BarcodeDetector.getSupportedFormats(); } catch(e) {}
      // Asegurar que siempre estén los formatos esenciales, incluyendo QR
      const formatosBase = ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'pdf417', 'aztec', 'data_matrix'];
      if (!formatos || !formatos.length) {
        formatos = formatosBase;
      } else {
        // Agregar los que falten de la lista base
        formatosBase.forEach(f => { if (!formatos.includes(f)) formatos.push(f); });
      }
      const detector = new window.BarcodeDetector({ formats: formatos });
      const codigos = await detector.detect(canvas);
      if (codigos && codigos.length) { intentar(codigos[0].rawValue); return true; }
    } catch(e) {}
    return false;
  };

  const intentarZXing = () => new Promise(resolve => {
    _cargarLibZXing(() => {
      try {
        const reader = _zxingReader || new ZXing.BrowserMultiFormatReader(_zxingHints());
        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        const img = new Image();
        img.onload = () => {
          const terminar = (res) => { if (res) { intentar(res.getText ? res.getText() : res.text || res); resolve(true); } else resolve(false); };
          if (typeof reader.decodeFromImageElement === 'function') {
            reader.decodeFromImageElement(img).then(terminar).catch(()=>resolve(false));
          } else if (typeof reader.decodeFromImage === 'function') {
            reader.decodeFromImage(img).then(terminar).catch(()=>resolve(false));
          } else if (typeof reader.decodeFromImageUrl === 'function') {
            reader.decodeFromImageUrl(dataUrl).then(terminar).catch(()=>resolve(false));
          } else resolve(false);
        };
        img.onerror = () => resolve(false);
        img.src = dataUrl;
      } catch(e) { resolve(false); }
    });
  });

  Promise.resolve().then(intentarNativo).then(ok => {
    if (ok || yaResuelto) return true;
    return intentarZXing();
  }).then(ok => {
    if (!ok && !yaResuelto && status) {
      status.textContent = '🤔 No se pudo leer el código. Asegúrate de que quepa completo, haya buena luz y vuelve a intentar — o escríbelo manualmente.';
    }
  });
}

function _cerrarEscanerCamara() {
  if (_camScanInterval) { clearInterval(_camScanInterval); _camScanInterval = null; }
  if (_zxingReader) { try { _zxingReader.reset(); } catch (e) {} _zxingReader = null; }
  if (_camScanStream) { try { _camScanStream.getTracks().forEach(t => t.stop()); } catch (e) {} _camScanStream = null; }
  _camScanTorchOn = false;
  _camScanTrack = null;
  const video = document.getElementById('cam-scan-video');
  if (video) { try { video.srcObject = null; } catch (e) {} }
}

// Mostrar preview si ya hay un código al abrir el modal
function mostrarBarcodeExistente(inputId, canvasId, modo) {
  inputId = inputId || 'c-barcode';
  const input = document.getElementById(inputId);
  if (input && input.value.length >= 8) dibujarBarcode(input.value, canvasId, modo);
}

function verDetalleProducto(id) {
  const item = (db.productos || []).find(i => i.id === id);
  if (!item) return;
  const verCosto = session.rol === 'admin';
  const canEdit = can(['admin','auxiliar','secretaria']);
  const canDelete = can(['admin']);

  const fotos = item.fotos && item.fotos.length
    ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
        ${item.fotos.map(f => `<img src="${f}" style="width:100px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer" onclick="window.open('${f}','_blank')" />`).join('')}
       </div>`
    : `<div style="text-align:center;padding:20px;color:#94a3b8;font-size:2rem;margin-bottom:16px">📷 Sin fotos</div>`;

  const fila = (lbl, val) => val ? `<tr><td style="padding:5px 8px;color:#64748b;font-size:0.83rem;white-space:nowrap">${lbl}</td><td style="padding:5px 8px;font-weight:600;font-size:0.88rem">${val}</td></tr>` : '';

  const specs = [
    fila('Unidad / Tipo', [item.especUnidad, item.especTipo].filter(Boolean).join(' · ')),
    fila('Forro exterior', item.especForro),
    fila('Color', item.especColor),
    fila('Observaciones', item.especObservaciones)
  ].join('');

  showModal(`📦 ${esc(item.nombre)}`, `
    ${fotos}
    <table style="width:100%;border-collapse:collapse">
      ${fila('Categoría', esc(item.categoria))}
      ${fila('Código QR', `<code style="font-size:0.78rem">${esc(item.codigo||'—')}</code>`)}
      ${fila('Cantidad', `${item.cantidad ?? '—'} ${esc(item.unidad||'')}`)}
      ${fila('Precio público', `<span style="color:var(--primary);font-size:1rem">$${fmt(item.precioPublico||0)}</span>`)}
      ${verCosto ? fila('Precio costo', `$${fmt(item.precio||0)}`) : ''}
      ${fila('Stock mínimo', item.sinMinimo ? 'Sin mínimo' : `${item.minimo ?? '—'}`)}
      ${specs}
    </table>
  `, [
    ...(canEdit ? [{ label: '✏️ Editar', cls: 'btn-warning', action: () => { closeModal(); openItemModal('productos', id); } }] : []),
    ...((item.cantidad||0) > 0 ? [{ label: '+ Venta', cls: 'btn-success', action: () => { closeModal(); nuevaVentaDesdeItem('productos', id); } }] : []),
    { label: '🔲 QR', cls: 'btn-secondary', action: () => { closeModal(); generarQRItem('productos', id); } },
    ...(canDelete ? [{ label: '🚫 Dar de baja', cls: 'btn-danger', action: () => { closeModal(); darDeBajaProducto(id); } }] : []),
    { label: 'Cerrar', cls: 'btn-secondary', action: closeModal }
  ]);
}

function _qrInfoItem(tipo, item) {

let _qrItemActual = null;
function _mostrarQRItem(tipo, id) {
  const item = db[tipo].find(i => i.id === id);
  if (!item) return;
  const nombre = tipo === 'consignacion' ? item.producto : item.nombre;

    <div id="qr-canvas-area" style="display:flex;justify-content:center;padding:14px;background:white;border-radius:10px;border:1px solid var(--border)"></div>
    <pre style="font-size:0.72rem;background:var(--bg);border-radius:8px;padding:8px;margin-top:10px;white-space:pre-wrap;color:#334155">${esc(info)}</pre>
  `, [

    { label:'Cerrar', cls:'btn-secondary', action:closeModal }
  ]);
  setTimeout(() => {
    const cont = document.getElementById('qr-canvas-area');
    if (cont && typeof QRCode !== 'undefined') {
      cont.innerHTML = '';
      new QRCode(cont, { text: texto, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.H });
      setTimeout(() => _dibujarLogoCentroQR(cont), 50);
    }
  }, 50);
}

// Dibuja "CAMPERS LA CUESTA" en el centro del QR (requiere correctLevel H para que siga
// siendo legible al escanear aunque el centro quede cubierto).
function _dibujarLogoCentroQR(cont) {
  const canvas = cont.querySelector('canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const boxW = w * 0.5, boxH = h * 0.22;
  const x = (w - boxW) / 2, y = (h - boxH) / 2;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x, y, boxW, boxH);
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, boxW, boxH);
  ctx.fillStyle = '#1e293b';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${Math.round(h * 0.052)}px Arial`;
  ctx.fillText('CAMPERS', w / 2, y + boxH * 0.36);
  ctx.fillText('LA CUESTA', w / 2, y + boxH * 0.74);
}

  const folio = `COTS-${String(c.folio||c.id).padStart(5,'0')}`;
  const linea = '------------------------------';
  const lineas = c.items.map(i => `• ${i.producto}  x${i.cantidad} — $${fmt(i.cantidad*i.precio)}`).join('\n');
  const specs = [
    c.unidad && c.unidad !== 'No aplica' ? `Unidad: ${c.unidad}` : '',
    c.tipo   && c.tipo   !== 'No aplica' ? `Tipo: ${c.tipo}` : '',
    c.forro  && c.forro  !== 'No aplica' ? `Forro ext.: ${c.forro}` : '',
    c.color  && c.color  !== 'No aplica' ? `Color: ${c.color}` : '',
  ].filter(Boolean).join('\n');

  const cuerpo =
    `Estimado(a) ${c.cliente}:\n\n` +
    `Le compartimos la cotización ${folio} de Campers La Cuesta.\n\n` +
    `${linea}\n` +
    `Fecha: ${fechaLarga(c.fecha)}\n` +
        (c.fechaEntrega ? `Tiempo de fabricación: ${c.fechaEntrega}\n` : '') +
    (specs ? `\n${specs}\n` : '') +
    (c.observaciones ? `\nObservaciones: ${c.observaciones}\n` : '') +
    `\n${linea}\n` +
    `DETALLE\n` +
    `${lineas}\n` +
    `${linea}\n` +
    `TOTAL: $${fmt(c.total)}\n` +
    (c.notas ? `\n${c.notas}\n` : '') +
    `\n` +
    `\n${linea}\n` +
    `Campers La Cuesta\n` +
    `Crucero Arandas #900, Col. el Crucero de Arandas\n` +
    `Tepatitlán, Jalisco, México\n` +
    `Tel: 378-70-100-90  ·  WhatsApp: 378-710-5467\n` +
    `ventas@camperslacuesta.com  ·  www.camperslacuesta.com`;

  const destinatario = (c.ctCorreo && c.ctCorreo !== 'No aplica') ? c.ctCorreo : '';
  const asunto = encodeURIComponent(`Cotización ${folio} - Campers La Cuesta`);
  const cuerpoCod = encodeURIComponent(cuerpo);

  const mailtoUrl = `mailto:${destinatario}?subject=${asunto}&body=${cuerpoCod}`;
  const pdfNombre = `Cotizacion_${folio}_${c.cliente.replace(/\s+/g,'_')}.pdf`;

  showModal('📧 Enviar cotización por correo', `

        Sigue estos pasos:

        <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px">
          <span style="font-size:1.4rem">1️⃣</span>
          <div>
            <div style="font-weight:600;color:#166534">Descarga el PDF</div>
            <div style="font-size:0.82rem;color:#4d7c0f">Se guardará como: <strong>${pdfNombre}</strong></div>
            <div id="paso1hint" style="display:none;font-size:0.78rem;color:#166534;margin-top:4px">📂 Revisa la barra de descargas de Chrome (parte inferior de la pantalla) o la carpeta <strong>Descargas</strong> de tu equipo.</div>
          </div>
          <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="generarPDFCotiz(db.cotizaciones.find(x=>x.id===${c.id}));document.getElementById('paso1ok').style.display='inline';document.getElementById('paso1hint').style.display='block'">⬇ Descargar PDF</button>
          <span id="paso1ok" style="display:none;color:#16a34a;font-size:1.2rem">✓</span>
        </div>
        <div style="background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px">
          <span style="font-size:1.4rem">2️⃣</span>
          <div>
            <div style="font-weight:600;color:#1e40af">Abre el correo</div>
            <div style="font-size:0.82rem;color:#1d4ed8">Para: <strong>${destinatario || '(sin correo registrado)'}</strong></div>
          </div>
          <button class="btn btn-sm" style="margin-left:auto;background:#1d4ed8;color:white" onclick="window.open('${mailtoUrl}','_blank')">✉ Abrir correo</button>
