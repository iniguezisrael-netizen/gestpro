function addCotizItem() {
  const prod = document.getElementById('czi-prod').value.trim();
  const qty  = +document.getElementById('czi-qty').value;
  const pendiente = document.getElementById('czi-pendiente')?.checked || false;
  const price = pendiente ? 0 : +document.getElementById('czi-price').value;
  if (!prod || qty <= 0) { _info('Escribe el concepto y la cantidad.'); return; }
  if (!pendiente && price <= 0) { _info('Ingresa el precio, o marca "Precio pendiente de cotizar".'); return; }
  cotizItems.push({ producto: prod, cantidad: qty, precio: price, pendiente: pendiente || undefined });
  document.getElementById('czi-prod').value = '';
  document.getElementById('czi-qty').value  = 1;
  document.getElementById('czi-price').value = '';
  const cb = document.getElementById('czi-pendiente');
  if (cb) { cb.checked = false; _toggleCziPendiente(); }
  updateCotizItems();
}

function updateCotizItems() {
  const list = document.getElementById('cotiz-items-list');
  if (!list) return;
  list.innerHTML = cotizItems.length ? `<table style="width:100%;font-size:0.85rem;border-collapse:collapse">
    <tr style="background:var(--bg)"><th style="padding:6px">Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th></th></tr>

      <td><input type="number" min="0.01" step="any" value="${i.cantidad}" style="width:60px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;font-size:0.85rem" onchange="cotizItems[${idx}].cantidad=+this.value||1;updateCotizItems()" /></td>
      <td>${i.pendiente

        : `<input type="number" min="0" step="any" value="${i.precio}" style="width:80px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;font-size:0.85rem" onchange="cotizItems[${idx}].precio=+this.value||0;updateCotizItems()" />`}

    </tr>`).join('')}
  </table>` : '<p style="color:#94a3b8;font-size:0.85rem">Sin items.</p>';
  const subtotal = cotizItems.reduce((s,i) => s + i.cantidad*i.precio, 0);
  const tv = document.getElementById('cotiz-total');
  if (tv) {

}

function saveCotiz(id) {
  const nombre = czVal('nombre'), apellido = czVal('apellido');
  if (!nombre || nombre === 'No aplica') { _info('El nombre del cliente es obligatorio'); return; }
  if (!cotizItems.length) { _info('Agrega al menos un item'); return; }
  const ivaElS = document.querySelector('input[name="cz-iva"]:checked');
  const masIvaS = ivaElS && ivaElS.value === 'mas';
  const subtotalCz = cotizItems.reduce((s,i)=>s+i.cantidad*i.precio,0);
  const total = subtotalCz;
  const cliente = [nombre, apellido !== 'No aplica' ? apellido : ''].filter(Boolean).join(' ');
  const _nextCzFolio = () => {
    const folios = (db.cotizaciones||[]).map(c => c.folio || 0);
    return (folios.length ? Math.max(...folios) : 0) + 1;
  };
  const existente = id ? db.cotizaciones.find(x=>x.id===id) : null;
  const obj = {
    id: id || sid(),
    folio: existente ? (existente.folio || existente.id) : _nextCzFolio(),
    fecha: v('cz-fecha'), fechaEntrega: v('cz-entrega'), validez: parseInt(document.getElementById('cz-validez').value)||0, cliente,
    ctNombre: nombre, ctApellido: czVal('apellido'),
    ctCiudad: czVal('ciudad'), ctEstado: czVal('estado'), ctEmpresa: czVal('empresa'),
    ctRfc: (czVal('rfc')||'').toUpperCase(), ctTelFijo: czVal('telfijo'), ctCelular: czVal('celular'),
    ctCorreo: czVal('correo'),
    ctDireccion: czVal('direccion'), ctColonia: czVal('colonia'), ctCp: czVal('cp'),
    estado: v('cz-estado-form') || (id ? db.cotizaciones.find(x=>x.id===id).estado : 'Pendiente'),
    unidad: v('cz-unidad'), tipo: v('cz-tipo'),
    forro: v('cz-forro'), color: v('cz-color'),
    observaciones: v('cz-observaciones'),
    notas: v('cz-notas'),
    recFecha: v('cz-rec-fecha'),
    recHora: document.getElementById('cz-rec-todoeldia')?.checked ? 'Todo el día' : v('cz-rec-hora'),
    recNota: v('cz-rec-nota'),
    recHecho: id ? (db.cotizaciones.find(x=>x.id===id)?.recHecho || false) : false,
    items: cotizItems, total,
    iva: masIvaS, subtotal: subtotalCz, ivaAmount: 0,
    fotos: [..._tempFotosCz],
    usuario: id ? (db.cotizaciones.find(x=>x.id===id)?.usuario || session.nombre) : session.nombre,
    usuarioRol: id ? (db.cotizaciones.find(x=>x.id===id)?.usuarioRol || session.rol) : session.rol
  };
  if (id) { const idx = db.cotizaciones.findIndex(x=>x.id===id); db.cotizaciones[idx] = obj; }
  else db.cotizaciones.push(obj);
  upsertCliente({ nombre: obj.ctNombre, apellido: obj.ctApellido, ciudad: obj.ctCiudad, estado: obj.ctEstado, empresa: obj.ctEmpresa, telfijo: obj.ctTelFijo, celular: obj.ctCelular, correo: obj.ctCorreo, direccion: obj.ctDireccion, colonia: obj.ctColonia, cp: obj.ctCp });
  saveDb(['cotizaciones','clientes']); closeModal(); renderCotizaciones();
}

function addPedidoItem() {
  const prod = document.getElementById('pd-prod').value.trim();
  const qty = +document.getElementById('pd-qty').value;
  const price = +document.getElementById('pd-price').value;
  if (!prod || qty <= 0 || price <= 0) { _info('Completa todos los campos'); return; }
  pedidoItems.push({ producto:prod, cantidad:qty, precio:price });
  document.getElementById('pd-prod').value='';
  document.getElementById('pd-qty').value=1;
  document.getElementById('pd-price').value='';
  updatePedidoItems();
}

function updatePedidoItems() {
  const list = document.getElementById('pedido-items-list');
  if (!list) return;
  list.innerHTML = pedidoItems.length ? `<table style="width:100%;font-size:0.82rem;border-collapse:collapse">
    <tr style="background:var(--bg)"><th style="padding:5px">Concepto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th></th></tr>
    ${pedidoItems.map((i,idx)=>`<tr style="border-top:1px solid var(--border)">
      <td style="padding:5px">${esc(i.producto)}</td>
      <td><input type="number" min="0.01" step="any" value="${i.cantidad}" style="width:60px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;font-size:0.82rem" onchange="pedidoItems[${idx}].cantidad=+this.value||1;updatePedidoItems()" /></td>
      <td><input type="number" min="0" step="any" value="${i.precio}" style="width:80px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;font-size:0.82rem" onchange="pedidoItems[${idx}].precio=+this.value||0;updatePedidoItems()" /></td>
      <td style="padding:5px;font-weight:600">$${fmt(i.cantidad*i.precio)}</td>
      <td><button onclick="pedidoItems.splice(${idx},1);updatePedidoItems()" style="background:none;border:none;cursor:pointer;color:var(--danger)">✕</button></td>
    </tr>`).join('')}
  </table>` : '<p style="color:#94a3b8;font-size:0.8rem">Sin conceptos.</p>';
  const subtotal = pedidoItems.reduce((s,i)=>s+i.cantidad*i.precio,0);
  const total = subtotal; // precio tal cual, sin calcular IVA encima
  const ts = document.getElementById('pedido-subtotal');
  if (ts) ts.innerHTML = pedidoItems.length
    ? `<span style="font-weight:700;color:var(--primary)">Total: $${fmt(total)}</span>${window._pedidoIva ? ' <span style="font-size:0.78rem;color:#64748b">+IVA (16%)</span>' : ''}`
    : '';
  const pt = document.getElementById('pd-total');
  if (pt) { pt.value = total.toFixed(2); calcSaldo(); }
}

function calcSaldo() {
  const total = +document.getElementById('pd-total')?.value || 0;
  const anticipo = +document.getElementById('pd-anticipo')?.value || 0;
  const saldo = Math.max(0, total - anticipo);
  const ps = document.getElementById('pd-saldo');
  if (ps) ps.value = saldo.toFixed(2);
}

function guardarPedido(c) {
  const folioManual = v('pd-folio').trim();
  const folioFinal = folioManual || _siguienteNotaVenta();
  const cliente = v('pd-cliente');
  if (!cliente) { _info('El cliente es obligatorio'); return; }
  if (!pedidoItems.length) { _info('Agrega al menos un concepto'); return; }
  if (folioManual && db.ventas.find(x=>x.folioPedido===folioManual && x.estado!=='Cancelada')) {
    _info(`❌ Ya existe un pedido activo con el folio "${folioManual}". Asigna un número diferente (solo se puede reutilizar si ese pedido está cancelado).`);
    return;
  }
  const total = pedidoItems.reduce((s,i)=>s+i.cantidad*i.precio,0); // precio tal cual
  const anticipo = +v('pd-anticipo') || 0;
  const saldo = Math.max(0, total - anticipo);
  const formaPagoAnticipo = anticipo > 0 ? (document.getElementById('pd-forma-pago')?.value || 'efectivo') : null;
  const pagosIniciales = anticipo > 0
    ? [{ monto: anticipo, fecha: v('pd-fecha'), nota: 'Anticipo inicial', recibidoPor: session.nombre, formaPago: formaPagoAnticipo }]
    : [];
  const nuevoPedido = {
    id: sid(), folioPedido: folioFinal, fecha: v('pd-fecha'), fechaEntrega: v('pd-fecha-entrega'), cliente,
    items: pedidoItems, total,
    anticipo, saldo, formaPago: formaPagoAnticipo,
    pagos: pagosIniciales,
    estado: v('pd-estado'),
    unidad: v('pd-unidad'), tipo: v('pd-tipo'),
    forro: v('pd-forro'), color: v('pd-color'),
    observaciones: v('pd-obs'), notas: v('pd-notas'),
    iva: window._pedidoIva || false, ivaMode: window._pedidoIva ? 'mas' : 'neto',
    esPedido: true, cotizRef: c.id,
    ctEmpresa: c.ctEmpresa, ctCiudad: c.ctCiudad, ctEstado: c.ctEstado,
    ctTelFijo: c.ctTelFijo, ctCelular: c.ctCelular, ctCorreo: c.ctCorreo,
    fotos: c.fotos ? [...c.fotos] : [],
    usuario: session.nombre
  };
  db.ventas.push(nuevoPedido);
  c.estado = 'Aprobada';
  saveDb(['ventas','cotizaciones','cajas']); closeModal();
  navigate('ventas');
  generarCopiasPedido(nuevoPedido);
  _info('✅ Pedido registrado correctamente.\n\nSe generaron las 3 copias en PDF: Administración, Cliente y Producción.');
  if (anticipo > 0) {
    setTimeout(() => {
      if (confirm('💵 Se registró un anticipo de $' + fmt(anticipo) + '.\n\n¿Deseas imprimir el recibo de pago ahora?')) {
        generarReciboPago(nuevoPedido.id, 0);
      }
    }, 200);
  }
}

  // Genera las 3 hojas (Cliente, Empresa, Producción) en el formato HTML "La Cuesta"
  _cargarLogoYAbrirFormatoPedido(vt, false);

function _cargarLogoYAbrirFormatoPedido(vt, soloEP) {
  const logoEl = document.querySelector('#login-logo, .sidebar-logo, img[alt="Campers La Cuesta"]');
  const logoSrcRaw = logoEl ? logoEl.src : '';
  const folioBarcode = String(vt.folioPedido || vt.id || '');
  // El código de barras se genera AQUÍ (en la ventana principal, donde JsBarcode ya se
  // puede cargar libremente) como una imagen PNG en base64, y se incrusta como <img> en el
  // documento. Así evitamos depender de que un <script> se ejecute dentro de la ventana
  // nueva (poco confiable: bloqueadores de popups, CSP o impresión antes de que cargue).
  const _conBarcode = (logoB64) => {
    _cargarLibJsBarcode(() => {
      let bcB64 = '';
      try {
        const canvas = document.createElement('canvas');
        JsBarcode(canvas, folioBarcode, { format:'CODE128', width:1.6, height:40, fontSize:12, margin:4, displayValue:true });
        bcB64 = canvas.toDataURL('image/png');
      } catch(e) { console.warn('[Barcode] no se pudo generar para el pedido', e); }
      _abrirFormatoPedidoHTML(vt, logoB64, soloEP, bcB64);
    });
  };
  if (logoSrcRaw.startsWith('data:image/')) { _conBarcode(logoSrcRaw); return; }
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    try { _conBarcode(canvas.toDataURL('image/png')); } catch(e) { _conBarcode(''); }
  };
  img.onerror = () => _conBarcode('');
  img.src = logoSrcRaw || '';
}
window['_cargarLogoYAbrirFormatoPedido'] = _cargarLogoYAbrirFormatoPedido;

function _cargarLogoYAbrirFormatoCotiz(c) {
  const logoEl = document.querySelector('#login-logo, .sidebar-logo, img[alt="Campers La Cuesta"]');
  const logoSrcRaw = logoEl ? logoEl.src : '';
  const folioBarcode = String(c.folio || c.id || '');
  const _conBarcode = (logoB64) => {
    _cargarLibJsBarcode(() => {
      let bcB64 = '';
      try {
        const canvas = document.createElement('canvas');
        JsBarcode(canvas, folioBarcode, { format:'CODE128', width:1.6, height:40, fontSize:12, margin:4, displayValue:true });
        bcB64 = canvas.toDataURL('image/png');
      } catch(e) { console.warn('[Barcode cotiz] no se pudo generar', e); }
      _abrirFormatoCotizHTML(c, logoB64, bcB64);
    });
  };
  if (logoSrcRaw.startsWith('data:image/')) { _conBarcode(logoSrcRaw); return; }
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    try { _conBarcode(canvas.toDataURL('image/png')); } catch(e) { _conBarcode(''); }
  };
  img.onerror = () => _conBarcode('');
  img.src = logoSrcRaw || '';
}
window['_cargarLogoYAbrirFormatoCotiz'] = _cargarLogoYAbrirFormatoCotiz;

      doc.text('Tel: 378-710-5467 | Tepatitlán de Morelos, Jalisco', W/2, footY+7, {align:'center'});
    }

    buildVentaPage('cliente'); doc.addPage(); y=14;
    buildVentaPage('empresa'); doc.addPage(); y=14;

}

function _cargarLogoYBuildCopiasPedido(vt) {
  const logoEl = document.querySelector('#login-logo, .sidebar-logo, img[alt="Campers La Cuesta"]');
  const logoSrcRaw = logoEl ? logoEl.src : '';
  // Si ya es base64, pasarlo directo a jsPDF (evita tainted canvas)
  if (logoSrcRaw.startsWith('data:image/')) {
    const img = new Image();
    img.onload = function() {
      _buildCopiasPedidoPDF(vt, logoSrcRaw, img.width, img.height);
    };
    img.onerror = () => _buildCopiasPedidoPDF(vt, null, 0, 0);
    img.src = logoSrcRaw;
    return;
  }
  // Si es URL externa, convertir via canvas
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    try {
      const logoB64 = canvas.toDataURL('image/png');
      _buildCopiasPedidoPDF(vt, logoB64, img.width, img.height);
    } catch(e) { _buildCopiasPedidoPDF(vt, null, 0, 0); }
  };
  img.onerror = () => _buildCopiasPedidoPDF(vt, null, 0, 0);
  img.src = logoSrcRaw || 'https://0201.nccdn.net/4_2/000/000/04b/787/logo-la-cuesta-en-amarillo.gif';}

function _buildCopiasPedidoPDF(vt, logoB64, logoW, logoH) {
  if (window._poppinsBoldB64) { _doPedidoPDF(vt, logoB64, logoW, logoH, window._poppinsBoldB64); return; }
  fetch('https://cdn.jsdelivr.net/gh/google/fonts/ofl/poppins/Poppins-Bold.ttf')
    .then(r => { if (!r.ok) throw new Error('font'); return r.arrayBuffer(); })
    .then(buf => {
      const bytes = new Uint8Array(buf);
      let binary = ''; for (let i=0;i<bytes.byteLength;i++) binary+=String.fromCharCode(bytes[i]);
      window._poppinsBoldB64 = btoa(binary);
      _doPedidoPDF(vt, logoB64, logoW, logoH, window._poppinsBoldB64);
    })
    .catch(() => _doPedidoPDF(vt, logoB64, logoW, logoH, null));
}

function _doPedidoPDF(vt, logoB64, logoW, logoH, fontB64) {
  const { jsPDF } = window.jspdf || window;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210, M = 10;
  const autor = vt.usuario || session.nombre;
  const cotizFolio = vt.cotizRef ? `COTS-${String(vt.cotizRef).padStart(5,'0')}` : null;

  let modFont = 'helvetica';
  if (fontB64) {
    try {
      doc.addFileToVFS('Poppins-Bold.ttf', fontB64);
      doc.addFont('Poppins-Bold.ttf', 'Poppins', 'bold');
      modFont = 'Poppins';
    } catch(e) { modFont = 'helvetica'; }
  }

  function rightLabelValue(label, value, x, yy, size) {
    doc.setFontSize(size||10); doc.setFont('helvetica','normal');
    const valW = doc.getTextWidth(value);
    doc.setFont('helvetica','bold');
    const labW = doc.getTextWidth(label);
    const startX = x - (valW + labW);
    doc.setTextColor(30,41,59); doc.text(label, startX, yy);
    doc.setFont('helvetica','normal'); doc.text(value, startX + labW, yy);
  }
  function leftLabelValue(label, value, x, yy, size) {
    doc.setFontSize(size||10);
    doc.setFont('helvetica','bold'); doc.setTextColor(30,41,59);
    doc.text(label, x, yy);
    const labW = doc.getTextWidth(label);
    doc.setFont('helvetica','normal'); doc.setTextColor(71,85,105);
    doc.text(value, x + labW, yy);
  }

  // ── ENCABEZADO: logo + cotización ref ──
  const headerY = 16;
  let logoBottom = headerY;
  if (logoB64 && logoW && logoH) {
    const maxW = 75, maxH = 65;
    let lw = maxW, lh = maxW * (logoH / logoW);
    if (lh > maxH) { lh = maxH; lw = maxH * (logoW / logoH); }
    try { doc.addImage(logoB64, 'PNG', M, headerY, lw, lh); } catch(e) {}
    logoBottom = headerY + lh;
  }

  if (cotizFolio) {
    doc.setFont(modFont, 'bold'); doc.setTextColor(30,41,59); doc.setFontSize(17);
    doc.text(`COTIZACIÓN #${vt.cotizRef}`, W - M, headerY + 16, { align: 'right' });
  }

  const lineY = Math.max(logoBottom, headerY + 16) + 8;
  doc.setDrawColor(226,232,240); doc.setLineWidth(0.5);
  doc.line(M, lineY, W - M, lineY);
  let y = lineY + 10;

  // ── DATOS DEL CLIENTE ──
  leftLabelValue('Para: ', vt.cliente, M, y, 11);
  rightLabelValue('Fecha: ', fechaLarga(vt.fecha), W - M, y, 10);
  y += 6;

  const ctParts = [
    vt.ctEmpresa && vt.ctEmpresa!=='No aplica' ? `Empresa: ${vt.ctEmpresa}` : '',
    vt.ctCiudad  && vt.ctCiudad !=='No aplica' ? `Ciudad: ${vt.ctCiudad}${vt.ctEstado&&vt.ctEstado!=='No aplica'?', '+vt.ctEstado:''}` : '',
    vt.ctTelFijo && vt.ctTelFijo!=='No aplica' ? `Tel.: ${vt.ctTelFijo}` : '',
    vt.ctCelular && vt.ctCelular!=='No aplica' ? `Cel.: ${vt.ctCelular}` : '',
  ].filter(Boolean);
  if (ctParts.length) {
    doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139);
    doc.text(ctParts.join('   ·   '), M, y);
  }
  y += 6;
  leftLabelValue('Elaborado por: ', autor, M, y, 10);
  if (vt.fechaEntrega) rightLabelValue('Tiempo de fabricación: ', vt.fechaEntrega, W - M, y, 10);
  y += 12;

  // ── ESPECIFICACIONES ──
  const specs = [
    vt.unidad ? `Unidad: ${vt.unidad}` : '',
    vt.tipo   ? `Tipo: ${vt.tipo}` : '',
    vt.forro  ? `Forro ext.: ${vt.forro}` : '',
    vt.color  ? `Color: ${vt.color}` : '',
  ].filter(Boolean);
  if (specs.length) {
    doc.setFontSize(9.5);
    const lines = doc.splitTextToSize(specs.join('   ·   '), W - M*2 - 10);
    const boxH = 6 + lines.length*5;
    doc.setFillColor(241,245,249);
    doc.roundedRect(M, y, W - M*2, boxH, 2, 2, 'F');
    doc.setFont('helvetica','normal'); doc.setTextColor(51,65,85);
    lines.forEach((ln,i) => doc.text(ln, M+5, y+6+i*5));
    y += boxH + 6;
  }

  // ── OBSERVACIONES ──
  if (vt.observaciones) {
    doc.setFontSize(9.5);
    const obsLines = doc.splitTextToSize(`Observaciones: ${vt.observaciones}`, W - M*2 - 10);
    const boxH = 6 + obsLines.length*5;
    doc.setFillColor(254,249,195);
    doc.roundedRect(M, y, W - M*2, boxH, 2, 2, 'F');
    doc.setTextColor(120,53,15);
    obsLines.forEach((ln,i) => {
      if (i===0) {
        doc.setFont('helvetica','bold'); doc.text('Observaciones: ', M+5, y+6);
        doc.setFont('helvetica','normal');
        doc.text(ln.replace('Observaciones: ',''), M+5+doc.getTextWidth('Observaciones: '), y+6);
      } else { doc.setFont('helvetica','normal'); doc.text(ln, M+5, y+6+i*5); }
    });
    y += boxH + 6;
  }

  // ── TABLA DE CONCEPTOS ──
  const tableW = W - M*2;
  const cQty = M + tableW*0.62, cPrice = M + tableW*0.80, cSub = W - M;
  doc.setFillColor(241,245,249);
  doc.rect(M, y, tableW, 8, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(71,85,105);
  doc.text('CONCEPTO / SERVICIO', M+4, y+5.5);
  doc.text('CANT.', cQty, y+5.5, {align:'right'});
  doc.text('PRECIO UNIT.', cPrice, y+5.5, {align:'right'});
  doc.text('SUBTOTAL', cSub, y+5.5, {align:'right'});
  y += 8;

  vt.items.forEach(item => {
    const rh = 8;
    doc.setDrawColor(226,232,240); doc.setLineWidth(0.2);
    doc.line(M, y+rh, M+tableW, y+rh);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(30,41,59);
    doc.text(String(item.producto).substring(0,50), M+4, y+5.5);
    doc.text(String(item.cantidad), cQty, y+5.5, {align:'right'});
    doc.text(`$${fmt(item.precio)}`, cPrice, y+5.5, {align:'right'});
    doc.setFont('helvetica','bold');
    doc.text(`$${fmt(item.cantidad*item.precio)}`, cSub, y+5.5, {align:'right'});
    y += rh;
  });

  // ── TOTALES ──
  y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(30,41,59);
  doc.text(`Total: $${fmt(vt.total)}`, W - M, y, { align: 'right' });
  if (vt.anticipo != null) {
    y += 6;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(22,163,74);
    doc.text(`Anticipo: $${fmt(vt.anticipo)}`, W - M, y, { align: 'right' });
  }
  if (vt.saldo != null) {
    y += 6;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(185,28,28);
    doc.text(`Saldo pendiente: $${fmt(vt.saldo)}`, W - M, y, { align: 'right' });
  }
  if (vt.notas) {
    y += 8;
    doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(100,116,139);
    const notLines = doc.splitTextToSize(vt.notas, W - M*2);
    notLines.forEach((ln,i) => doc.text(ln, M, y + i*5));
    y += notLines.length * 5;
  }

  // ── DATOS BANCARIOS ──
  y += 10;
  doc.setDrawColor(26,26,46); doc.setLineWidth(0.6);
  doc.line(M, y, W-M, y);
  y += 7;
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(26,26,46);
  doc.text('Datos para pago / transferencia', M, y);
  y += 6;
  const bankCols = [
    ['Razón Social:', 'Amanda López Galindo'],
    ['RFC:', 'LOGA810403SP7'],
    ['Banco:', 'Bancomer (BBVA)'],
    ['Cuenta:', '0478205647'],
    ['No. Tarjeta:', '4152 3138 5506 0708'],
    ['CLABE:', '012396004782056478'],
  ];
  const colW = (W - M*2) / 2;
  bankCols.forEach(([lbl, val], i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const bx = M + col * colW, by = y + row * 6;
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(51,65,85);
    doc.text(lbl, bx, by);
    doc.setFont('helvetica','normal'); doc.text(val, bx + 28, by);
  });
  y += Math.ceil(bankCols.length / 2) * 6 + 4;

  // ── PIE ──
  const footY = 271;
  doc.setDrawColor(226,232,240); doc.setLineWidth(0.4);
  doc.line(M, footY, W-M, footY);
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(100,116,139);
  doc.text('Crucero Arandas #900, Col. el Crucero de Arandas, Tepatitlán, Jalisco, México', W/2, footY+6, {align:'center'});
  doc.text('Tel: 378-70-100-90  ·  WhatsApp: 378-710-5467  ·  ventas@camperslacuesta.com  ·  www.camperslacuesta.com', W/2, footY+18.5, {align:'center'});

  const fname = cotizFolio ? `Cotizacion_${cotizFolio}_${vt.cliente.replace(/\s+/g,'_')}.pdf`
                           : `Pedido_${vt.cliente.replace(/\s+/g,'_')}.pdf`;
  doc.save(fname);
}

  } catch(e) {

  }

    <div class="card">
      <div class="card-header">

        <tr><th>Nombre</th><th>Usuario</th><th>Contraseña</th><th>Rol</th><th>Acciones</th></tr>
        ${db.users.map(u => `<tr>
          <td>${esc(u.nombre)}</td><td>${u.user}</td>
          <td>
            <span style="display:inline-flex;align-items:center;gap:6px">
              <span id="pwd-${u.uid}" style="font-family:monospace;letter-spacing:2px">${u.password ? '••••••' : '—'}</span>
              ${u.password ? `<button onclick="const s=document.getElementById('pwd-${u.uid}');s.textContent=s.textContent==='${esc(u.password)}'?'••••••':'${esc(u.password)}'" style="background:none;border:none;cursor:pointer;font-size:0.9rem;padding:2px 4px" title="Ver/ocultar">👁️</button>` : ''}
            </span>
          </td>
          <td><span class="badge ${u.rol==='admin'?'badge-blue':u.rol==='secretaria'?'badge-green':u.rol==='auxiliar'?'badge-yellow':'badge-gray'}">${ROL_LABELS[u.rol]||u.rol}</span></td>
          <td>
            <button class="btn btn-warning btn-sm" onclick="openUserModal('${u.uid}')">✏️ Editar</button>
            <button class="btn btn-secondary btn-sm" onclick="openChangePasswordModal('${u.uid}','${esc(u.nombre)}')">🔑 Contraseña</button>
            <button class="btn btn-secondary btn-sm" onclick="openChangeEmailModal('${u.uid}','${esc(u.nombre)}')">✉️ Correo</button>

  showModal(u ? 'Editar Usuario' : 'Nuevo Usuario', `

    </div>

async function saveUser(uid) {
  const nombre = v('u-nombre'), user = v('u-user'), rol = v('u-rol');
  if (!nombre || !user) { _info('Nombre y usuario son obligatorios'); return; }

  if (uid) {
    // Editar usuario existente — solo actualiza nombre y rol en Firestore
    try {
      await firestore.collection('roles').doc(uid).set({ nombre, user, rol });
    } catch(e) {
      _info('No se pudo guardar: ' + e.message); return;
    }
    closeModal(); renderUsuarios();
    return;
  }

  // Nuevo usuario — llama a Cloud Function que crea Auth + rol
  const password = v('u-pass');
  if (!password || password.length < 6) { _info('La contraseña debe tener al menos 6 caracteres'); return; }
  if (db.users.find(x => x.user === user.toLowerCase())) { _info('Ese nombre de usuario ya existe'); return; }

  const btn = document.querySelector('#modal-footer .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Creando…'; }

  try {
    const call = functions.httpsCallable('crearUsuario');
    await call({ loginUser: user, password, nombre, rol });
    closeModal();
    _info('✅ Usuario creado. Ya puede entrar con su usuario y contraseña.');
    renderUsuarios();
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Crear'; }
    const msg = e.message || String(e);
    if (msg.includes('already-exists') || msg.includes('ya existe')) {
      _info('Ese usuario ya existe. Intenta de nuevo — se recuperará la cuenta.');
    } else {
      _info('No se pudo crear: ' + msg);
    }
  }
}

async function confirmarCambiarPassword(uid) {
  const newPassword = v('np-pass');

  if (!functions) { _info('No se pudo conectar con el servidor de funciones.'); return; }
  try {
    const call = functions.httpsCallable('cambiarPasswordUsuario');
    await call({ targetUid: uid, newPassword });
    closeModal();
    _info('Contraseña actualizada correctamente.');
  } catch(e) {
    _info('No se pudo cambiar la contraseña: ' + e.message);
  }
}

function openChangeEmailModal(uid, nombre) {
  showModal('Correo de recuperación — ' + nombre, `
    <p style="font-size:0.82rem;color:#475569;margin-bottom:10px">Este correo real se usa solo para poder restablecer la contraseña con el enlace "¿Olvidaste tu contraseña?". El usuario sigue iniciando sesión normalmente con su nombre de usuario.</p>
    <div class="form-group"><label>Correo real</label><input id="np-email" type="email" placeholder="ejemplo@gmail.com" /></div>
  `, [
    { label:'Guardar correo', cls:'btn-primary', action:()=>confirmarCambiarEmail(uid) },
    { label:'Cancelar', cls:'btn-secondary', action:closeModal }
  ]);
}

async function confirmarCambiarEmail(uid) {
  const newEmail = v('np-email').trim();
  if (!newEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) { _info('Escribe un correo válido'); return; }
  if (!functions) { _info('No se pudo conectar con el servidor de funciones.'); return; }
  try {
    const call = functions.httpsCallable('actualizarEmailUsuario');
    await call({ targetUid: uid, newEmail });
    closeModal();
    _info('Correo de recuperación actualizado correctamente.');
  } catch(e) {
    _info('No se pudo actualizar el correo: ' + e.message);
  }
}

async function delUser(uid) {
  if (!confirm('¿Eliminar el acceso de este usuario? (Su cuenta de Firebase Authentication NO se borra; hazlo también en la consola si quieres bloquearlo por completo)')) return;
  try {
    await firestore.collection('roles').doc(uid).delete();
  } catch(e) {
    _info('No se pudo eliminar: ' + e.message);
    return;
  }
  renderUsuarios();
}

// ===================== CAJA =====================
function cajaActiva() {
  return db.cajas.find(c => c.usuario === session.nombre && !c.cerrada);
}

// Devuelve la caja abierta del usuario actual. Si no hay ninguna (secretaria/auxiliar
// cobrando sin haber abierto caja manualmente), crea una automáticamente con fondo 0
// para que el cobro en efectivo siempre quede registrado.
function cajaActivaOCrear() {
  const existente = cajaActiva();
  if (existente) return existente;
  const ahora = new Date();
  const nueva = {
    id: sid(),
    usuario: session.nombre,
    fecha: today(),
    hora: ahora.toTimeString().slice(0,5),
    fondo: 0,
    movimientos: [],
    cerrada: false
  };
  db.cajas = db.cajas || [];
  db.cajas.push(nueva);
  return nueva;
}

let cajaVistaAdmin = null;
let _cajaPersonasIdx = [];
let _rolesParaCaja = null; // cache de roles/{uid} para listar secretaria/auxiliar aunque no hayan abierto caja aún

async function _cargarRolesParaCaja() {
  if (!firestore) return;
  try {
    const snap = await firestore.collection('roles').get();
    _rolesParaCaja = snap.docs.map(d => d.data());
  } catch(e) {
    _rolesParaCaja = [];
  }
  if (currentPage === 'caja') renderCaja();
}

function cajaContexto() {
  if (session.rol === 'admin') {
    if (!cajaVistaAdmin) return null;
    return db.cajas.find(c => c.usuario === cajaVistaAdmin && !c.cerrada) || null;
  }
  return cajaActiva();
}

function _panelSelectorCajas() {
  if (_rolesParaCaja === null) { _rolesParaCaja = []; _cargarRolesParaCaja(); }
  // Personas con acceso a Caja Chica (secretaria y auxiliar) según roles/{uid}, más cualquier
  // nombre que ya tenga historial de caja (por si hay datos previos), nunca el propio administrador.
  const nombresRoles = _rolesParaCaja
    .filter(u => u.rol === 'secretaria' || u.rol === 'auxiliar')
    .map(u => u.nombre);
  // Si ya tenemos datos de roles en Firebase, usamos solo esos (evita entradas obsoletas del historial de cajas).
  // El historial solo se usa como respaldo cuando aún no hay roles cargados.
  const nombresHistorial = (db.cajas||[]).map(c => c.usuario);
  const personas = nombresRoles.length > 0
    ? nombresRoles.filter(p => p && p !== session.nombre)
    : Array.from(new Set(nombresHistorial)).filter(p => p && p !== session.nombre);
  _cajaPersonasIdx = personas;
  if ((!cajaVistaAdmin || !personas.includes(cajaVistaAdmin)) && personas.length) {
    cajaVistaAdmin = personas[0];
  }
  if (!personas.length) {
    return `
      <div style="width:200px;flex-shrink:0">
        <div class="card" style="padding:12px">
          <div style="font-size:0.72rem;font-weight:700;color:#64748b;margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em">Ver caja de</div>
          <p style="font-size:0.8rem;color:#94a3b8">Aún no hay cajas de secretaria o auxiliar para mostrar.</p>
        </div>
      </div>`;
  }
  return `
    <div style="width:200px;flex-shrink:0">
      <div class="card" style="padding:12px">
        <div style="font-size:0.72rem;font-weight:700;color:#64748b;margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em">Ver caja de</div>
        ${personas.map((p, idx) => {
          const abierta = (db.cajas||[]).some(c => c.usuario === p && !c.cerrada);
          const activo = p === cajaVistaAdmin;
          return `<button type="button" onclick="seleccionarCajaAdmin(${idx})"
            style="display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;border-radius:8px;border:1.5px solid ${activo ? 'var(--primary)' : 'var(--border)'};background:${activo ? '#eff6ff' : 'white'};cursor:pointer;font-size:0.85rem">
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${abierta ? '#22c55e' : '#cbd5e1'};margin-right:6px"></span>${esc(p)}
          </button>`;
        }).join('')}
      </div>
    </div>`;
}

function seleccionarCajaAdmin(idx) {
  const p = _cajaPersonasIdx[idx];
  if (p === undefined) return;
  cajaVistaAdmin = p;
  renderCaja();
}

function _rolDeObjetivoCaja(isAdmin) {
  if (!isAdmin) return session.rol;
  if (!cajaVistaAdmin) return null;
  const u = (_rolesParaCaja||[]).find(x => x.nombre === cajaVistaAdmin);
  return u ? u.rol : null;
}

function abrirCaja() {
  if (session.rol === 'admin' && !cajaVistaAdmin) { _info('Selecciona primero de quién es la caja que quieres abrir.'); return; }
  const fondo = +document.getElementById('caja-fondo').value || 0;
  const ahora = new Date();
  const usuarioObjetivo = session.rol === 'admin' ? cajaVistaAdmin : session.nombre;
  const nueva = {
    id: sid(),
    usuario: usuarioObjetivo,
    fecha: today(),
    hora: ahora.toTimeString().slice(0,5),
    fondo,
    movimientos: [],
    cerrada: false
  };
  db.cajas.push(nueva);
  saveDb('cajas');
  renderCaja();
}

          </div>
        </div>
        <p id="mov-pass-error" style="color:#dc2626;font-size:0.82rem;margin-top:8px;display:none">Usuario o contraseña incorrectos, o el usuario no es administrador</p>
      </div>` : ''}
  `, [
    { label: tipo==='entrada'?'⬆️ Registrar Entrada':(requiereAuth ? '🔒 Autorizar y Entregar' : '⬇️ Registrar Salida'),
      cls: tipo==='entrada'?'btn-success':'btn-danger',
      action: () => guardarMovCaja(tipo) },
    { label:'Cancelar', cls:'btn-secondary', action:closeModal }
  ]);
}

async function guardarMovCaja(tipo) {
  const concepto = v('mov-concepto');
  const monto = +v('mov-monto');
  if (!concepto) { _info('Ingresa el concepto'); return; }
  if (!monto || monto <= 0) { _info('Ingresa un monto válido'); return; }

  const requiereAuth = tipo === 'salida' && session.rol !== 'admin';
  let autorizadoPor = null;
  if (requiereAuth) {
    const adminUser = document.getElementById('mov-admin-user')?.value || '';
    const adminPass = document.getElementById('mov-admin-pass')?.value || '';
    const errEl = document.getElementById('mov-pass-error');
    const btn = document.querySelector('#modal .btn-danger');
    if (btn) btn.disabled = true;
    const ok = await verificarPasswordAdmin(adminUser, adminPass);
    if (btn) btn.disabled = false;
    if (!ok) {
      if (errEl) errEl.style.display = 'block';
      return;
    }
    autorizadoPor = adminUser;
  }

  const caja = cajaContexto();
  if (!caja) { closeModal(); return; }
  const ahora = new Date();
  caja.movimientos.push({
    tipo, concepto, monto,
    hora: ahora.toTimeString().slice(0,5),
    usuario: session.nombre,
    ...(autorizadoPor ? { autorizadoPor } : {})
  });
  saveDb('cajas'); closeModal(); renderCaja();
}

function guardarPagoInsumoCaja() {
  const desc = v('ins-desc');
  const cat  = v('ins-cat') || 'Otro';
  const prov = v('ins-proveedor');
  const monto = +v('ins-monto');
  if (!desc) { _info('Describe qué se compró o pagó'); return; }
  if (!monto || monto <= 0) { _info('Ingresa un monto válido'); return; }
  const caja = cajaContexto();
  if (!caja) { closeModal(); return; }
  const concepto = `Insumo [${cat}] — ${desc}${prov ? ' · ' + prov : ''}`;
  caja.movimientos.push({
    tipo: 'salida',
    concepto,
    monto,
    hora: new Date().toTimeString().slice(0, 5),
    usuario: session.nombre,
    esInsumo: true,
    categoriaInsumo: cat,
    proveedor: prov || ''
  });
  saveDb('cajas'); closeModal(); renderCaja();
  showToast(`Pago registrado: $${fmt(monto)} — ${desc}`, '#f59e0b');
}

  } else {
    const items = (db[tipo]||[]).filter(i => (i.cantidad||0) > 0);

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <input id="vc-item" list="vc-item-list" autocomplete="off" placeholder="${items.length ? 'Escribe para buscar...' : 'Sin artículos disponibles'}" style="flex:2;min-width:140px;padding:8px;border:1.5px solid var(--border);border-radius:8px" oninput="vcItemChange()" />
        <datalist id="vc-item-list">${items.map(i=>`<option value="${esc(tipo==='consignacion'?i.producto:i.nombre)}">stock: ${i.cantidad||0}</option>`).join('')}</datalist>
        <input id="vc-qty" type="number" placeholder="Cant." min="1" value="1" style="width:70px;padding:8px;border:1.5px solid var(--border);border-radius:8px" />
        <input id="vc-price" type="number" placeholder="Precio" min="0" step="0.01" style="width:100px;padding:8px;border:1.5px solid var(--border);border-radius:8px" />
        <button class="btn btn-success btn-sm" onclick="vcAddItem()">+ Añadir</button>
      </div>`;

}

// Busca el artículo del tipo dado por nombre exacto (igual criterio que _vSelFindItem).
function _vcFindItem(tipo, nombre) {
  const n = (nombre||'').trim().toLowerCase();
  if (!n) return null;
  return (db[tipo]||[]).find(i => ((tipo==='consignacion'?i.producto:i.nombre)||'').trim().toLowerCase() === n) || null;
}

function vcItemChange() {
  const tipo = v('vc-tipo');
  const item = _vcFindItem(tipo, v('vc-item'));
  const priceInput = document.getElementById('vc-price');
  if (item && priceInput) priceInput.value = round2(item.precioPublico||0);
}

function vcAddItem() {
  const tipo = v('vc-tipo');
  const item = _vcFindItem(tipo, v('vc-item'));
  if (!item) { _info('Escribe y selecciona un artículo válido de la lista'); return; }
  const qty = +v('vc-qty');
  const price = +v('vc-price');
  if (!qty || qty<=0) { _info('Ingresa una cantidad válida'); return; }
  if (price === '' || price < 0 || isNaN(price)) { _info('Ingresa un precio válido'); return; }
  if (qty > (item.cantidad||0)) { _info('No hay suficiente stock ('+(item.cantidad||0)+' disponible)'); return; }
  ventaCajaItems.push({
    producto: tipo==='consignacion'?item.producto:item.nombre,
    cantidad: qty, precio: price,
    _tipo: tipo, _itemId: item.id
  });
  vcUpdateItems();
  vcRenderPicker();
}

function vcAddRep() {
  const id = +v('vc-rep');
  const r = db.reparaciones.find(x=>x.id===id);
  if (!r) { _info('Selecciona una reparación'); return; }
  if (ventaCajaItems.some(i=>i._repId===id)) { _info('Esa reparación ya está en la venta'); return; }
  ventaCajaItems.push({
    producto: 'Reparación ' + (r.folio||('#'+r.id)) + ' — ' + r.cliente,
    cantidad: 1, precio: r.total||0,
    _tipo: 'reparacion', _repId: r.id
  });
  vcUpdateItems();
  vcRenderPicker();
}

function vcUpdateItems() {
  const list = document.getElementById('vc-items-list');
  if (!list) return;
  list.innerHTML = ventaCajaItems.length ? `<table style="width:100%;font-size:0.85rem;border-collapse:collapse">
    <tr style="background:var(--bg)"><th style="padding:6px">Concepto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th></th></tr>
    ${ventaCajaItems.map((i,idx)=>`<tr style="border-top:1px solid var(--border)">
      <td style="padding:6px">${esc(i.producto)}</td><td>${i.cantidad}</td>
      <td>$${fmt(i.precio)}</td><td>$${fmt(i.cantidad*i.precio)}</td>
      <td><button onclick="ventaCajaItems.splice(${idx},1);vcUpdateItems()" style="background:none;border:none;cursor:pointer;color:var(--danger)">✕</button></td>
    </tr>`).join('')}
  </table>` : '<p style="color:#94a3b8;font-size:0.85rem">Sin conceptos. Agrega arriba.</p>';
  const total = ventaCajaItems.reduce((s,i)=>s+i.cantidad*i.precio,0);
  const tv = document.getElementById('vc-total');
  if (tv) tv.textContent = ventaCajaItems.length ? `Total: $${fmt(total)}` : '';
}

function saveVentaCaja() {
  const cliente = v('vc-cliente');
  if (!cliente) { _info('Ingresa el nombre del cliente'); return; }
  if (!ventaCajaItems.length) { _info('Agrega al menos un concepto'); return; }
  const total = ventaCajaItems.reduce((s,i)=>s+i.cantidad*i.precio,0);

  const venta = {
    id: sid(),
    fecha: today(),
    hora: new Date().toTimeString().slice(0,5),
    cliente,
    items: ventaCajaItems.map(i=>({producto:i.producto, cantidad:i.cantidad, precio:i.precio})),
    total,
    estado: 'Pagada',
    usuario: session.nombre,
    formaPago: (document.getElementById('vc-forma')?.value || 'efectivo')
  };

  // Secretaria y auxiliar reflejan la venta en SU PROPIA caja (independiente por usuario),
  // solo si fue cobrada en efectivo. Si fue cheque/transferencia/tarjeta, el dinero no lo
  // recibe físicamente el usuario, así que no debe afectar su caja chica. El administrador
  // tampoco refleja la venta en ninguna caja.
  if ((session.rol === 'secretaria' || session.rol === 'auxiliar') && venta.formaPago === 'efectivo') {
    const caja = cajaActivaOCrear();
    if (caja) venta.cajaSesion = caja.id;
  }

  // Descontar stock / marcar reparaciones como cobradas
  ventaCajaItems.forEach(i => {
    if (i._tipo === 'reparacion') {
      const r = db.reparaciones.find(x=>x.id===i._repId);
      if (r) r.cobrada = true;
    } else if (i._itemId != null) {
      const item = (db[i._tipo]||[]).find(x=>x.id===i._itemId);
      if (item && item.cantidad != null) item.cantidad = Math.max(0, item.cantidad - i.cantidad);
    }
  });

  db.ventas.push(venta);
  saveDb(['ventas','cajas','materia','productos','consignacion','reparaciones']);
  closeModal();
  imprimirTicket(venta.id);
  renderCaja();
}

// Guarda una venta desde Caja Chica usando el modal idéntico a Nueva Venta,
// pero registra el TOTAL COMPLETO en caja (no solo el anticipo) y genera ticket.
function saveVentaDesdeCAja() {
  _ventaFromCaja = false;
  const nombre = v('v-nombre');
  const apellido = v('v-apellido');
  const cliente = [nombre, apellido].filter(Boolean).join(' ');
  if (!cliente) { _info('Ingresa el nombre del cliente'); return; }
  if (!ventaItems.length) { _info('Agrega al menos un producto'); return; }
  const folioManual = v('v-folio').trim();
  if (folioManual && db.ventas.find(x => x.folioPedido === folioManual && x.estado !== 'Cancelada')) {
    _info(`❌ Ya existe un pedido activo con el folio "${folioManual}". Asigna un número diferente.`);
    return;
  }
  const nuevoId = sid();
  const folioPedido = folioManual || _siguienteNotaVenta();
  const ivaEl = document.querySelector('input[name="vt-iva"]:checked');
  const masIva = ivaEl && ivaEl.value === 'mas';
  const subtotal = ventaItems.reduce((s, i) => s + i.cantidad * i.precio, 0);
  const ivaAmt = masIva ? round2(subtotal * 0.16) : 0;
  const total = round2(subtotal + ivaAmt);
  const formaPago = document.getElementById('v-forma-pago')?.value || 'efectivo';

  const venta = {
    id: nuevoId, folioPedido, esPedido: true,
    fecha: v('v-fecha'), cliente,
    ctNombre: nombre, ctApellido: apellido,
    ctCiudad: v('v-ciudad'), ctEstado: v('v-estado'), ctEmpresa: v('v-empresa'),
    ctTelFijo: v('v-telfijo'), ctCelular: v('v-celular'), ctCorreo: v('v-correo'),
    ctDireccion: v('v-direccion'), ctColonia: v('v-colonia'), ctCp: v('v-cp'), ctRfc: v('v-rfc'),
    unidad: v('v-unidad'), tipo: v('v-tipo'), forro: v('v-forro'), color: v('v-color'),
    observaciones: v('v-observaciones'),
    fotos: [..._tempFotosVt],
    items: ventaItems, total, subtotal, iva: masIva, ivaAmount: ivaAmt,
    anticipo: total, saldo: 0,
    estado: v('v-estado-form') || 'Pagada',
    fechaEntrega: v('v-fecha-entrega'),
    usuario: session.nombre, formaPago
  };

  // Descontar stock
  ventaItems.forEach(i => {
    if (i._itemId != null) {
      const item = (db[i._tipo] || []).find(x => x.id === i._itemId);
      if (item && item.cantidad != null) item.cantidad = Math.max(0, item.cantidad - i.cantidad);
    }
  });

  // Registrar TOTAL COMPLETO en caja (via cajaSesion — igual que Generar Venta original)
  if ((session.rol === 'secretaria' || session.rol === 'auxiliar') && formaPago === 'efectivo') {
    const caja = cajaActivaOCrear();
    if (caja) venta.cajaSesion = caja.id;
  }

  upsertCliente({ nombre, apellido, ciudad: v('v-ciudad'), estado: v('v-estado'), empresa: v('v-empresa'), telfijo: v('v-telfijo'), celular: v('v-celular'), correo: v('v-correo'), direccion: v('v-direccion'), colonia: v('v-colonia'), cp: v('v-cp'), rfc: v('v-rfc') });
  db.ventas.push(venta);
  saveDb(['ventas', 'cajas', 'clientes', 'materia', 'productos', 'consignacion']);
  closeModal();
  imprimirTicket(nuevoId);
  renderCaja();
}

function cerrarCaja() {
  const caja = cajaContexto();
  if (!caja) return;
  const movs = caja.movimientos || [];
  const entradas = movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+m.monto,0);
  const salidas  = movs.filter(m=>m.tipo==='salida').reduce((s,m)=>s+m.monto,0);
  const ventasCaja = db.ventas.filter(v=>v.cajaSesion===caja.id);
  const totalVentas = ventasCaja.reduce((s,v)=>s+v.total,0);
  const saldoEsperado = caja.fondo + entradas + totalVentas - salidas;

  showModal('🔒 Cerrar Caja', `
    <div style="background:#f1f5f9;border-radius:10px;padding:16px;margin-bottom:16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:0.88rem">
        <div>Fondo inicial: <strong>$${fmt(caja.fondo)}</strong></div>
        <div>Entradas: <strong style="color:var(--success)">$${fmt(entradas)}</strong></div>
        <div>Ventas: <strong style="color:var(--warning)">$${fmt(totalVentas)}</strong></div>
        <div>Salidas: <strong style="color:var(--danger)">$${fmt(salidas)}</strong></div>
      </div>
      <div style="margin-top:12px;text-align:center;font-size:1.1rem;font-weight:700;color:#7c3aed">
        Saldo esperado: $${fmt(saldoEsperado)}
      </div>
    </div>
    <div class="form-group">
      <label>💵 Efectivo contado en caja</label>
      <input id="caja-conteo" type="number" min="0" step="0.01" placeholder="0.00"
        style="font-size:1.3rem;font-weight:700;text-align:center" oninput="calcDiferencia(${saldoEsperado})" />
    </div>
    <div id="caja-diferencia" style="text-align:center;font-weight:700;margin-top:8px;font-size:1rem"></div>
    <div class="form-group" style="margin-top:10px"><label>Observaciones</label><textarea id="caja-obs" rows="2" placeholder="Notas del cierre..."></textarea></div>
  `, [
    { label:'🔒 Confirmar Cierre', cls:'btn-danger', action:()=>confirmarCierre(saldoEsperado) },
    { label:'Cancelar', cls:'btn-secondary', action:closeModal }
  ]);
}

function calcDiferencia(esperado) {
  const conteo = +document.getElementById('caja-conteo').value || 0;
  const dif = conteo - esperado;
  const el = document.getElementById('caja-diferencia');
  if (!el) return;
  el.textContent = dif === 0 ? '✅ Cuadra perfectamente' : (dif > 0 ? `⬆️ Sobrante: $${fmt(dif)}` : `⬇️ Faltante: $${fmt(Math.abs(dif))}`);
  el.style.color = dif === 0 ? 'var(--success)' : dif > 0 ? 'var(--warning)' : 'var(--danger)';
}

function confirmarCierre(esperado) {
  const caja = cajaContexto();
  const conteo = +v('caja-conteo') || 0;
  const ahora = new Date();
  caja.cerrada = true;
  caja.fechaCierre = today();
  caja.horaCierre = ahora.toTimeString().slice(0,5);
  caja.saldoEsperado = esperado;
  caja.saldoContado = conteo;
  caja.diferencia = conteo - esperado;
  caja.obsCierre = v('caja-obs');
  saveDb('cajas'); closeModal(); renderCaja();
}

let histCajaFiltro = { tipo: 'general', dia: '', semana: '', mes: '', anio: '', desde: '', hasta: '' };

function _isoWeekString(fechaStr) {
  if (!fechaStr) return '';
  const d = new Date(fechaStr + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const week1 = new Date(d.getFullYear(), 0, 4);
  const weekNum = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return `${d.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
}

// Dado un valor de <input type="week"> ('YYYY-Www'), devuelve [lunes, domingo] en formato ISO.
function _isoWeekRange(weekStr) {
  const m = String(weekStr || '').match(/^(\d{4})-W(\d{2})$/);
  if (!m) return [null, null];
  const year = +m[1], week = +m[2];
  const jan4 = new Date(year, 0, 4);
  const jan4Dia = (jan4.getDay() + 6) % 7; // 0 = lunes
  const lunesSemana1 = new Date(jan4); lunesSemana1.setDate(jan4.getDate() - jan4Dia);
  const lunes = new Date(lunesSemana1); lunes.setDate(lunesSemana1.getDate() + (week - 1) * 7);
  const domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6);
  const iso = d => d.toISOString().split('T')[0];
  return [iso(lunes), iso(domingo)];
}

function filtrarHistorialCaja() {
  // Se incluyen tanto las cajas ya cerradas como las que siguen abiertas (p.ej. la del día en
  // curso), para que el usuario pueda ver de inmediato los cobros del día aunque el
  // administrador todavía no haya hecho el corte. Las abiertas se calculan "en vivo".
  //
  // IMPORTANTE: una caja puede llevar varios días abierta (si nadie ha hecho el corte). Mientras
  // sigue abierta, se sigue acumulando actividad cada día, así que se considera "vigente" desde
  // su fecha de apertura hasta HOY (no solo en su fecha de apertura). Por eso el filtro compara
  // por rango de fechas en vez de comparar una sola fecha exacta; de lo contrario, una caja
  // abierta el lunes nunca aparecería al filtrar "hoy" si hoy es jueves.
  let historial = db.cajas.slice();
  if (session.rol !== 'admin') historial = historial.filter(c => c.usuario === session.nombre);
  const hoy = today();
  const enRango = (c, desde, hasta) => {
    const fin = c.cerrada ? c.fecha : hoy;
    return c.fecha <= hasta && fin >= desde;
  };
  if (histCajaFiltro.tipo === 'dia' && histCajaFiltro.dia) {
    historial = historial.filter(c => enRango(c, histCajaFiltro.dia, histCajaFiltro.dia));
  } else if (histCajaFiltro.tipo === 'semana' && histCajaFiltro.semana) {
    const [desde, hasta] = _isoWeekRange(histCajaFiltro.semana);
    historial = desde ? historial.filter(c => enRango(c, desde, hasta)) : historial;
  } else if (histCajaFiltro.tipo === 'mes' && histCajaFiltro.mes) {
    const desde = histCajaFiltro.mes + '-01';
    const ultimoDia = new Date(+histCajaFiltro.mes.slice(0, 4), +histCajaFiltro.mes.slice(5, 7), 0).getDate();
    const hasta = histCajaFiltro.mes + '-' + String(ultimoDia).padStart(2, '0');
    historial = historial.filter(c => enRango(c, desde, hasta));
  } else if (histCajaFiltro.tipo === 'anio' && histCajaFiltro.anio) {
    historial = historial.filter(c => enRango(c, histCajaFiltro.anio + '-01-01', histCajaFiltro.anio + '-12-31'));
  } else if (histCajaFiltro.tipo === 'rango' && histCajaFiltro.desde && histCajaFiltro.hasta) {
    historial = historial.filter(c => enRango(c, histCajaFiltro.desde, histCajaFiltro.hasta));
  }
  return historial.slice().reverse();
}

  const semanaWrap = document.getElementById('hc-semana-wrap');
  const mesWrap = document.getElementById('hc-mes-wrap');

  const rangoWrap = document.getElementById('hc-rango-wrap');
  if (diaWrap) diaWrap.style.display = histCajaFiltro.tipo === 'dia' ? 'block' : 'none';
  if (semanaWrap) semanaWrap.style.display = histCajaFiltro.tipo === 'semana' ? 'block' : 'none';
  if (mesWrap) mesWrap.style.display = histCajaFiltro.tipo === 'mes' ? 'block' : 'none';
  if (anioWrap) anioWrap.style.display = histCajaFiltro.tipo === 'anio' ? 'block' : 'none';
  if (rangoWrap) rangoWrap.style.display = histCajaFiltro.tipo === 'rango' ? 'flex' : 'none';
  if (!wrap) return;
  const historial = filtrarHistorialCaja();
  let totVts = 0, totEnt = 0, totSal = 0, totDif = 0;
  wrap.innerHTML = `
      <div class="table-wrap"><table>
        <tr><th>Fecha</th><th>Usuario</th><th>Fondo</th><th>Ventas</th><th>Entradas</th><th>Salidas</th><th>Esperado</th><th>Contado</th><th>Diferencia</th></tr>
        ${historial.length ? historial.map(c=>{
          const movs = c.movimientos||[];
          const ent = movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+m.monto,0);
          const sal = movs.filter(m=>m.tipo==='salida').reduce((s,m)=>s+m.monto,0);
          const vts = db.ventas.filter(vt=>vt.cajaSesion===c.id).reduce((s,vt)=>s+vt.total,0);
          // Si la caja sigue abierta, el "esperado" se calcula en vivo (igual que en la
          // pantalla principal de Caja Chica); todavía no hay conteo/diferencia porque no
          // se ha hecho el corte.
          const esperado = c.cerrada ? (c.saldoEsperado||0) : (c.fondo + ent + vts - sal);
          const dif = c.diferencia||0;
          totVts += vts; totEnt += ent; totSal += sal;
          if (c.cerrada) totDif += dif;
          return `<tr ${!c.cerrada?'style="background:#fffbeb"':''}>
            <td>${fechaLarga(c.fecha)} ${c.hora} – ${c.cerrada ? (c.horaCierre||'') : '<span style="color:#b45309;font-weight:700">🟡 En curso</span>'}</td>
            <td>${esc(c.usuario)}</td>
            <td>$${fmt(c.fondo)}</td>
            <td style="color:var(--warning)">$${fmt(vts)}</td>
            <td style="color:var(--success)">$${fmt(ent)}</td>
            <td style="color:var(--danger)">$${fmt(sal)}</td>
            <td>$${fmt(esperado)}</td>
            <td>${c.cerrada ? '$'+fmt(c.saldoContado||0) : '<span style="color:#94a3b8">— caja abierta</span>'}</td>
            <td style="color:${!c.cerrada?'#b45309':dif===0?'var(--success)':dif>0?'var(--warning)':'var(--danger)'};font-weight:700">
              ${!c.cerrada?'⏳ Pendiente corte':(dif===0?'✅ Cuadra':dif>0?'+$'+fmt(dif):'-$'+fmt(Math.abs(dif)))}
            </td>
          </tr>`;}).join('') : '<tr><td colspan="9" class="td-empty">Sin cajas en este periodo</td></tr>'}
        ${historial.length ? `<tr style="background:var(--bg);font-weight:700">
          <td colspan="3">Totales (${historial.length} caja${historial.length===1?'':'s'})</td>
          <td style="color:var(--warning)">$${fmt(totVts)}</td>
          <td style="color:var(--success)">$${fmt(totEnt)}</td>
          <td style="color:var(--danger)">$${fmt(totSal)}</td>
          <td colspan="2"></td>
          <td style="color:${totDif===0?'var(--success)':totDif>0?'var(--warning)':'var(--danger)'}">
            ${totDif===0?'✅ Cuadra':totDif>0?'+$'+fmt(totDif):'-$'+fmt(Math.abs(totDif))}
          </td>
        </tr>` : ''}
      </table></div>`;
}

function registrarEntrega() {
  const material = v('ent-material');
  const qty = +v('ent-qty');
  if (!material || qty<=0) { _info('Material y cantidad son obligatorios'); return; }
  const folio = v('ent-folio');
  const bodegaId = +v('ent-bodega');
  const ahora = new Date();
  const entrada = {
    id: sid(), fecha: today(),
    hora: ahora.toTimeString().slice(0,5),
    folio, material, qty,
    unidad: v('ent-unidad'),
    bodegaId,
    entrego: v('ent-entrego') || session.nombre,
    notas: v('ent-notas'),
    usuario: session.nombre
  };
  db.entregas.push(entrada);
  // Rebajar del inventario si existe el producto
  const item = db.materia.find(i=>i.nombre.toLowerCase()===material.toLowerCase());
  if (item) {
    item.cantidad = Math.max(0, item.cantidad - qty);
    item.ultimaEntrega = { fecha:today(), hora:entrada.hora, folio, entrego:entrada.entrego };
  }
  saveDb(item ? ['entregas','materia'] : 'entregas');
  // Limpiar campos
  ['ent-folio','ent-material','ent-notas'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('ent-qty').value = 1;
  renderEntregas();
  _info(`✅ Salida registrada: ${qty} ${v('ent-unidad')||''} de ${material}${item?' — Stock actualizado':''}`);
}

function agregarBodega() {
  const nombre = prompt('Nombre de la nueva bodega:');
  if (!nombre?.trim()) return;
  db.bodegas.push({ id: sid(), nombre: nombre.trim() });
  saveDb('bodegas'); renderEntregas();
}

function eliminarBodega(id) {
  if (db.bodegas.length <= 1) { _info('Debe haber al menos una bodega'); return; }
  if (!confirm('¿Eliminar esta bodega?')) return;
  db.bodegas = db.bodegas.filter(b=>b.id!==id);
  saveDb('bodegas'); renderEntregas();
}

// Variables temporales para la factura que se está cargando
let _cfdiTemp = { datos:null, xmlB64:null, pdfB64:null };

function handleCfdiDrop(event, tipo) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const file = event.dataTransfer.files && event.dataTransfer.files[0];
  if (!file) return;
  if (tipo === 'xml') {
    if (!/\.xml$/i.test(file.name)) { _info('Arrastra un archivo .xml'); return; }
    procesarXmlCfdi({ target: { files: [file] } });
  } else {
    if (!/\.pdf$/i.test(file.name)) { _info('Arrastra un archivo .pdf'); return; }
    procesarPdfCfdi({ target: { files: [file] } });
  }
}

function procesarXmlCfdi(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const xmlText = e.target.result;
    _cfdiTemp.xmlB64 = btoa(unescape(encodeURIComponent(xmlText)));
    const datos = parsearCfdi(xmlText);
    if (!datos) {
      document.getElementById('xml-status').innerHTML = '<span style="color:var(--danger)">❌ No se pudo leer el XML. Verifica que sea un CFDI válido.</span>';
      return;
    }
    _cfdiTemp.datos = datos;
    document.getElementById('xml-status').innerHTML = `<span style="color:var(--success)">✅ ${esc(file.name)} cargado correctamente</span>`;
    mostrarPreviewCfdi(datos);
  };
  reader.readAsText(file, 'UTF-8');
}

function procesarPdfCfdi(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    _cfdiTemp.pdfB64 = e.target.result; // base64 data URL
    document.getElementById('pdf-status').innerHTML = `<span style="color:var(--success)">✅ ${esc(file.name)} cargado</span>`;
  };
  reader.readAsDataURL(file);
}

function parsearCfdi(xmlText) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, 'text/xml');
    if (doc.querySelector('parsererror')) return null;
    // Intentar con prefijos cfdi: y sin prefijo (querySelector no acepta ':' sin escapar, usamos getElementsByTagName)
    const get = (tag) => doc.getElementsByTagName(tag)[0] || doc.getElementsByTagName(tag.replace('cfdi:',''))[0];
    const attr = (el, a) => el?.getAttribute(a) || '';

    const comp = get('cfdi:Comprobante') || doc.documentElement;
    const emisor = get('cfdi:Emisor');
    const receptor = get('cfdi:Receptor');
    const tfd = doc.querySelector('tfd\\:TimbreFiscalDigital') ||
                doc.querySelector('TimbreFiscalDigital') ||
                doc.getElementsByTagNameNS('http://www.sat.gob.mx/TimbreFiscalDigital','TimbreFiscalDigital')[0];

    const conceptos = [];
    const conceptosEl = doc.querySelectorAll('cfdi\\:Concepto, Concepto');
    conceptosEl.forEach(c => {
      conceptos.push({
        descripcion: attr(c,'Descripcion'),
        cantidad: attr(c,'Cantidad'),
        valorUnitario: attr(c,'ValorUnitario'),
        importe: attr(c,'Importe')
      });
    });

    const tipoComprobante = attr(comp,'TipoDeComprobante');
    let total = attr(comp,'Total');
    // Para "Recibo Electrónico de Pago" (CFDI tipo P con Complemento de Pagos),
    // el Total del Comprobante normalmente viene en 0; el importe real está en
    // el "Importe Pagado" de cada Docto Relacionado dentro del complemento de Pagos.
    if (tipoComprobante === 'P') {
      let sumaPagado = 0;
      ['pago20:DoctoRelacionado','pago10:DoctoRelacionado','DoctoRelacionado'].forEach(tag => {
        Array.from(doc.getElementsByTagName(tag)).forEach(el => {
          sumaPagado += parseFloat(el.getAttribute('ImpPagado')) || 0;
        });
      });
      if (sumaPagado > 0) total = String(sumaPagado);
    }

    return {
      version: attr(comp,'Version') || attr(comp,'version'),
      serie: attr(comp,'Serie'),
      folio: attr(comp,'Folio'),
      fecha: attr(comp,'Fecha'),
      formaPago: attr(comp,'FormaPago'),
      metodoPago: attr(comp,'MetodoPago'),
      subTotal: attr(comp,'SubTotal'),
      total,
      moneda: attr(comp,'Moneda') || 'MXN',
      tipoComprobante,
      emisor: attr(emisor,'Nombre'),
      rfcEmisor: attr(emisor,'Rfc'),
      receptor: attr(receptor,'Nombre'),
      rfcReceptor: attr(receptor,'Rfc'),
      usoCfdi: attr(receptor,'UsoCFDI'),
      uuid: attr(tfd,'UUID'),
      fechaTimbrado: attr(tfd,'FechaTimbrado'),
      conceptos
    };
  } catch(e) { return null; }
}

function mostrarPreviewCfdi(d) {
  const preview = document.getElementById('cfdi-preview');
  const datos = document.getElementById('cfdi-datos');
  if (!preview||!datos) return;
  datos.innerHTML = [
    ['Serie/Folio', esc((d.serie||'')+(d.folio||'-'))],
    ['Fecha', fechaLarga(d.fecha)],
    ['Tipo', d.tipoComprobante==='I'?'Ingreso':d.tipoComprobante==='E'?'Egreso':d.tipoComprobante==='P'?'Pago':'Otro'],
    ['Emisor', esc(d.emisor||'-')],
    ['RFC Emisor', esc(d.rfcEmisor||'-')],
    ['Cliente', esc(d.receptor||'-')],
    ['RFC Cliente', esc(d.rfcReceptor||'-')],
    ['Uso CFDI', esc(d.usoCfdi||'-')],
    ['Subtotal', `$${fmt(+d.subTotal||0)}`],

async function guardarFactura() {
  if (!_cfdiTemp.datos) { _info('Primero sube el XML de la factura'); return; }
  const d = _cfdiTemp.datos;
  // Verificar duplicado por UUID
  if (d.uuid && db.facturas.find(f=>f.uuid===d.uuid)) {
    if (!confirm(`Esta factura (UUID: ${d.uuid.substring(0,18)}...) ya está guardada. ¿Guardar de todas formas?`)) return;
  }
  const id = sid();
  const factura = {
    id,
    fechaRegistro: today(),
    serie: d.serie, folio: d.folio,
    fecha: d.fecha,
    emisor: d.emisor, rfcEmisor: d.rfcEmisor,
    receptor: d.receptor, rfcReceptor: d.rfcReceptor,
    usoCfdi: d.usoCfdi, moneda: d.moneda,
    subTotal: d.subTotal, total: d.total,
    formaPago: d.formaPago, metodoPago: d.metodoPago,
    tipoComprobante: d.tipoComprobante,
    uuid: d.uuid, fechaTimbrado: d.fechaTimbrado,
    conceptos: d.conceptos,
    tieneXml: !!_cfdiTemp.xmlB64,
    tienePdf: !!_cfdiTemp.pdfB64,
    usuario: session.nombre
  };
  // Subir XML y PDF a Firebase Storage para que queden permanentes en la nube
  if (storage) {
    const uploads = [];
    if (_cfdiTemp.xmlB64) {
      uploads.push((async () => {
        try {
          const xmlText = decodeURIComponent(escape(atob(_cfdiTemp.xmlB64)));
          const blob = new Blob([xmlText], { type: 'text/xml' });
          const snap = await storage.ref().child(`facturas/${id}/factura.xml`).put(blob);
          factura.xmlUrl = await snap.ref.getDownloadURL();
        } catch(e) { console.error('Error subiendo XML:', e); }
      })());
    }
    if (_cfdiTemp.pdfB64) {
      uploads.push((async () => {
        try {
          const [, b64] = _cfdiTemp.pdfB64.split(',');
          const binary = atob(b64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const blob = new Blob([bytes], { type: 'application/pdf' });
          const snap = await storage.ref().child(`facturas/${id}/factura.pdf`).put(blob);
          factura.pdfUrl = await snap.ref.getDownloadURL();
        } catch(e) { console.error('Error subiendo PDF:', e); }
      })());
    }
    if (uploads.length) {
      // Mostrar indicador de subida
      const btn = document.querySelector('button[onclick="guardarFactura()"]');
      if (btn) { btn.disabled = true; btn.textContent = '⏳ Subiendo archivos…'; }
      await Promise.all(uploads);
      if (btn) { btn.disabled = false; btn.textContent = '💾 Guardar Factura'; }
    }
  }
  db.facturas.push(factura);
  saveDb('facturas');
  cancelarCfdi();
  renderFacturas();
  _info('✅ Factura guardada correctamente');
}

  ['xml-status','pdf-status'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=''; });

function _dataUrlToBlobUrl(dataUrl) {
  const [header, base64] = dataUrl.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: mime }));
}

function verPdfFactura(id) {
  const f = db.facturas.find(x=>x.id===id);
  if (!f) return;
  if (f.pdfUrl) {
    const win = window.open(f.pdfUrl, '_blank');
    if (!win) _info('Tu navegador bloqueó la ventana emergente. Permítela e intenta de nuevo.');
    return;
  }
  // Compatibilidad con facturas antiguas guardadas en localStorage
  if (f.pdfB64) {
    const blobUrl = _dataUrlToBlobUrl(f.pdfB64);
    const win = window.open(blobUrl, '_blank');
    if (!win) _info('Tu navegador bloqueó la ventana emergente. Permítela e intenta de nuevo.');
    return;
  }
  _info('No hay PDF guardado para esta factura');
}

async function descargarXml(id) {
  const f = db.facturas.find(x=>x.id===id);
  if (!f) return;
  let xmlText = null;
  if (f.xmlUrl) {
    try {
      const resp = await fetch(f.xmlUrl);
      xmlText = await resp.text();
    } catch(e) { _info('No se pudo descargar el XML: ' + e.message); return; }
  } else if (f.xmlB64) {
    // Compatibilidad con facturas antiguas
    xmlText = decodeURIComponent(escape(atob(f.xmlB64)));
  } else {
    _info('No hay XML guardado'); return;
  }
  const blob = new Blob([xmlText], {type:'text/xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${f.serie||''}${f.folio||f.uuid?.substring(0,8)||'factura'}.xml`;
  a.click();
  URL.revokeObjectURL(url);
}

function delFactura(id) {
  if (!confirm('¿Eliminar esta factura del sistema?\n(No afecta el portal CFDI)')) return;
  const f = db.facturas.find(x=>x.id===id);
  // Eliminar archivos de Storage si existen
  if (f && storage) {
    if (f.xmlUrl) storage.ref().child(`facturas/${id}/factura.xml`).delete().catch(()=>{});
    if (f.pdfUrl) storage.ref().child(`facturas/${id}/factura.pdf`).delete().catch(()=>{});
  }
  db.facturas = db.facturas.filter(x=>x.id!==id);
  saveDb('facturas'); renderFacturas();
}

function saveRep(id) {

  const matTotal = repItems.reduce((s,i)=>s+i.qty*i.price, 0);
  const obj = {
    id: id||sid(), folio, cliente,
    tel: v('rep-tel'), unidad: v('rep-unidad'),
    fecha: v('rep-fecha'),
    descripcion: v('rep-descripcion'),
    estado: v('rep-estado'),
    materiales: [...repItems],

    usuario: session.nombre,

  saveDb('reparaciones'); closeModal(); renderReparaciones();

function delRep(id) {
  if (!confirm('¿Eliminar esta nota de reparación?')) return;
  db.reparaciones = db.reparaciones.filter(x=>x.id!==id);
  saveDb('reparaciones'); renderReparaciones();
}

function saveCobranza(id) {
  const cliente = v('cob-cliente');
  if (!cliente) { _info('El nombre del cliente o empresa es obligatorio'); return; }
  const fecha = v('cob-fecha');
  if (!fecha) { _info('La fecha es obligatoria'); return; }
  const prev = id ? db.cobranza.find(x=>x.id===id) : null;
  const nuevaRecFecha = v('cob-rec-fecha');
  const obj = {
    id: id||sid(),
    cliente,
    encargado: v('cob-encargado'),
    tel: v('cob-tel'),
    pedido: v('cob-pedido'),
    fecha,
    total: +v('cob-total') || 0,
    credito: v('cob-credito'),
    estado: v('cob-estado'),
    recFecha: nuevaRecFecha,
    recNota: v('cob-rec-nota'),
    recHecho: prev && prev.recFecha === nuevaRecFecha ? (prev.recHecho||false) : false,
    abonos: prev ? (prev.abonos||[]) : [],
    usuario: session.nombre
  };
  if (id) { const idx=db.cobranza.findIndex(x=>x.id===id); db.cobranza[idx]=obj; }
  else db.cobranza.push(obj);
  saveDb('cobranza'); closeModal(); renderCobranza();
}

    </div>
  `, [

function registrarAbonoCobranza(id) {
  const c = db.cobranza.find(x=>x.id===id);
  if (!c) return;
  const monto = +v('abono-monto');
  const saldo = cobranzaSaldo(c);
  if (!monto || monto <= 0) { _info('Ingresa un monto válido'); return; }
  if (monto > saldo + 0.01) { _info('El abono no puede ser mayor al saldo pendiente ($' + fmt(saldo) + ')'); return; }
  const formaPago = document.getElementById('abono-forma')?.value || 'efectivo';

  // El abono de secretaria y auxiliar se refleja en SU PROPIA caja chica (cada una es independiente,
  // por usuario), solo si fue en efectivo. El abono del administrador, o cualquier abono que no sea
  // en efectivo (cheque/transferencia/tarjeta), no se refleja en ninguna caja.
  let caja = null;
  if ((session.rol === 'secretaria' || session.rol === 'auxiliar') && formaPago === 'efectivo') {
    caja = cajaActivaOCrear();
  }

  const ahora = new Date();
  c.abonos = c.abonos || [];
  c.abonos.push({
    monto,
    fecha: today(),
    hora: ahora.toTimeString().slice(0,5),
    usuario: session.nombre,
    rol: session.rol,
    formaPago
  });
  if (cobranzaSaldo(c) <= 0.01) c.estado = 'Pagado';

  if (caja) {
    caja.movimientos.push({
      tipo: 'entrada',
      concepto: 'Abono de cobranza — ' + c.cliente,
      monto,
      hora: ahora.toTimeString().slice(0,5),
      usuario: session.nombre
    });
  }

  saveDb(caja ? ['cobranza','cajas'] : 'cobranza'); closeModal(); renderCobranza();
}

async function confirmarDescuentoCobranza(id) {
  const c = db.cobranza.find(x=>x.id===id);
  if (!c) return;
  const saldo = cobranzaSaldo(c);
  const monto = +v('desc-monto');
  const motivo = v('desc-motivo');
  if (!monto || monto <= 0) { _info('Ingresa un monto válido'); return; }
  if (monto > saldo + 0.01) { _info('El descuento no puede ser mayor al saldo pendiente ($' + fmt(saldo) + ')'); return; }

  let autorizadoPor = session.nombre;
  if (!can(['admin'])) {
    const adminUser = v('admin-user-desc');
    const pass = v('admin-pass-desc');
    const errEl = document.getElementById('desc-pass-error');
    const btn = document.querySelector('#modal .btn-primary');
    if (btn) btn.disabled = true;
    const ok = await verificarPasswordAdmin(adminUser, pass);
    if (btn) btn.disabled = false;
    if (!ok) {
      if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Usuario o contraseña incorrectos'; }
      return;
    }
    autorizadoPor = adminUser;
  }

  const ahora = new Date();
  c.abonos = c.abonos || [];
  c.abonos.push({
    monto,
    fecha: today(),
    hora: ahora.toTimeString().slice(0,5),
    usuario: session.nombre,
    rol: session.rol,
    descuento: true,
    motivo,
    autorizadoPor
  });
  if (cobranzaSaldo(c) <= 0.01) c.estado = 'Pagado';

  saveDb('cobranza'); closeModal(); renderCobranza();
  setTimeout(() => _info('✓ Descuento aplicado correctamente.'), 100);
}
window['confirmarDescuentoCobranza'] = confirmarDescuentoCobranza;

async function confirmarCancelarDeudaCobranza(id) {

    if (btn) btn.disabled = false;
    if (!ok) {
      if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Usuario o contraseña incorrectos'; }
      return;
    }
    autorizadoPor = adminUser;
  }

  const ahora = new Date();
  c.abonos = c.abonos || [];
  c.abonos.push({
    monto: saldo,
    fecha: today(),
    hora: ahora.toTimeString().slice(0,5),

    rol: session.rol,

window['confirmarCancelarDeudaCobranza'] = confirmarCancelarDeudaCobranza;

function marcarCobranzaRecHecho(id) {
  const c = db.cobranza.find(x=>x.id===id);
  if (!c) return;
  c.recHecho = true;
  saveDb('cobranza');
  renderCobranza();
}

function delCobranza(id) {
  const c = db.cobranza.find(x=>x.id===id);
  if (!c) return;
  if (c.estado !== 'Pagado') {
    _info('Este registro no se puede cancelar todavía.\n\nLa cuenta de "' + c.cliente + '" debe quedar marcada como "Pagado" antes de poder eliminarse.');
    return;
  }
  if (!confirm('¿Eliminar el registro de cobranza de "' + c.cliente + '"? Esta cuenta ya está marcada como pagada.')) return;
  db.cobranza = db.cobranza.filter(x=>x.id!==id);
  save('gp_cobranza', db.cobranza); // localStorage
  if (FIREBASE_ENABLED) fsDeleteFromCollection('cobranza', id); // Firestore directo, sin merge
  renderCobranza();
}

function saveVehiculo(id) {
  if (!canEditarVehiculos()) return;
  const nombre = v('veh-nombre');
  if (!nombre) { _info('El nombre del vehículo es obligatorio'); return; }
  const recAfinacion = !!document.getElementById('veh-rec-afinacion')?.checked;
  const recAfinacionFecha = v('veh-rec-afinacion-fecha');
  if (recAfinacion && !recAfinacionFecha) { _info('Indica la fecha para recordar la afinación, o desmarca esa opción'); return; }
  const vencimiento = v('veh-vencimiento');
  const recPoliza = !!document.getElementById('veh-rec-poliza')?.checked;
  if (recPoliza && !vencimiento) { _info('Para recordar la renovación de la póliza, primero captura su fecha de vencimiento'); return; }

  const prev = id ? db.vehiculos.find(x=>x.id===id) : null;
  const obj = {
    id: id||sid(),
    nombre,
    afinacionFecha: v('veh-afinacion-fecha'),
    kilometraje: parseFloat(v('veh-km')) || 0,
    poliza: v('veh-poliza'),
    vencimiento,
    recAfinacion,
    recAfinacionFecha,
    recAfinacionHecho: prev && recAfinacion && prev.recAfinacionFecha === recAfinacionFecha ? (prev.recAfinacionHecho||false) : false,
    recPoliza,
    recPolizaHecho: prev && recPoliza && prev.vencimiento === vencimiento ? (prev.recPolizaHecho||false) : false,
    usuario: session.nombre
  };
  if (id) { const idx=db.vehiculos.findIndex(x=>x.id===id); db.vehiculos[idx]=obj; }
  else db.vehiculos.push(obj);
  saveDb('vehiculos'); closeModal(); renderVehiculos();
}

function marcarVehiculoRec(id, campo) {
  if (!canEditarVehiculos()) return;
  const ve = db.vehiculos.find(x=>x.id===id);
  if (!ve) return;
  ve[campo] = true;
  saveDb('vehiculos');
  renderVehiculos();
}

function delVehiculo(id) {
  if (!canEditarVehiculos()) return;
  const ve = db.vehiculos.find(x=>x.id===id);
  if (!ve) return;
  if (!confirm('¿Eliminar el vehículo "' + ve.nombre + '" del control de vehículos?')) return;
  db.vehiculos = db.vehiculos.filter(x=>x.id!==id);
  save('gp_vehiculos', db.vehiculos); // localStorage
  if (FIREBASE_ENABLED) fsDeleteFromCollection('vehiculos', id); // Firestore directo, sin merge
  renderVehiculos();
}

  return ['admin','secretaria','auxiliar'].includes(session.rol);

}

    ? '<p style="color:#94a3b8;text-align:center;padding:16px">No hay herramientas asignadas</p>'

      <div style="margin-bottom:16px">
        <div style="font-weight:600;color:#334155;margin-bottom:6px;padding:6px 10px;background:#f1f5f9;border-radius:6px">👷 ${esc(trab)}</div>

  const historialHTML = historial.length === 0

    : `<div class="table-wrap"><table class="data-table"><thead><tr><th style="white-space:nowrap">Fecha</th><th>Tipo</th><th>Herramienta</th><th>Trabajador</th><th>Cant.</th><th>Operó</th></tr></thead><tbody>
      ${[...historial].reverse().map(h => `<tr>
        <td style="font-size:0.82rem;white-space:nowrap">${h.fecha||''}</td>
        <td><span class="badge ${h.tipo==='asignacion'?'badge-blue':'badge-green'}">${h.tipo==='asignacion'?'Asignación':'Devolución'}</span></td>

function _saveNuevaHerramienta() {
  const nombre = document.getElementById('nh-nombre').value.trim();
  if (!nombre) { _info('Ingresa el nombre de la herramienta'); return; }
  const cantidad = parseInt(document.getElementById('nh-cantidad').value) || 0;
  if (cantidad < 1) { _info('La cantidad debe ser al menos 1'); return; }
  const estado = document.getElementById('nh-estado').value;
  db.herramientas.push({ id: sid(), nombre, cantidad, estado });
  saveDb(['herramientas']);
  closeModal();
  renderHerramientas();
}

function openAsignarHerramientaModal(herramientaId) {
  const h = db.herramientas.find(x => x.id === herramientaId);
  if (!h) return;
  showModal(`Asignar: ${h.nombre}`, `
    <div class="form-group"><label>Trabajador</label><input id="as-trabajador" class="form-control" placeholder="Nombre del trabajador" /></div>
    <div class="form-group"><label>Cantidad (disponible: ${h.cantidad})</label><input id="as-cantidad" class="form-control" type="number" min="1" max="${h.cantidad}" value="1" /></div>
    <input type="hidden" id="as-herr-id" value="${herramientaId}" />`, [
    { label:'Asignar', cls:'btn-primary', action: _saveAsignarHerramienta },
    { label:'Cancelar', cls:'btn-secondary', action: closeModal }
  ]);
}

function _saveAsignarHerramienta() {
  const herrId = parseInt(document.getElementById('as-herr-id').value);
  const h = db.herramientas.find(x => x.id === herrId);
  if (!h) return;
  const trabajador = document.getElementById('as-trabajador').value.trim();
  if (!trabajador) { _info('Ingresa el nombre del trabajador'); return; }
  const cantidad = parseInt(document.getElementById('as-cantidad').value) || 0;
  if (cantidad < 1 || cantidad > h.cantidad) { _info(`Cantidad inválida. Disponible: ${h.cantidad}`); return; }

  const fecha = new Date().toLocaleDateString('es-MX');
  const entrego = session.nombre || session.user;

  // Descontar de bodega
  h.cantidad -= cantidad;

  // Registrar asignación
  db.herramientasAsignadas.push({ id: sid(), herramientaId: herrId, herramientaNombre: h.nombre, trabajador, cantidad, fecha, entrego });

  // Historial
  db.herramientasHistorial.push({ id: sid(), tipo: 'asignacion', herramientaNombre: h.nombre, trabajador, cantidad, fecha, opero: entrego });

  saveDb(['herramientas','herramientasAsignadas','herramientasHistorial']);
  closeModal();
  renderHerramientas();
}

function openDevolverHerramientaModal(asignacionId) {
  const a = db.herramientasAsignadas.find(x => x.id === asignacionId);
  if (!a) return;
  showModal(`Recibir devolución: ${a.herramientaNombre}`, `
    <p style="margin-bottom:12px">Trabajador: <strong>${esc(a.trabajador)}</strong></p>
    <div class="form-group"><label>Cantidad a devolver (asignadas: ${a.cantidad})</label>
      <input id="dev-cantidad" class="form-control" type="number" min="1" max="${a.cantidad}" value="${a.cantidad}" />
    </div>
    <input type="hidden" id="dev-asig-id" value="${asignacionId}" />`, [
    { label:'Confirmar devolución', cls:'btn-primary', action: _saveDevolverHerramienta },
    { label:'Cancelar', cls:'btn-secondary', action: closeModal }
  ]);
}

function _saveDevolverHerramienta() {
  const asigId = parseInt(document.getElementById('dev-asig-id').value);
  const a = db.herramientasAsignadas.find(x => x.id === asigId);
  if (!a) return;
  const cantidad = parseInt(document.getElementById('dev-cantidad').value) || 0;
  if (cantidad < 1 || cantidad > a.cantidad) { _info(`Cantidad inválida. Asignadas: ${a.cantidad}`); return; }

  const h = db.herramientas.find(x => x.id === a.herramientaId);
  const fecha = new Date().toLocaleDateString('es-MX');
  const opero = session.nombre || session.user;

  // Regresar a bodega
  if (h) h.cantidad += cantidad;

  // Actualizar o eliminar asignación
  if (cantidad >= a.cantidad) {
    db.herramientasAsignadas = db.herramientasAsignadas.filter(x => x.id !== asigId);
  } else {
    a.cantidad -= cantidad;
  }

  // Historial
  db.herramientasHistorial.push({ id: sid(), tipo: 'devolucion', herramientaNombre: a.herramientaNombre, trabajador: a.trabajador, cantidad, fecha, opero });

  saveDb(['herramientas','herramientasAsignadas','herramientasHistorial']);
  closeModal();
  renderHerramientas();
}

  setTimeout(()=>renderReparaciones(), 500);
}

let _emUltimoPedido = '';
let _emItems = [];

// Permite iniciar el seguimiento de producción de un pedido directamente, sin

function agregarProduccionManual() {
